/* ============================== PROV ==============================
   Rättningen ligger i scoreAttempt(). I skarp drift ersätts den av
   POST /api/attempts/:id/submit — facit lämnar då aldrig servern.       */
function drawItems(q){
  let items = (q.items||[]).slice();
  if(q.draw && q.draw.count && q.draw.count < items.length){
    for(let i=items.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    items = items.slice(0, q.draw.count);
  }
  return items.map(it => {
    const c2 = Object.assign({}, it);
    if(q.shuffleOptions && c2.options){
      c2.options = c2.options.slice();
      for(let i=c2.options.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [c2.options[i],c2.options[j]]=[c2.options[j],c2.options[i]]; }
    }
    if(c2.type === 'ordering' && c2.options){
      c2.options = c2.options.slice();
      for(let i=c2.options.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [c2.options[i],c2.options[j]]=[c2.options[j],c2.options[i]]; }
    }
    return c2;
  });
}
function scoreAttempt(q, items, answers){
  let got = 0, max = 0;
  const per = items.map(it => {
    const k = (KEY && KEY.keys) ? KEY.keys[it.id] : null;
    const pts = it.points || 1;
    max += pts;
    const a = answers[it.id];
    let ok = false;
    if(k){
      if(it.type === 'ordering') ok = Array.isArray(a) && a.join('|') === (k.order||[]).join('|');
      else {
        const want = (k.correct||[]).slice().sort().join('|');
        const give = (Array.isArray(a)?a:(a==null?[]:[a])).slice().sort().join('|');
        ok = want !== '' && want === give;
      }
    }
    if(ok) got += pts;
    return {id:it.id, ok, item:it, key:k};
  });
  const score = max ? Math.round(got/max*100) : 0;
  return {score, passed: score >= Math.round((q.passScore||0.8)*100), per};
}

function viewQuiz(){
  const c = course(route.courseId);
  const app = APP(); app.replaceChildren();
  if(!c || !c.quizId){ app.append(h('div',{cls:'nores',text:'Kursen har inget prov.'})); return; }
  /* Låst kurs: ingen lektion, inget prov, ingen händelse i loggen. Den som
     skriver in adressen för hand landar på kursens skyltfönster. */
  if(isLocked(c)){ go('#/kurs/' + c.id); return; }
  const q = quizDef(c.quizId);
  if(!q){ app.append(h('div',{cls:'nores',text:'Provet saknas i innehållsfilen.'})); return; }
  const st = courseState(c);
  const maxA = (q.attempts && q.attempts.max) || 3;
  const left = Math.max(0, maxA - st.attempts);

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:c.title,onclick:()=>go('#/kurs/'+c.id)}),
    h('span',{text:'/'}), h('span',{text:'Prov'})));

  if(!quizRun || quizRun.quizId !== q.id || quizRun.courseId !== c.id){
    // intro
    const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
    const b = card.firstChild;
    b.append(h('h1',{text: q.title || 'Kunskapstest'}));
    if(st.passed) b.append(h('div',{cls:'banner ok'},
      h('span',{text:t('Du är redan godkänd med %1%. Du kan göra om provet om du vill.', st.best)})));
    b.append(h('ul',null,
      h('li',{text: t('%1 frågor, slumpvis dragna', q.draw?q.draw.count:(q.items||[]).length)}),
      h('li',{text:t('Godkänt vid %1%', Math.round((q.passScore||0.8)*100))}),
      h('li',{text:'Ingen tidsgräns'}),
      h('li',{text: t('%1 av %2 försök kvar', left, maxA)}),
      h('li',{text:'Fel svar länkar tillbaka till rätt lektion'})));
    if(st.next) b.append(h('div',{cls:'banner warn'},
      h('span',{text:'Du har lektioner kvar i kursen. Du får göra provet ändå.'})));
    const start = h('button',{cls:'btn primary lg',type:'button',text:'Starta provet',
      onclick:()=>{
        quizRun = {quizId:q.id, courseId:c.id, items:drawItems(q), answers:{}, i:0, result:null};
        logEvent('started','quiz',q.id,{courseId:c.id});
        render();
      }});
    if(left <= 0 && !st.passed){ start.disabled = true;
      b.append(h('div',{cls:'banner err'},h('span',{text:'Inga försök kvar. Kontakta din platsansvarige.'}))); }
    b.append(h('div',{cls:'row',style:'margin-top:16px'}, start,
      h('button',{cls:'btn ghost',type:'button',text:'Tillbaka',onclick:()=>go('#/kurs/'+c.id)})));
    app.append(card);
    return;
  }

  if(quizRun.result){ renderResult(app, c, q); return; }

  const items = quizRun.items;
  const it = items[quizRun.i];
  const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  b.append(h('div',{cls:'qhead'},
    h('div',{style:'flex:1'}, progBar(Math.round(quizRun.i/items.length*100))),
    h('div',{cls:'qn',text:t('Fråga %1 av %2', quizRun.i+1, items.length)})));
  if(it.intro) b.append(h('p',{cls:'muted'},inline(it.intro)));
  b.append(h('p',{cls:'qstem'},inline(it.stem)));

  if(it.type === 'ordering'){
    const order = quizRun.answers[it.id] || it.options.map(o=>o.id);
    quizRun.answers[it.id] = order;
    const ul = h('ol',{cls:'ordl'});
    const paint = () => {
      ul.replaceChildren(...order.map((oid,idx) => {
        const o = it.options.find(x=>x.id===oid);
        return h('li',null,
          h('span',{cls:'oi',text:(idx+1)+'. '+o.text}),
          h('span',{cls:'ordbtns'},
            h('button',{cls:'btn sm',type:'button','aria-label':'Flytta upp',text:'↑',disabled:idx===0||null,
              onclick:()=>{ [order[idx-1],order[idx]]=[order[idx],order[idx-1]]; paint(); }}),
            h('button',{cls:'btn sm',type:'button','aria-label':'Flytta ner',text:'↓',disabled:idx===order.length-1||null,
              onclick:()=>{ [order[idx+1],order[idx]]=[order[idx],order[idx+1]]; paint(); }})));
      }));
    };
    paint();
    b.append(ul);
  } else {
    const multi = it.type === 'multi';
    const opts = h('div',{cls:'opts',role: multi?'group':'radiogroup'});
    for(const o of (it.options||[])){
      const cur = quizRun.answers[it.id];
      const on = multi ? (cur||[]).includes(o.id) : cur === o.id;
      const inp = h('input',{type: multi?'checkbox':'radio', name:'q_'+it.id, checked:on||null});
      const lab = h('label',{cls:'opt'+(on?' on':'')}, inp, h('span',{text:o.text}));
      inp.addEventListener('change', () => {
        if(multi){
          const s = new Set(quizRun.answers[it.id]||[]);
          inp.checked ? s.add(o.id) : s.delete(o.id);
          quizRun.answers[it.id] = [...s];
        } else quizRun.answers[it.id] = o.id;
        render();
      });
      opts.append(lab);
    }
    b.append(opts);
  }

  const answered = quizRun.answers[it.id] != null &&
    (!Array.isArray(quizRun.answers[it.id]) || quizRun.answers[it.id].length > 0);
  const last = quizRun.i === items.length - 1;
  b.append(h('div',{cls:'row'},
    h('button',{cls:'btn',type:'button',text:'Föregående',disabled: quizRun.i===0||null,
      onclick:()=>{ quizRun.i--; render(); }}),
    h('div',{cls:'spacer'}),
    h('button',{cls:'btn primary',type:'button',text: last?'Lämna in':'Nästa',disabled:!answered||null,
      onclick:()=>{
        if(!last){ quizRun.i++; render(); return; }
        const r = scoreAttempt(q, items, quizRun.answers);
        quizRun.result = r;
        logEvent(r.passed?'passed':'failed','quiz',q.id,{courseId:c.id, courseVersion:c.version},
          {score:r.score, of:items.length});
        if(r.passed && maybeCompleteCourse(c)) toast('Kursen är klar');
        render();
      }})));
  app.append(card);
}

function renderResult(app, c, q){
  const r = quizRun.result;
  const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  b.append(h('h1',{text: r.passed ? 'Godkänd' : 'Inte godkänd den här gången'}));
  b.append(h('div',{cls:'banner '+(r.passed?'ok':'warn')},
    h('span',{text:t('Resultat %1% · gränsen går vid %2%', r.score,
                      Math.round((q.passScore||0.8)*100))})));
  if(!r.passed) b.append(h('p',{text:'Nedan står vad som blev fel och var du läser om det.'}));

  for(const p of r.per){
    if(p.ok && r.passed) continue;                 // vid godkänt visas bara det som blev fel
    const box = h('div',{cls:'res '+(p.ok?'good':'bad')});
    box.append(h('div',{cls:'rq'},inline(p.item.stem)));
    box.append(h('div',{cls:'small',style:'color:'+(p.ok?'var(--ok)':'var(--err)'),
      text: p.ok ? 'Rätt' : 'Fel svar'}));
    /* Klätterverket: frågans förklaring, om redaktören skrivit en. Att få
       veta VARFÖR är det som gör att ett fel svar lär något. */
    if(p.item.why) box.append(h('div',{cls:'why'}, h('b',{text:t('Varför') + ': '}), inline(p.item.why)));
    if(!p.ok && p.key && p.key.remediation){
      const [lid, frag] = String(p.key.remediation).split('#');
      const l = lesson(lid);
      if(l) box.append(h('div',{style:'margin-top:8px'},
        h('button',{cls:'btn sm',type:'button',
          text: t('Läs om: %1', l.title) + (frag ? ' (' + t('vid %1s', frag.replace('at','').replace('=','')) + ')' : ''),
          onclick:()=>{ quizRun = null; go('#/lektion/'+c.id+'/'+lid); }})));
    }
    b.append(box);
  }
  const st = courseState(c);
  const maxA = (q.attempts && q.attempts.max) || 3;
  b.append(h('div',{cls:'row',style:'margin-top:16px'},
    h('button',{cls:'btn',type:'button',text:'Till kursen',onclick:()=>{ quizRun=null; go('#/kurs/'+c.id); }}),
    r.passed && c.certificate && c.certificate.issue
      ? h('button',{cls:'btn primary',type:'button',text:'Hämta ditt intyg',
          onclick:()=>{ quizRun=null; go('#/intyg'); }})
      : (st.attempts < maxA
          ? h('button',{cls:'btn primary',type:'button',text:'Gör om provet',
              onclick:()=>{ quizRun=null; render(); }})
          : h('span',{cls:'small muted',text:'Inga försök kvar.'}))));
  app.append(card);
}

   Tre nivåer: översikt per kurs, drilldown till namnlista, och intygsvy.
   Aggregeringen sker över alla personer i organisationen — i skarp drift
   från servern, här ur den lokala loggen.                              */
const RSTATUS = {
  ej:    ['n',    'Ej påbörjad'],
  pagar: ['plan', 'Pågår'],
  klar:  ['fakt', 'Klar']
};
function statusTag(st){
  const [cls, label] = RSTATUS[st] || ['n','–'];
  return h('span',{cls:'tag '+cls, text:label});
}

  const sc  = reportScope();

/* ---------------- Intyg i organisationen ---------------- */
function viewReportCerts(){
  const app = APP(); app.replaceChildren();
  auditAccess('intyg', reportScope());
  app.append(reportHeader('cert'));

  const alla = reportScope() === '*';
  const all = orgCertificates();
  const people = orgPeople();
  let f = 'giltiga';
  let q = '';

  const wrap = h('div');
  const draw = () => {
    wrap.replaceChildren();
    const needle = q.trim().toLowerCase();
    const list = all
      .filter(c =>
        f==='alla' ? true :
        f==='snart' ? (c.valid && dagarTill(c.validUntil) < 90) :
        f==='utgangna' ? !c.valid : c.valid)
      /* Supportfallet: någon ringer och undrar om en namngiven person har
         ett giltigt intyg. Sökningen ska hitta hen på namn, adress, kurs
         eller verifikationskod utan att man först måste veta vilken kund
         hen tillhör.                                                    */
      .filter(c => !needle || [c.name, c.userId, c.title, c.code, c.tenantName||'']
        .some(x => String(x).toLowerCase().includes(needle)));

    if(!list.length){
      wrap.append(h('div',{cls:'card'},h('div',{cls:'nores',
        text: needle ? t('Ingen träff på "%1" i den gruppen.', q.trim())
          : f==='alla' ? 'Inga intyg har utfärdats ännu.' : 'Inga intyg i den gruppen.'})));
    } else {
      const tw = h('div',{cls:'card'},h('div',{cls:'tw'}));
      const tbl = h('table');
      tbl.append(h('thead',null,h('tr',null,
        ['Namn', ...(alla?['Anläggning']:[]), 'E-post','Utbildning','Utfärdat','Giltigt till','Kvar','Resultat','Verifikationskod']
          .map(x=>h('th',{text:x})))));

            : d < 90 ? h('span',{cls:'tag warn',text:d + ' dagar'})
            : h('span',{cls:'small muted',text:t('%1 mån', Math.round(d/30))})),
          h('td',null,h('span',{cls:'tag fakt',text:cert.score+'%'})),
          h('td',{cls:'mono small',text:cert.code})));

          onclick:()=>copyText([...new Set(list.map(c=>c.userId))].join('; '), 'Adresser kopierade')}),
        h('button',{cls:'btn',type:'button',text:'Exportera (CSV)',

            ['Namn', ...(alla?['Anläggning']:[]), 'E-post','Utbildning','Utfärdat','Giltigt till','Resultat','Verifikationskod'],
            list.map(c=>[c.name, ...(alla?[c.tenantName||'']:[]), c.userId,c.title,c.issued,c.validUntil,c.score+'%',c.code]))}),
        h('div',{cls:'spacer'}),
        h('span',{cls:'small muted',text: t('%1 av %2 intyg', list.length, all.length)})));
    }

    kpi('Går ut inom 90 dagar', String(giltiga.filter(c=>dagarTill(c.validUntil)<90).length),
        'behöver förnyas', giltiga.filter(c=>dagarTill(c.validUntil)<90).length ? 'warn' : '')));

  const chips = h('div',{cls:'row',style:'margin:0 0 14px'});
  for(const [id,label] of [['giltiga','Giltiga'],['snart','Går ut inom 90 dagar'],
                           ['utgangna','Utgångna'],['alla','Alla']]){
    const b = h('button',{cls:'btn sm'+(f===id?' primary':''),type:'button',text:label,
      onclick:()=>{ f=id; [...chips.children].forEach(x=>x.classList.remove('primary'));

  app.append(chips, wrap);
  draw();
}

/* ---------------- små verktyg ---------------- */
function copyText(txt, msg){
  const done = () => toast(msg || 'Kopierat');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => fallback());
  } else fallback();
  function fallback(){
    const ta = h('textarea',{style:'position:fixed;left:-9999px'});
    ta.value = txt; document.body.append(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('Kunde inte kopiera — markera i tabellen i stället'); }
    ta.remove();
  }
}
function exportCsv(name, head, rows){
  const q = v => {
    const s = String(v==null?'':v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const b = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = h('a',{href:URL.createObjectURL(b), download:name});
  document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Exporterat');
}

/* ============================== ANVÄNDARE ==============================
   Speglar den åtkomstmodell förslaget beskriver: verifierad e-post plus
   domänmatchning mot kundens registrerade domäner. Verifieringslänken
   skickas av servern i skarp drift — här hoppas det steget över.        */
const FREEMAIL = ['gmail.com','hotmail.com','outlook.com','live.se','yahoo.com','icloud.com','msn.com'];
function emailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }
function domainOf(e){ return String(e).split('@')[1]?.toLowerCase() || ''; }
function domainVerdict(e){
  const d = domainOf(e);
  /* Klätterverket: instruktörer och extrapersonal har ofta bara en privat
     adress. Inställningen allowFreemail avgör om sådana släpps in. */
  if(FREEMAIL.includes(d) && !(C.settings && C.settings.allowFreemail))
    return {ok:false, msg:'Använd din tjänsteadress — fria e-postkonton släpps inte in.'};

  /* Cliras egna adresser blir en Clira-roll med insyn över kundgränsen.
     I skarp drift kommer rollen från eSource och kontrolleras där; här
     räcker domänen för att kunna visa vyn.                            */
  if(isCliraEmail(e)) return {ok:true, review:false, clira:true,
    msg:'Central adress: du får insyn i samtliga anläggningar. Uppslagen loggas.'};

  const cust = customerFor(e) || demoTenantFor(e);
  if(cust) return {ok:true, review:false, customer:cust, msg:t('Du kopplas till %1.', cust.name)};

  const allow = (C.settings && C.settings.emailDomains) || [];
  if(allow.some(x => d === x.toLowerCase() || d.endsWith('.' + x.toLowerCase())))
    return {ok:true, msg:'', review:false};

  if(!(C.customers||[]).length && !allow.length) return {ok:true, msg:'', review:false};
  /* Har ingen anläggning domäner väljer man anläggning i listan i stället —
     då finns inget att granska. */
  if(!(C.customers||[]).some(c => (c.domains||[]).length)) return {ok:true, msg:'', review:false};

  return {ok:true, review:true,
    msg:'Adressen hör inte till någon registrerad anläggning. I skarp drift hamnar ansökan i granskningskö hos utbildningsansvarig.'};
}
function askUser(force){
  return new Promise(res => {
    modal('narrow', force ? 'Byt användare' : 'Välkommen till Klätterverket Academy', (m, close) => {
      m.append(h('p',{cls:'muted',text:'Ditt namn står på intyget. Välj den anläggning du främst jobbar på — då hamnar dina framsteg i rätt rapport.'}));
      const g = h('div',{cls:'fgrid'});
      const nIn = h('input',{type:'text',value: P.user?P.user.name:'',placeholder:'För- och efternamn'});
      const eIn = h('input',{type:'email',value: P.user?P.user.email:'',placeholder:'namn@exempel.se'});
      const err = h('div',{cls:'hint',style:'color:var(--err)'});
      const note = h('div',{cls:'hint'});
      /* Klätterverket: alla anläggningar delar e-postdomän, så domänen kan
         inte avgöra var man jobbar. Man väljer själv — och matchar adressen
         ändå en anläggning med egen domän väljs den automatiskt. */
      const halls = (C.customers||[]);
      const hSel = halls.length ? h('select',{}) : null;
      if(hSel){
        hSel.append(h('option',{value:'',text:'Välj anläggning…'}));
        for(const cu of halls) hSel.append(h('option',{value:cu.id,text:cu.name}));
        if(P.user && P.user.tenantId && halls.some(x => x.id === P.user.tenantId)) hSel.value = P.user.tenantId;
      }
      g.append(h('div',{cls:'fld full'},h('label',{text:'Namn'}),nIn),
               h('div',{cls:'fld full'},h('label',{text:'E-postadress'}),eIn,note,err),
               hSel ? h('div',{cls:'fld full'},h('label',{text:'Anläggning'}),hSel) : null);
      m.append(g);
      const check = () => {
        note.textContent = ''; err.textContent = '';
        const v = eIn.value.trim();
        if(!v) return;
        if(!emailOk(v)){ err.textContent = 'Det ser inte ut som en e-postadress.'; return; }
        const d = domainVerdict(v);
        if(!d.ok){ err.textContent = d.msg; return; }
        if(d.msg){
          note.textContent = d.msg;
          note.style.color = d.customer ? 'var(--ok)' : d.clira ? 'var(--brand)' : '';
        }
        if(hSel){
          if(d.customer && !d.customer.demo){ hSel.value = d.customer.id; hSel.disabled = true; }
          else hSel.disabled = false;
        }
      };
      eIn.addEventListener('input', check);
      const save = h('button',{cls:'btn primary',type:'button',text:'Fortsätt',onclick:()=>{
        const n = nIn.value.trim(), e = eIn.value.trim().toLowerCase();
        if(n.length < 2){ err.textContent = 'Fyll i ditt namn.'; return; }
        if(!emailOk(e)){ err.textContent = 'Fyll i en giltig e-postadress.'; return; }
        const d = domainVerdict(e);
        if(!d.ok){ err.textContent = d.msg; return; }
        const vald = (!d.customer && hSel && hSel.value) ? customerById(hSel.value) : null;
        const tid = d.customer ? d.customer.id : (vald ? vald.id : null);
        if(!tid && hSel && !d.clira){ err.textContent = t('Välj vilken anläggning du jobbar på.'); hSel.focus(); return; }
        P.user = {name:n, email:e, domain:domainOf(e), review: !!d.review && !vald, since: today(),
                  tenantId: tid,
                  tenantName: d.customer ? d.customer.name : (vald ? vald.name : null),
                  role: deriveRole(e, tid)};
        P.view = {};                      // omfånget nollställs vid byte av användare
        registerPerson(P.user);
        saveProgress(); close(); res(true);
      }});
      if(syncUrl()) m.append(h('p',{cls:'hint',style:'margin:14px 0 0',
        text:'Dina framsteg sparas i Klätterverkets utbildningsregister, så att du kan fortsätta på en annan dator eller i mobilen och dina intyg finns kvar. Har du gått utbildningar tidigare hämtas de när du loggar in med samma e-post.'}));
      m.append(h('div',{cls:'row',style:'margin-top:16px'}, h('div',{cls:'spacer'}), save));
    }, null);
  });
}

function importProgress(){
  const inp = h('input',{type:'file',accept:'application/json,.json'});
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if(!f) return;
    try{
      const o = JSON.parse(await f.text());
      if(!Array.isArray(o.events)) throw new Error('fel format');
      const seen = new Set(P.events.map(e=>e.id));
      P.events = P.events.concat(o.events.filter(e => !seen.has(e.id)));
      P.events.sort((a,b)=>a.ts.localeCompare(b.ts));
      if(o.user){ registerPerson(o.user); if(!P.user) P.user = o.user; }
      saveProgress(); render(); toast('Importerat');
    }catch(e){ alert(t('Kunde inte läsa filen: %1', e.message)); }

  setReportKey('');

  if(!confirm(t('Ta bort allt Klätterverket Academy sparat i den här webbläsaren — inloggning, framsteg och intyg för alla som använt datorn? Det går inte att ångra.'))) return false;
  try{
    for(const k of Object.keys(localStorage)) if(k.indexOf(LS) === 0) localStorage.removeItem(k);

/* ============================== UTBILDNINGSPAKET ==============================
   Klätterverket: en färdig utbildning kan läggas upp som en egen mapp,
     utbildningar/<mappnamn>/utbildning.json   (+ ev. bilder bredvid)
   utan att någon behöver öppna redaktören. Listan över mappar ligger i
   utbildningar/index.json, som GitHub bygger automatiskt vid varje
   uppladdning (se .github/workflows/publicera.yml).

   Paketformatet är medvetet förlåtande, så att en utbildning skriven av
   ChatGPT går att lägga upp som den är: text får skrivas som vanliga
   strängar med **fet** och [[id|ord]], svarsalternativ som en lista med
   texter, och rätt svar direkt på frågan. normalizePackage() gör om det till
   exakt samma datamodell som resten av appen — innehåll i C, rätta svar i
   KEY — och samlar allt som är fel i en lista i stället för att krascha.

   Paketkurser sparas aldrig in i innehållsfilen av redaktören: mappen är
   deras hem. Därför hålls reda på vad som kom från ett paket (PKG). */
const PKG_DIR = 'utbildningar/';
const PKG = { courses:new Set(), lessons:new Set(), quizzes:new Set(), terms:new Set(),
              keys:new Set(), origin:new Map(), list:[] };
const pkgSlug = s => String(s||'').toLowerCase()
  .replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/é/g,'e')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'utbildning';
const pkgIsAbs = u => /^(https?:|data:|blob:|\/|#)/i.test(String(u||''));
const pkgHasMarkup = s => typeof s === 'string' && /\*|\[\[|`/.test(s);
const pkgRich = v => Array.isArray(v) ? v : (pkgHasMarkup(v) ? textToSpans(v) : v);

function normalizePackage(pkg, folder){
  const problems = [];
  const base = folder ? PKG_DIR + folder + '/' : '';
  const rel  = u => (!u || pkgIsAbs(u)) ? u : base + String(u).replace(/^\.\//,'');
  if(!pkg || typeof pkg !== 'object') return {problems:['Filen innehåller ingen utbildning.']};
  const c0 = pkg.course || pkg.kurs;
  if(!c0 || !c0.title) return {problems:['Fältet "course" saknas, eller saknar "title".']};

  const suffix = pkgSlug(String(c0.id || folder || c0.title).replace(/^crs\./,''));
  const cid = 'crs.' + suffix;
  const lesId = x => { const s = String(x||''); return s.startsWith('les.') ? s : 'les.' + s; };

  /* ---- lektioner ---- */
  const rawLessons = Array.isArray(pkg.lessons) ? pkg.lessons
                   : (pkg.lessons && typeof pkg.lessons === 'object') ? Object.values(pkg.lessons) : [];
  if(!rawLessons.length) problems.push('Utbildningen har inga lektioner ("lessons").');
  const lessons = {};
  const order = [];
  rawLessons.forEach((l0, i) => {
    const l = Object.assign({}, l0);
    l.id = lesId(l.id || (suffix + '-' + (i+1)));
    if(lessons[l.id]) problems.push('Lektions-id "' + l.id + '" finns två gånger.');
    if(!l.title) problems.push('Lektion ' + (i+1) + ' saknar "title".');
    l.label = l.label != null ? String(l.label) : String(i+1);
    l.estimatedMinutes = Number(l.estimatedMinutes) || 5;
    l.status = l.status || 'published';
    if(l.required === undefined) l.required = true;
    l.blocks = (l.blocks || []).map((b0, j) => {
      const b = Object.assign({}, b0);
      const var_ = 'Lektion "' + (l.title || l.id) + '", del ' + (j+1);
      switch(b.type){
        case 'richtext':
          if(!b.spans) b.spans = textToSpans(String(b.text || '')); delete b.text; break;
        case 'callout':
          if(!b.spans) b.spans = textToSpans(String(b.text || '')); delete b.text;
          if(!['info','warning','ok'].includes(b.intent)) b.intent = 'info'; break;
        case 'heading': b.level = b.level === 3 ? 3 : 2; break;
        case 'list': case 'steps':
          b.items = (b.items || []).map(pkgRich); break;
        case 'task':
          b.id = b.id || ('task.' + l.id.slice(4) + '-' + (j+1));
          b.instruction = pkgRich(b.instruction || ''); b.deepLink = b.deepLink || ''; break;
        case 'video':
          b.assetId = b.assetId || ('vid.' + l.id.slice(4) + '-' + (j+1));
          b.src = rel(b.src); b.chapters = b.chapters || []; b.transcript = b.transcript || [];
          if(!b.src) problems.push(var_ + ': videon saknar "src".'); break;
        case 'image':
          b.src = rel(b.src); if(!b.alt) problems.push(var_ + ': bilden saknar "alt" (beskrivning).'); break;
        case 'table':
          b.rows = (b.rows || []).map(r => (r || []).map(pkgRich)); b.head = b.head || []; break;
        case 'keyTerm': case 'reference': case 'quizRef': break;
        default: problems.push(var_ + ': okänd typ "' + b.type + '".');
      }
      return b;
    });
    lessons[l.id] = l;
    order.push(l.id);
  });

  /* ---- ordlista ---- */
  const terms = {};
  const rawTerms = pkg.terms || {};
  if(Array.isArray(rawTerms)) rawTerms.forEach(x => { if(x && x.id) terms[x.id] = {term:x.term, definition:x.definition, more:x.more}; });
  else for(const k of Object.keys(rawTerms)) terms[k] = Object.assign({}, rawTerms[k]);

  /* ---- prov ---- */
  let quiz = null;
  const keys = {};
  const q0 = pkg.quiz || pkg.prov;
  if(q0 && (q0.items || []).length){
    const qid = 'quiz.' + suffix;
    const letters = 'abcdefghij';
    const items = (q0.items || []).map((it0, n) => {
      const it = Object.assign({}, it0);
      it.id = it.id ? String(it.id) : (suffix + '-q' + (n+1));
      it.type = ['single','multi','ordering','trueFalse'].includes(it.type) ? it.type : 'single';
      it.points = it.points || 1;
      it.options = (it.options || []).map((o, i) => typeof o === 'string'
        ? {id: letters[i], text: o} : {id: o.id || letters[i], text: o.text});
      if(it.options.length < 2) problems.push('Fråga ' + (n+1) + ' har färre än två alternativ.');
      const stemTxt = Array.isArray(it.stem) ? spansToText(it.stem) : String(it.stem || '');
      if(!stemTxt) problems.push('Fråga ' + (n+1) + ' saknar "stem" (själva frågan).');
      it.stem = textToSpans(stemTxt);
      if(it.intro && !Array.isArray(it.intro)) it.intro = textToSpans(String(it.intro));
      const k = {};
      if(it.type === 'ordering') k.order = it.options.map(o => o.id);
      else {
        let c = it.correct; if(c == null) c = [];
        if(!Array.isArray(c)) c = [c];
        k.correct = c.map(x => typeof x === 'number' ? letters[x] : String(x).toLowerCase())
                     .filter(x => it.options.some(o => o.id === x));
        if(!k.correct.length) problems.push('Fråga ' + (n+1) + ' ("' + stemTxt.slice(0,50) + '…") saknar rätt svar ("correct").');
        if(it.type !== 'multi' && k.correct.length > 1) problems.push('Fråga ' + (n+1) + ' har flera rätta svar men typen är inte "multi".');
      }
      const rem = it.lesson || it.remediation;
      if(rem){ const r = lesId(rem); if(lessons[r]) k.remediation = r; else problems.push('Fråga ' + (n+1) + ' pekar på lektionen "' + rem + '", som inte finns.'); }
      delete it.correct; delete it.lesson; delete it.remediation;
      keys[it.id] = k;
      return it;
    });
    const draw = typeof q0.draw === 'number' ? q0.draw : (q0.draw && q0.draw.count) || Math.min(10, items.length);
    let pass = Number(q0.passScore || 0.8); if(pass > 1) pass = pass / 100;
    quiz = { id: qid, title: q0.title || ('Prov: ' + c0.title), passScore: pass,
             draw: {count: Math.min(draw, items.length)}, shuffleOptions: q0.shuffleOptions !== false,
             attempts: {max: typeof q0.attempts === 'number' ? q0.attempts : (q0.attempts && q0.attempts.max) || 3},
             feedback: 'afterSubmit', items };
  }

  /* ---- kursen ---- */
  let modules = (c0.modules || []).map((m, i) => ({
    id: m.id || ('mod.' + suffix + '-' + (i+1)), title: m.title || ('Del ' + (i+1)), gate: m.gate || 'none',
    lessons: (m.lessons || []).map(lesId) }));
  if(!modules.length) modules = [{id:'mod.' + suffix + '-1', title: c0.title, gate:'none', lessons: order}];
  for(const m of modules) for(const lid of m.lessons)
    if(!lessons[lid]) problems.push('Modulen "' + m.title + '" pekar på lektionen "' + lid + '", som inte finns.');
  const course = Object.assign({}, c0, {
    id: cid, version: c0.version || '1.0.0', status: c0.status || 'published', locale: 'sv-SE',
    audience: Array.isArray(c0.audience) && c0.audience.length ? c0.audience : ['all'],
    prerequisites: c0.prerequisites || [],
    estimatedMinutes: Number(c0.estimatedMinutes) || order.reduce((s, id) => s + (lessons[id].estimatedMinutes||5), 0),
    cover: rel(c0.cover),
    certificate: c0.certificate || {issue: !!quiz, validMonths: 24},
    completion: {rule:'allRequiredLessons'}, modules });
  if(quiz) course.quizId = quiz.id; else delete course.quizId;
  if(course.certificate && course.certificate.issue && !quiz) problems.push('Kursen ger intyg men har inget prov ("quiz").');

  /* ordlistan: varje klickbart ord måste finnas */
  const allTerms = Object.assign({}, (C && C.terms) || {}, terms);
  for(const l of Object.values(lessons)) for(const id of blockTerms(l))
    if(!allTerms[id]) problems.push('Lektionen "' + l.title + '" använder begreppet "' + id + '", som saknas i "terms".');

  return { course, lessons, quiz, keys, terms, problems, folder };
}

/* Lägger in ett normaliserat paket i innehållet. Krockar det med något som
   redan finns i innehållsfilen hoppas paketet över — innehållsfilen vinner,
   annars kunde en uppladdad mapp tyst skriva över en kurs någon redigerat. */
function mergePackage(n, folder){
  const rad = {folder, title: n.course ? n.course.title : folder, problems: n.problems || [], ok:false};
  PKG.list.push(rad);
  if(!n.course) return rad;
  const main = id => (C.courses||[]).some(c => c.id === id) && !PKG.courses.has(id);
  if(main(n.course.id)){ rad.problems.push('Det finns redan en kurs med id "' + n.course.id + '" i innehållsfilen. Byt "id" i paketet.'); return rad; }
  for(const lid of Object.keys(n.lessons))
    if((C.lessons||{})[lid] && !PKG.lessons.has(lid)){ rad.problems.push('Lektions-id "' + lid + '" finns redan. Byt id i paketet.'); return rad; }
  C.courses = (C.courses||[]).filter(c => c.id !== n.course.id).concat([n.course]);
  C.lessons = C.lessons || {}; C.quizzes = C.quizzes || {}; C.terms = C.terms || {};
  Object.assign(C.lessons, n.lessons);
  for(const k of Object.keys(n.lessons)) PKG.lessons.add(k);
  if(n.quiz){ C.quizzes[n.quiz.id] = n.quiz; PKG.quizzes.add(n.quiz.id); }
  for(const k of Object.keys(n.terms)) if(!C.terms[k] || PKG.terms.has(k)){ C.terms[k] = n.terms[k]; PKG.terms.add(k); }
  KEY = KEY || {keys:{}}; KEY.keys = KEY.keys || {};
  for(const k of Object.keys(n.keys)){ KEY.keys[k] = n.keys[k]; PKG.keys.add(k); }
  PKG.courses.add(n.course.id);
  PKG.origin.set(n.course.id, folder || '(testat paket)');
  rad.ok = true;
  trCache = {};
  return rad;
}

/* Hämtar listan och paketen. Finns ingen lista (appen öppnad från disk,
   eller ingen har lagt upp något) händer ingenting. */
async function loadPackages(){
  let list = [];
  try{
    const r = await fetch(PKG_DIR + 'index.json', {cache:'no-cache'});
    if(!r.ok) return;
    const o = await r.json();
    list = Array.isArray(o) ? o : (o.utbildningar || o.packages || []);
  }catch(e){ return; }
  for(const folder of list){
    try{
      const r = await fetch(PKG_DIR + encodeURIComponent(folder) + '/utbildning.json', {cache:'no-cache'});
      if(!r.ok) throw new Error('kunde inte hämtas (' + r.status + ')');
      const n = normalizePackage(await r.json(), folder);
      const rad = mergePackage(n, folder);
      if(rad.problems.length) console.warn('[Academy] utbildningar/' + folder + ':\n  ' + rad.problems.join('\n  '));
    }catch(e){
      PKG.list.push({folder, ok:false, problems:[String(e.message || e)]});
      console.warn('[Academy] utbildningar/' + folder + ':', e);
    }
  }
}
/* Det redaktören sparar: allt utom det som kom från paket. */
function contentForSave(){
  if(!PKG.courses.size) return C;
  const o = Object.assign({}, C);
  const ut = (obj, set) => { const r = {}; for(const k of Object.keys(obj||{})) if(!set.has(k)) r[k] = obj[k]; return r; };
  o.courses = (C.courses||[]).filter(c => !PKG.courses.has(c.id));
  o.lessons = ut(C.lessons, PKG.lessons);
  o.quizzes = ut(C.quizzes, PKG.quizzes);
  o.terms   = ut(C.terms,   PKG.terms);
  return o;
}
function keyForSave(){
  if(!PKG.keys.size || !KEY) return KEY;
  const r = {}; for(const k of Object.keys(KEY.keys||{})) if(!PKG.keys.has(k)) r[k] = KEY.keys[k];
  return Object.assign({}, KEY, {keys:r});
}


/* ============================== FRAMSTEGSREGISTER ==============================
   Klätterverket: framstegen sparas automatiskt i ett Google-kalkylark, via ett
   litet Apps Script (se mappen Framstegsregister). Adressen till skriptet står
   under Inställningar → Framstegsregister. Står ingen adress där fungerar allt
   som förut: framstegen ligger bara i webbläsaren.

   Det är händelseloggen som skickas — samma poster som appen redan skriver.
   Rapporten och intygen är fortfarande projektioner av loggen; skillnaden är
   bara att loggen nu också finns på ett gemensamt ställe.

     skriva   varje egen händelse skickas strax efter att den skrivits. Utan
              nät ligger den kvar (synced saknas) och skickas vid nästa
              tillfälle — när nätet kommer tillbaka, vid nästa händelse,
              eller en gång i minuten.
     läsa     vid inloggning hämtas den inloggades egna händelser, så att man
              kan fortsätta på en annan dator och intygen följer med.
     rapport  platsansvarig och utbildningsansvarig hämtar allas händelser med
              en rapportnyckel. Nyckeln avgör omfånget på servern: en nyckel
              per anläggning, och en för alla. Andras data sparas aldrig i
              webbläsaren (remote) — den hämtas på nytt varje gång. */
const syncUrl = () => ((C && C.settings && C.settings.syncUrl) || '').trim();
const SYNC = { busy:false, timer:null, last:null, error:null, reportAt:null, reportScope:null,
               reportBusy:false, autoTried:false };
const needsSync = e => !e.synced && !e.demo && !e.remote && P.user && e.actor && e.actor.userId === P.user.email;
function syncPending(){ return (syncUrl() && P.user) ? P.events.filter(needsSync).length : 0; }
function syncSoon(){
  if(!syncUrl()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncPush(), 1200);
}
/* text/plain undviker en CORS-förfrågan i förväg, som Apps Script inte svarar på. */
async function syncPost(body){
  const r = await fetch(syncUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                                    body: JSON.stringify(body), redirect:'follow'});
  const o = await r.json();
  if(!o.ok){ const e = new Error(o.error || 'okänt fel'); e.code = o.error; throw e; }
  return o;
}
async function syncGet(params){
  const u = syncUrl() + (syncUrl().includes('?') ? '&' : '?') + new URLSearchParams(params).toString();
  const r = await fetch(u, {redirect:'follow'});
  const o = await r.json();
  if(!o.ok){ const e = new Error(o.error || 'okänt fel'); e.code = o.error; throw e; }
  return o;
}
function personPayload(){
  const u = P.user;
  return u ? {email:u.email, name:u.name, tenantId:u.tenantId || '', tenantName:u.tenantName || '', since:u.since || ''} : null;
}
async function syncPush(force){
  if(!syncUrl() || !P.user || SYNC.busy) return;
  const evs = P.events.filter(needsSync).slice(0, 200);
  if(!evs.length && !force) return;
  SYNC.busy = true;
  try{
    const o = await syncPost({action:'events', person: personPayload(), events: evs});
    const ok = new Set(o.ids || evs.map(e => e.id));
    for(const e of P.events) if(ok.has(e.id)) e.synced = true;
    SYNC.error = null; SYNC.last = new Date();
    saveProgress();
    if(P.events.some(needsSync)) setTimeout(() => syncPush(), 300);
  }catch(e){ SYNC.error = String(e.message || e); }
  finally{ SYNC.busy = false; setSaveState(); }
}
function mergeEvents(list, flags){
  const seen = new Set(P.events.map(e => e.id));
  let n = 0;
  for(const e of (list || [])){
    if(!e || !e.id || seen.has(e.id)) continue;
    P.events.push(Object.assign({}, e, flags));
    seen.add(e.id); n++;
  }
  if(n) P.events.sort((a,b) => String(a.ts).localeCompare(String(b.ts)));
  return n;
}
async function syncPull(){
  if(!syncUrl() || !P.user) return;
  try{
    const o = await syncGet({action:'mine', email: P.user.email});
    const n = mergeEvents(o.events, {synced:true});
    SYNC.error = null;
    if(n){ saveProgress(); render(); } else setSaveState();
  }catch(e){ SYNC.error = String(e.message || e); setSaveState(); }
}
async function syncAfterLogin(){ await syncPull(); await syncPush(true); }
window.addEventListener('online', () => syncPush());
setInterval(() => { if(syncPending()) syncPush(); }, 60000);

/* ---- rapportnyckeln ---- */
const getReportKey = () => { try{ return localStorage.getItem(LS + '-rkey') || ''; }catch(e){ return ''; } };
const setReportKey = k => { try{ k ? localStorage.setItem(LS + '-rkey', k) : localStorage.removeItem(LS + '-rkey'); }catch(e){} };
function dropRemote(){
  P.events = P.events.filter(e => !e.remote);
  for(const id of Object.keys(P.people || {})) if(P.people[id].remote) delete P.people[id];
  SYNC.reportAt = null; SYNC.reportScope = null;
}
async function syncReport(key, quiet){
  if(!syncUrl() || SYNC.reportBusy) return;
  SYNC.reportBusy = true;
  try{
    const o = await syncGet({action:'report', key});
    dropRemote();
    mergeEvents(o.events, {remote:true, synced:true});
    for(const em of Object.keys(o.people || {})){
      if(P.user && em === P.user.email) continue;
      const p = o.people[em];
      P.people[em] = {name: p.name || em, tenantId: p.tenantId || null, tenantName: p.tenantName || null, remote:true};
    }
    SYNC.reportAt = new Date(); SYNC.reportScope = o.scope;
    setReportKey(key);
    if(!quiet) toast(t('Hämtat från registret'));
  }catch(e){
    if(e.code === 'nyckel'){ setReportKey(''); toast(t('Fel rapportnyckel')); }
    else toast(t('Kunde inte hämta från registret: %1', e.message));
  }finally{ SYNC.reportBusy = false; render(); }
}
/* Raden överst i rapporten: hämta, eller visa när det hämtades. */
function syncReportBar(){
  if(!syncUrl()) return null;
  if(!(isClira() || roleDef().scope === 'org')) return null;
  const bar = h('div',{cls:'banner info',style:'margin-bottom:12px'});
  if(SYNC.reportBusy){ bar.append(h('span',{text:t('Hämtar allas framsteg från registret…')})); return bar; }
  if(SYNC.reportAt){
    bar.append(h('span',{text: t('Visar allas framsteg från registret · hämtat %1',
      SYNC.reportAt.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})) +
      (SYNC.reportScope && SYNC.reportScope !== 'alla' ? ' · ' + (tenantName(SYNC.reportScope) || SYNC.reportScope) : '')}),
      h('div',{cls:'spacer'}),
      h('button',{cls:'btn sm',type:'button',text:t('Uppdatera'),onclick:()=>syncReport(getReportKey())}));
    return bar;
  }
  const k = getReportKey();
  if(k && !SYNC.autoTried){ SYNC.autoTried = true; setTimeout(() => syncReport(k, true), 0);
    bar.append(h('span',{text:t('Hämtar allas framsteg från registret…')})); return bar; }
  const inp = h('input',{type:'password',cls:'f',placeholder:'Rapportnyckel',style:'min-width:170px'});
  const go_ = () => { const v = inp.value.trim(); if(v) syncReport(v); };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') go_(); });
  bar.append(h('span',{text:t('Rapporten visar bara det som finns i den här webbläsaren. Ange rapportnyckeln för att hämta allas framsteg.')}),
    h('div',{cls:'spacer'}), inp, h('button',{cls:'btn sm primary',type:'button',text:t('Hämta'),onclick:go_}));
  return bar;
}


/* ============================== LADDNING ============================== */
/* Innehållet hämtas i första hand över http (så modulen fungerar när den
   ligger i eSource). Öppnas filen direkt från disk blockerar webbläsaren
   fetch — då väljer man filerna manuellt, precis som i CDM-modulen. */
async function loadContent(){
  try{
    const [a,b] = await Promise.all([fetch(CONTENT_URL), fetch(KEY_URL).catch(()=>null)]);
    if(!a.ok) throw new Error('http ' + a.status);
    C = await a.json();
    if(b && b.ok){ KEY = await b.json(); keyLoaded = !!(KEY && KEY.keys); }
    else { KEY = {keys:{}}; keyLoaded = false; }
    cacheContent();
    return true;
  }catch(e){
    /* Öppnas filen från disk blockerar webbläsaren hämtningen. Vi faller
       INTE tillbaka på den lokala kopian automatiskt — den kan vara äldre
       än filen i mappen, och sparas den sedan tillbaka skriver den över
       nyare innehåll utan att någon märker det. Användaren får välja.

       Klätterverket: innan dess provas paketet data/kv-academy-data.js.
       Det laddas med en vanlig script-tagg, vilket webbläsaren tillåter
       även från disk — det är det som gör att mappen fungerar direkt ur en
       synkad Google Drive. Paketet skrivs av redaktören vid varje Spara,
       samtidigt som JSON-filerna, så det är aldrig äldre än dem. */
    const pk = window.KV_ACADEMY_DATA;
    if(pk && pk.content && Array.isArray(pk.content.courses)){
      C = pk.content;
      KEY = (pk.key && pk.key.keys) ? pk.key : {keys:{}};
      keyLoaded = !!(pk.key && pk.key.keys);
      cacheContent();
      return true;
    }
    return false;
  }
}
function cacheContent(){
  try{ localStorage.setItem(LS + '-content',
    JSON.stringify({at:new Date().toISOString(), C, KEY})); }catch(e){}
}
function readCachedContent(){
  try{ return JSON.parse(localStorage.getItem(LS + '-content') || 'null'); }catch(e){ return null; }
}
function pickContentScreen(){
  const app = APP(); app.replaceChildren();
  const card = h('div',{cls:'card',style:'max-width:620px;margin:60px auto'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  if(LOGO_SRC) b.append(h('img',{src:LOGO_DARK,alt:'Klätterverket',style:'height:56px;display:block;margin-bottom:18px'}));
  b.append(h('h1',{text:'Öppna innehållsfilerna'}),
    h('p',{cls:'muted',text:'Innehållet kunde inte laddas automatiskt. Öppna BÅDA filerna i mappen data — markera dem tillsammans med Ctrl:'}));
  b.append(h('ul',{cls:'muted',style:'margin:0 0 4px;padding-left:20px;font-size:13.5px'},
    h('li',null,h('code',{text:'kv-academy-innehall.json'}),
      h('span',{text:' — kurser, lektioner och prov'})),
    h('li',null,h('code',{text:'kv-academy-facit.json'}),
      h('span',{text:' — de rätta svaren'}))));

  const varning = h('div');

  /* Två vägar in, och den första är den viktiga:

     showOpenFilePicker ger ett filhandtag som går att SKRIVA till. Öppnas
     filerna så kan Spara senare skriva tillbaka i samma filer utan att
     fråga var. Går det inte — Safari och Firefox saknar stödet — faller vi
     tillbaka på en vanlig filväljare, som bara kan läsa, och då blir
     sparandet en nedladdning.                                          */
  const efterInlasning = async (gotC, gotK) => {
    if(!gotC){ alert(t('Ingen innehållsfil hittades bland de valda filerna. Det är den som heter kv-academy-innehall.json.')); return; }
    keyLoaded = gotK;
    if(!KEY) KEY = {keys:{}};

    /* Saknas facitet ska ingen komma vidare utan att ha sett varför. Det
       är den här tysta halvladdningen som en gång tömde facitfilen. */
    if(!gotK){
      varning.replaceChildren(h('div',{cls:'banner err',style:'margin-top:14px'},
        h('div',null,
          h('div',{style:'font-weight:600'},'Facitfilen valdes inte'),
          h('div',{cls:'small',style:'margin-top:3px'},
            'Utbildningen fungerar, men provsvaren är okända: Kontroll-fliken visar provet som ofullständigt och du kan inte redigera rätta svar. Filen på disk ändras inte — redaktörsläget vägrar spara över ett facit det inte har läst.'))));
      varning.append(h('div',{cls:'row',style:'margin-top:10px'},
        h('button',{cls:'btn primary',type:'button',text:'Välj filerna igen',
          onclick:()=>{ varning.replaceChildren(); oppna(); }}),
        h('button',{cls:'btn',type:'button',text:'Fortsätt utan facit',
          onclick:()=>{ cacheContent(); boot(); }})));
      return;
    }
    cacheContent();
    boot();
  };

  /* Väg 1: filhandtag med skrivrättighet (Chrome, Edge). */
  async function oppnaMedHandtag(){
    let handles;
    try{
      handles = await window.showOpenFilePicker({ multiple:true,
        types:[{description:'Klätterverket Academy-filer', accept:{'application/json':['.json'],'text/javascript':['.js']}}] });
    }catch(e){ return; }                       // avbröt väljaren
    let gotC = false, gotK = false;
    for(const hh of handles){
      if(/\.js$/i.test(hh.name)){ fileH.bundle = hh; continue; }
      try{
        const o = JSON.parse(await (await hh.getFile()).text());
        if(o.courses){ C = o; fileH.content = hh; gotC = true; }
        else if(o.keys){ KEY = o; fileH.key = hh; gotK = true; }
      }catch(e){ alert(t('Kunde inte läsa %1', hh.name)); }
    }
    efterInlasning(gotC, gotK);
  }
  /* Väg 2: vanlig filväljare. Läser, men kan inte skriva tillbaka. */
  const inp = h('input',{type:'file',accept:'application/json,.json,.js',multiple:'',
                         style:'display:none'});
  inp.addEventListener('change', async () => {
    let gotC = false, gotK = false;
    for(const f of inp.files){
      if(/\.js$/i.test(f.name)) continue;
      try{
        const o = JSON.parse(await f.text());
        if(o.courses){ C = o; gotC = true; }
        else if(o.keys){ KEY = o; gotK = true; }
      }catch(e){ alert(t('Kunde inte läsa %1', f.name)); }
    }
    efterInlasning(gotC, gotK);
  });
  const kanSkriva = fsaOk();
  const oppna = () => kanSkriva ? oppnaMedHandtag() : (inp.value = '', inp.click());

  b.append(h('div',{style:'margin:16px 0'},
    h('button',{cls:'btn primary lg',type:'button',text:'Öppna innehållsfilerna',onclick:oppna}),
    inp,
    h('div',{cls:'hint',style:'margin-top:7px',
      text: kanSkriva
        ? 'Markera båda filerna i rutan som öppnas. Ändringar du gör sparas sedan tillbaka i samma filer — du behöver aldrig välja var något ska sparas.'
        : 'Den här webbläsaren kan läsa filerna men inte skriva tillbaka i dem. Ändringar laddas ned som nya filer som får ersätta de gamla. Använd Chrome eller Edge för att slippa det steget.'})),
    varning);

  /* Den lokala kopian erbjuds bara som andrahandsval, med tidsstämpel och
     varning — aldrig tyst, eftersom den kan vara äldre än filen i mappen. */
  const cached = readCachedContent();
  if(cached && cached.C){
    const nar = cached.at ? new Date(cached.at).toLocaleString('sv-SE') : 'okänd tidpunkt';
    b.append(h('div',{cls:'banner warn',style:'margin-top:4px'},
      h('span',{text:t('Det finns en lokal kopia från %1. Den kan vara äldre än filerna i mappen — sparar du över filen försvinner nyare ändringar.', nar)}),
      h('button',{cls:'btn sm',type:'button',text:'Använd kopian ändå',onclick:()=>{
        C = cached.C;
        KEY = cached.KEY || {keys:{}};
        keyLoaded = !!(cached.KEY && cached.KEY.keys && Object.keys(cached.KEY.keys).length);
        boot();
      }})));
  }
  b.append(h('p',{cls:'small muted',
    text:'Tips: ligger data/kv-academy-data.js kvar i mappen — eller läggs mappen på en webbserver — laddas innehållet automatiskt och den här rutan visas aldrig.'}));
  app.append(card);
}

/* ============================== RENDER + INIT ==============================
   Sidan ritas om även vid små ändringar. Då ska läsläget behållas — annars
   kastas man till toppen varje gång man kryssar i ett svar långt ner i ett
   prov. Bara en verklig navigering scrollar upp.                          */
let lastRenderHash = null;
function render(){
  route = parseRoute();
  const hash = location.hash || '#/';
  const samePlace = hash === lastRenderHash;
  const y = samePlace ? window.scrollY : 0;

  /* Redaktören arbetar alltid i källspråket. Raden nedan finns bara i
     redaktörsfilen; i elevfilen är svOnly alltid false, vilket är rätt. */
  svOnly = false;
  

  renderNav(); setSaveState(); renderLangSwitch();
  renderView();
  lastRenderHash = hash;

  if(samePlace){ if(window.scrollY !== y) window.scrollTo({top:y}); }
  else window.scrollTo({top:0});
}
function renderView(){
  try{
    
    if(route.view === 'catalog') viewCatalog();
    else if(route.view === 'course') viewCourse();
    else if(route.view === 'lesson') viewLesson();
    else if(route.view === 'quiz') viewQuiz();
    else if(route.view === 'certs') viewCerts();
    else if(route.view === 'report') viewReport();
    else if(route.view === 'reportCourse') viewReportCourse();
    else if(route.view === 'reportCerts') viewReportCerts();
    else if(route.view === 'reportOrgs') viewReportOrgs();
    else if(route.view === 'reportDemand') viewReportDemand();
    else if(route.view === 'reportAudit') viewReportAudit();
    else viewStart();
  }catch(err){
    console.error(err);
    APP().replaceChildren(h('div',{cls:'banner err'},
      h('span',{text:t('Något gick fel i vyn: %1', err.message)})));
  }
}
async function boot(){
  if(!P.user) await askUser(false);
  render();
  syncAfterLogin();
}
