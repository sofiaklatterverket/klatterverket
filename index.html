try{ const v = localStorage.getItem(LS + '-locale');
     if(v && LOCALES.some(l => l.id === v)) locale = v; }catch(e){}
let svOnly = false;                    // sätts av redaktörsfilen
const lang = () => svOnly ? 'sv' : locale;
const localeName = id => (LOCALES.find(l => l.id === id) || {}).name || id;

function setLocale(id){
  if(!LOCALES.some(l => l.id === id) || id === locale) return;
  locale = id;
  try{ localStorage.setItem(LS + '-locale', id); }catch(e){}
  document.documentElement.lang = id;
  trCache = {};
  render();
}

/* Gränssnittstext. t('Starta kursen') ger engelska när engelska är valt och
   texten finns i ordlistan, annars den svenska som står i anropet — en text
   som ännu inte översatts syns alltså på svenska i stället för att
   försvinna. %1, %2 … byts mot argumenten. */
let uiTap = null;                      // används för att samla in ordlistan
function t(sv, ...a){
  let s = sv;
  if(uiTap && typeof sv === 'string' && sv.trim()) uiTap(sv);
  if(lang() !== 'sv'){
    const d = UI[lang()];
    if(d && d[sv] != null) s = d[sv];
  }
  return a.length ? String(s).replace(/%(\d)/g, (m,i) => a[i-1]==null ? '' : a[i-1]) : s;
}
/* Innehållstext ur innehållsfilen.

   trTap: när den är satt får den varje sträng som slås upp. Det är så
   språkfilen byggs — i stället för en egen genomgång av datamodellen, som
   skulle glida isär från den här, spelas exakt de strängar in som
   renderingen faktiskt frågar efter. Lägger någon till ett textfält i en
   bloktyp och kopplar in det i trBlock, kommer det med i språkfilen utan
   att någon behöver komma ihåg det. */
let trCache = {};
let trTap = null;
function tr(sv){
  if(trTap && typeof sv === 'string' && sv !== '') trTap(sv);
  if(sv == null || sv === '' || lang() === 'sv' || typeof sv !== 'string') return sv;
  const d = C && C.translations && C.translations[lang()];
  const x = d && d[sv];
  return x == null || x === '' ? sv : x;
}
/* Märkspråksbrygga: text <-> spans. Ligger i delad kod eftersom både
   redaktörens fält och översättningen av märkt text behöver den.
   **fet**, *kursiv*, `kod`, [[begreppsid|ordet eleven läser]]. */
function textToSpans(txt){
  const out = [], re = /\*\*([\s\S]+?)\*\*|\*([\s\S]+?)\*|`([\s\S]+?)`|\[\[([^\]|]+)\|([^\]]+)\]\]/g;
  let last = 0, m;
  while((m = re.exec(txt))){
    if(m.index > last) out.push({text: txt.slice(last, m.index)});
    if(m[1] != null)      out.push({text:m[1], mark:'bold'});
    else if(m[2] != null) out.push({text:m[2], mark:'emphasis'});
    else if(m[3] != null) out.push({text:m[3], mark:'code'});
    else                  out.push({text:m[5], mark:'term', termId:m[4]});
    last = re.lastIndex;
  }
  if(last < txt.length) out.push({text: txt.slice(last)});
  return out.length ? out : [{text:txt}];
}
function spansToText(sp){
  return (sp||[]).map(s => {
    if(typeof s === 'string') return s;
    if(s.mark === 'bold')     return '**' + s.text + '**';
    if(s.mark === 'emphasis') return '*'  + s.text + '*';
    if(s.mark === 'code')     return '`'  + s.text + '`';
    if(s.mark === 'term')     return '[[' + s.termId + '|' + s.text + ']]';
    return s.text;
  }).join('');
}

/* Märkt text (spans) översätts som en enda sträng med sin märkning kvar —
   ordföljden skiljer sig mellan språken, så span för span går inte. Finns
   ingen översättning återlämnas originalet oförändrat i stället för att
   köras genom tolken i onödan. */
function trSpans(sp){
  if(!sp || lang() === 'sv' || !Array.isArray(sp)) return sp;
  const src = spansToText(sp);
  const ut  = tr(src);
  return ut === src ? sp : textToSpans(ut);
}
const trList = v => Array.isArray(v) ? trSpans(v) : tr(v);

/* Översatt VY av innehållet: en kopia byggs vid visning och originalet rörs
   aldrig. I svenskt läge lämnas objektet tillbaka som det är — det är den
   detaljen som gör att redaktören kan fortsätta redigera samma objekt. */
function trBlock(b){
  if(lang() === 'sv' || !b) return b;
  const o = Object.assign({}, b);
  for(const f of ['text','title','label','alt','caption','hint','term'])
    if(o[f] != null) o[f] = tr(o[f]);
  if(o.spans)       o.spans       = trSpans(o.spans);
  if(o.definition)  o.definition  = trList(o.definition);
  if(o.instruction) o.instruction = trList(o.instruction);
  if(o.items)       o.items       = o.items.map(x => trList(x));
  if(o.head)        o.head        = o.head.map(x => tr(x));
  if(o.rows)        o.rows        = o.rows.map(r => r.map(x => trList(x)));
  if(o.chapters)    o.chapters    = o.chapters.map(c => ({at:c.at, label:tr(c.label)}));
  if(o.transcript)  o.transcript  = o.transcript.map(x => ({at:x.at, text:tr(x.text)}));
  return o;
}
function trLesson(l){
  if(lang() === 'sv' || !l) return l;
  const o = Object.assign({}, l);
  o.title = tr(o.title);
  if(o.blocks) o.blocks = o.blocks.map(trBlock);
  return o;
}
function trCourse(c){
  if(lang() === 'sv' || !c) return c;
  const o = Object.assign({}, c);
  o.title = tr(o.title); o.summary = tr(o.summary);
  if(o.modules) o.modules = o.modules.map(m => Object.assign({}, m, {title: tr(m.title)}));
  if(o.certificate && o.certificate.title)
    o.certificate = Object.assign({}, o.certificate, {title: tr(o.certificate.title)});
  return o;
}
function trQuiz(q){
  if(lang() === 'sv' || !q) return q;
  const o = Object.assign({}, q);
  o.title = tr(o.title);
  if(o.items) o.items = o.items.map(it => {
    const x = Object.assign({}, it);
    if(x.stem)    x.stem    = trSpans(x.stem);
    if(x.why)     x.why     = trList(x.why);
    if(x.options) x.options = x.options.map(op => Object.assign({}, op, {text: tr(op.text)}));
    return x;
  });
  return o;
}
function trTermDef(x){
  if(lang() === 'sv' || !x) return x;
  return Object.assign({}, x, {term: tr(x.term),
    definition: trList(x.definition), more: trList(x.more)});
}
/* Uppslagen cachas per språk och id. Utan cache byggs samma översatta
   lektion om för varje omritning, och en lektion med tvåtusen
   transkriptrader märks. */
function trView(sort, id, obj, fn){
  if(lang() === 'sv' || !obj) return obj;
  const k = lang() + ':' + sort + ':' + id;
  if(!trCache[k]) trCache[k] = fn(obj);
  return trCache[k];
}

/* Samlar in de strängar EN KURS visar, i den ordning eleven möter dem, med
   en svensk kontextrad per sträng så att den som översätter vet var texten
   hör hemma. Insamlingen sker genom att låta översättningen köras med
   trTap satt — se kommentaren vid tr(). */
function courseStrings(courseId, till){
  const c = courseRaw(courseId);
  if(!c) return [];
  const seen = new Map();
  let ctx = '';
  const sparaLocale = locale, sparaSvOnly = svOnly, sparaCache = trCache;
  locale = till || 'en'; svOnly = false; trCache = {};
  trTap = sv => { if(!seen.has(sv)) seen.set(sv, ctx); };
  try{
    ctx = 'Kursen'; trCourse(c);
    for(const m of (c.modules||[])){
      ctx = 'Modul: ' + (m.title || m.id);
      tr(m.title);
      for(const lid of (m.lessons||[])){
        const l = lessonRaw(lid);
        if(!l) continue;
        ctx = 'Lektion ' + (l.label ? l.label + ' — ' : '') + (l.title || lid);
        trLesson(l);
        for(const id of blockTerms(l)){
          const x = termRaw(id);
          if(x){ const spara = ctx; ctx = 'Ordlistan: ' + x.term; trTermDef(x); ctx = spara; }
        }
      }
    }
    if(c.quizId){
      const q = quizRaw(c.quizId);
      if(q){ ctx = 'Provet: ' + (q.title || c.quizId); trQuiz(q); }
    }
  } finally {
    trTap = null; locale = sparaLocale; svOnly = sparaSvOnly; trCache = sparaCache;
  }
  return [...seen].map(([sv, what]) => ({what, sv}));
}
/* Begrepp som en lektion gör klickbara — de måste med i kursens språkfil,
   annars står förklaringen kvar på svenska i en engelsk kurs. */
function blockTerms(l){
  const ut = new Set();
  for(const b of (l.blocks||[])){
    if(b.termId) ut.add(b.termId);
    for(const f of ['spans','instruction','definition'])
      if(Array.isArray(b[f])) for(const s of b[f]) if(s && s.mark === 'term' && s.termId) ut.add(s.termId);
    if(Array.isArray(b.items)) for(const it of b.items)
      if(Array.isArray(it)) for(const s of it) if(s && s.mark === 'term' && s.termId) ut.add(s.termId);
    if(Array.isArray(b.rows)) for(const r of b.rows) for(const cell of r)
      if(Array.isArray(cell)) for(const s of cell) if(s && s.mark === 'term' && s.termId) ut.add(s.termId);
  }
  return ut;
}
/* Hur stor del av en kurs som finns på ett annat språk. Visas i redaktören
   och i Kontroll, så att en halvöversatt kurs inte går obemärkt förbi. */
function trCoverage(courseId, till){
  const rader = courseStrings(courseId, till || 'en');
  const d = (C.translations || {})[till || 'en'] || {};
  const klara = rader.filter(r => d[r.sv] != null && d[r.sv] !== '').length;
  return {total: rader.length, klara, pct: rader.length ? Math.round(klara/rader.length*100) : 100};
}

/* ---------- lager 1: uppslag i innehållet ----------
   Uppslagen lämnar innehållet på det språk som är valt. Rådata når man
   med *Raw — redaktören redigerar alltid källspråket. */
const courseRaw  = id => (C.courses||[]).find(c => c.id===id);
const lessonRaw  = id => (C.lessons||{})[id];
const quizRaw    = id => (C.quizzes||{})[id];
const termRaw    = id => (C.terms||{})[id];
const course  = id => trView('c', id, courseRaw(id),  trCourse);
const lesson  = id => trView('l', id, lessonRaw(id),  trLesson);
const quizDef = id => trView('q', id, quizRaw(id),    trQuiz);
const term    = id => trView('t', id, termRaw(id),    trTermDef);
const courseLessons = c => (c.modules||[]).flatMap(m => m.lessons||[]);

/* ---------- kunder (tenants) ----------
   En kund är en organisation med en eller flera e-postdomäner. Den som
   registrerar sig med en av dem knyts till kunden, och alla händelser
   bär kundens id — grunden för rapport per organisation.               */
function customerFor(email){
  const d = String(email||'').split('@')[1];
  if(!d) return null;
  const dom = d.toLowerCase();
  return (C.customers||[]).find(c =>
    (c.domains||[]).some(x => dom === String(x).toLowerCase() || dom.endsWith('.' + String(x).toLowerCase()))
  ) || null;
}

/* ---------- licenser: vilka kurser en kund har tillgång till ----------
   Två fält, medvetet åtskilda:

     course.licensed = true     kursen kräver licens. Sätts av redaktören.
     customer.licenses[]        vilka kurser kunden har, med giltighetstid.

   Varför inte en lista av tenants på kursen: det kommersiella faktumet hör
   till kunden och ändras med varje avtal, medan kursen är samma sanning för
   alla. Lägger man kundlistan i kursen måste innehållet röras vid varje
   affär, och en kund kan aldrig få ett slutdatum.

   Fyra tillstånd, och exakt fyra:
     'open'     kursen kräver ingen licens
     'unlocked' kunden har en giltig licens
     'expired'  kunden har haft licens, men den har gått ut
     'locked'   ingen licens
   Alla fyra visas för eleven. Poängen med hänglåset är att det ska synas
   att kursen finns.

   OBS: detta är inget skydd. Innehållet ligger i samma JSON-fil som allt
   annat, så den som kan läsa filen kan läsa en låst kurs. Lokalt är låset
   en ordningsfråga; i skarp drift måste /catalog och /lessons filtrera på
   licens serverside — se TEKNISK-ARKITEKTUR §5.4.                        */
function customerById(id){
  return (C.customers||[]).find(c => c.id === id) || null;
}
/* Adressen till övningsorganisationen. Den är oftast — men inte alltid —
   kundens egen, så den står i första hand på kunden och faller tillbaka på
   den allmänna i Inställningar. Uppgiftsblocket bygger sina djuplänkar på
   det som kommer ut här, så en elev hos Södertälje hamnar i Södertäljes
   övningsmiljö och inte i någon annans. */
function trainingBase(tenantId){
  const ten = tenantId === undefined ? (P.user && P.user.tenantId) : tenantId;
  const cu = customerById(ten);
  const egen = cu && (cu.trainingBaseUrl || '').trim();
  const bas  = egen || ((C.settings && C.settings.trainingBaseUrl) || '').trim();
  /* Utan protokoll tolkar webbläsaren adressen som en sökväg i den här
     filens mapp, och knappen leder ingenstans. Redaktören ska inte behöva
     komma ihåg https://. */
  return bas && !/^[a-z]+:\/\//i.test(bas) ? 'https://' + bas : bas;
}
function licenseFor(courseId, tenantId){
  const demo = demoLicense(courseId, tenantId);
  if(demo) return demo;
  const cu = customerById(tenantId);
  if(!cu) return null;
  return (cu.licenses||[]).find(l => l.courseId === courseId) || null;
}
/* Vad EN ANGIVEN KUND har. Ingen hänsyn till vem som tittar — det är den
   funktion rapporter ska använda, annars påstår Clira-vyn att varje kund
   har allt upplåst bara därför att den inloggade är Clira. */
function tenantAccess(c, tenantId){
  if(!c) return 'locked';
  if(!c.licensed) return 'open';
  const lic = licenseFor(c.id, tenantId || null);
  if(!lic) return 'locked';
  if(lic.until && Date.parse(lic.until) < Date.now()) return 'expired';
  if(lic.from  && Date.parse(lic.from)  > Date.now()) return 'locked';
  return 'unlocked';
}
/* Vad DEN INLOGGADE kan öppna. Här — och bara här — gäller att en
   Clira-roll ser allt upplåst, eftersom den måste kunna granska innehåll. */
function courseAccess(c, tenantId){
  if(tenantId !== undefined) return tenantAccess(c, tenantId);
  if(!c) return 'locked';
  if(!c.licensed) return 'open';
  if(isClira()) return 'unlocked';
  return tenantAccess(c, (P.user && P.user.tenantId) || null);
}
const isLocked = (c, tenantId) => {
  const a = courseAccess(c, tenantId);
  return a === 'locked' || a === 'expired';
};
/* Kurser eleven faktiskt kan gå. Låsta kurser syns i katalogen men räknas
   inte in i framsteg, tid kvar eller "nästa åtgärd". */
function accessibleCourses(){
  return visibleCourses().filter(c => !isLocked(c));
}
/* Intresseanmälan. Det är den kommersiellt intressanta delen av låset:
   varje hänglås någon trycker på blir en rad i loggen, och därmed en
   lista över vad kunderna vill köpa. */
function requestCourse(c){
  if(hasEvent('course', c.id, 'requested')) return false;
  logEvent('requested','course',c.id,{title:c.title},{});
  return true;
}
const hasRequested = c => hasEvent('course', c.id, 'requested');
/* En rad per kurs och kund: hur många som frågat efter den. */
function demandRows(sc){
  const people = orgPeople(sc);
  const ids = new Set(people.map(p => p.userId));
  const out = [];
  for(const c of visibleCourses()){
    if(!c.licensed) continue;
    const evs = P.events.filter(e => e.verb==='requested' && e.object.type==='course'
                                  && e.object.id===c.id && ids.has(e.actor.userId));
    const per = new Map();
    for(const e of evs){
      const ten = e.actor.tenantId || null;
      if(!per.has(ten)) per.set(ten, []);
      per.get(ten).push(e);
    }
    for(const [ten, list] of per){
      const cu = customerById(ten);
      out.push({
        courseId: c.id, title: c.title,
        tenantId: ten, tenantName: cu ? cu.name : (tenantName(ten) || 'Utan anläggning'),
        n: new Set(list.map(e=>e.actor.userId)).size,
        who: [...new Set(list.map(e=>e.actor.userId))],
        first: list.map(e=>e.ts).sort()[0],
        last:  list.map(e=>e.ts).sort().slice(-1)[0],
        access: tenantAccess(c, ten)
      });
    }
  }
  return out.sort((a,b) => b.n - a.n || a.title.localeCompare(b.title,'sv'));
}

/* ---------- lager 2: progressionsmotorn ------------------------------
   Ren funktion av (kurs, händelser). Inga sidoeffekter, inga anrop.
   Samma funktion ska kunna köras på servern när den dagen kommer.        */
function courseState(c, uid){
  const ids   = courseLessons(c);
  const live  = ids.filter(id => { const l = lesson(id); return l && l.status !== 'planned'; });
  const req   = live.filter(id => lesson(id).required !== false);
  const done  = live.filter(id => hasEvent('lesson', id, 'completed', uid));
  const doneReq = req.filter(id => hasEvent('lesson', id, 'completed', uid));

  const attempts = c.quizId ? eventsFor('quiz', c.quizId, uid).filter(e => e.verb==='passed'||e.verb==='failed') : [];
  const passed   = attempts.some(e => e.verb === 'passed');
  const best     = attempts.reduce((m,e) => Math.max(m, e.result.score||0), 0);

  // Nästa lektion = första ej klara i kursordning; annars provet.
  const next = live.find(id => !hasEvent('lesson', id, 'completed', uid)) || null;

  const needQuiz  = !!c.quizId;
  const completed = doneReq.length === req.length && req.length > 0 && (!needQuiz || passed);

  // Andelen räknas på lektioner + provet som ett extra moment.
  const units     = live.length + (needQuiz ? 1 : 0);
  const doneUnits = done.length + (needQuiz && passed ? 1 : 0);

  return {
    lessonIds: live, total: live.length, done: done.length,
    reqTotal: req.length, reqDone: doneReq.length,
    pct: units ? Math.round(doneUnits/units*100) : 0,
    next, attempts: attempts.length, passed, best, completed,
    started: live.some(id => hasEvent('lesson', id, 'viewed', uid)),
    minutesLeft: live.filter(id => !hasEvent('lesson', id, 'completed', uid))
                     .reduce((s,id) => s + (lesson(id).estimatedMinutes||5), 0)
  };
}
function prereqMissing(c, uid){
  return (c.prerequisites||[])
    .map(pid => course(pid))
    .filter(p => p && !courseState(p, uid).completed);
}
function visibleCourses(){
  return (C.courses||[]).map(c => course(c.id)).filter(c => c.status !== 'draft')
    /* Internt innehåll är inte en licensfråga utan en organisationsfråga.
       Cliras egen personalutbildning ska inte ens synas med hänglås i en
       kunds katalog — den hör inte dit. Licens styr vad en kund har köpt;
       internal styr vad som är kundens sak att se över huvud taget. */
    .filter(c => !c.internal || isClira());
}
function resumeTarget(){
  // Senaste påbörjade, ej avslutade kursen — annars första ej påbörjade.
  // Låsta kurser kan aldrig vara nästa åtgärd.
  const started = accessibleCourses().filter(c => { const s = courseState(c); return s.started && !s.completed; });
  if(started.length){
    started.sort((a,b) => lastTouch(b) - lastTouch(a));
    return started[0];
  }
  return accessibleCourses().find(c => !courseState(c).completed) || null;
}
function lastTouch(c, uid){
  const u = uid || me();
  const ids = new Set(courseLessons(c));
  let senast = 0;
  for(const e of P.events)
    if(e.actor.userId===u && e.object.type==='lesson' && ids.has(e.object.id))
      senast = Math.max(senast, Date.parse(e.ts)||0);
  return senast;
}

/* ---------- intyg ---------- */
function certificates(uid){
  const u = uid || me();
  const out = [];
  for(const c of visibleCourses()){
    if(!c.certificate || !c.certificate.issue) continue;
    const st = courseState(c, u);
    if(!st.completed) continue;
    const ev = P.events.filter(e => e.actor.userId===u && e.object.type==='course'
                                 && e.object.id===c.id && e.verb==='completed')[0];
    const issued = ev ? ev.ts.slice(0,10) : today();
    const d = new Date(issued);
    d.setMonth(d.getMonth() + (c.certificate.validMonths || 24));
    out.push({
      courseId: c.id, title: c.title, issued: issued,
      validUntil: d.toISOString().slice(0,10),
      score: st.best, code: verifyCode(c.id, issued, u),
      userId: u, valid: Date.parse(d) >= Date.now()
    });
  }
  return out;
}
/* Verifikationskod. I skarp drift utfärdas den av servern och slås upp
   på /verifiera/<kod> — här härleds den så att sidan går att demonstrera. */
function verifyCode(courseId, issued, uid){
  const src = (uid || me()) + '|' + courseId + '|' + issued;
  let a = 0, b = 0;
  for(let i=0;i<src.length;i++){ a = (a*31 + src.charCodeAt(i)) >>> 0; b = (b*17 + a) >>> 0; }
  const alpha = 'ACDEFGHJKLMNPQRSTUVWXY3479';
  let out = '';
  let n = a;
  for(let i=0;i<4;i++){ out += alpha[n % alpha.length]; n = Math.floor(n/alpha.length) + b % 97; }
  return 'KV-' + out + '-' + String(b % 10000).padStart(4,'0');
}

/* ---------- roller och åtkomstomfång --------------------------------
   Vem får se vems data. Tre omfång, och bara tre:

     'egen'   bara sin egen data. Gäller alla elever.
     'org'    hela sin egen organisation. Kundens administratör.
     'alla'   samtliga organisationer. Endast Clira-roller.

   Viktigt om default: den som saknar organisation ser ENDAST SIG SJÄLV.
   Tidigare betydde "ingen organisation" i praktiken "se alla" — harmlöst
   lokalt, där bara ens egen data finns, men precis fel som serverbeteende.
   Åtkomst ska alltid vara ett aktivt beslut, aldrig ett tomt fält.

   I skarp drift sätts rollen av eSource vid inloggning och skickas aldrig
   från klienten. Här härleds den ur e-postadressen, så att båda vyerna
   går att visa och utvärdera i prototypen.                              */
/* Klätterverket: "Clira-rollen" heter här central roll — utbildningsansvarig
   och den som stöttar henne. Den ges till adresser i Inställningar, en per
   rad: antingen en hel e-postadress (utbildning@klatterverket.se) eller en
   domän. Medarbetarna har oftast samma domän, så en hel adress är normalfallet.
   Tom lista = ingen har central insyn. */
const CLIRA_DOMAINS_DEFAULT = [];
function cliraDomains(){
  const s = C.settings && (C.settings.centralAddresses || C.settings.cliraDomains);
  return (Array.isArray(s) && s.length) ? s : CLIRA_DOMAINS_DEFAULT;
}
const addrMatch = (email, list) => {
  const e = String(email||'').toLowerCase().trim();
  const d = e.split('@')[1];
  if(!d) return false;
  return (list||[]).some(x => {
    const v = String(x).toLowerCase().trim().replace(/^@/,'');
    if(!v) return false;
    if(v.includes('@')) return e === v;
    return d === v || d.endsWith('.' + v);
  });
};
function isCliraEmail(email){
  return addrMatch(email, cliraDomains());
}
/* Platsansvariga ser hela sin anläggnings rapport. Övriga medarbetare ser
   bara sig själva — en kollegas provresultat är inte allas sak. Listan står
   under Inställningar, en adress per rad. */
function isLeadEmail(email){
  return addrMatch(email, (C.settings && C.settings.leadAddresses) || []);
}
const ROLES = {
  elev:          { scope:'egen', label:'Medarbetare' },
  kundadmin:     { scope:'org',  label:'Platsansvarig' },
  clira_support: { scope:'alla', label:'Utbildningsstöd', clira:true },
  clira_admin:   { scope:'alla', label:'Utbildningsansvarig', clira:true }
};
function deriveRole(email, tenantId){
  if(isCliraEmail(email)) return 'clira_support';
  /* Alla användare hos en kund får org-omfång i prototypen, så att
     kundens rapport går att visa. På servern är det en särskild roll som
     kunden själv delar ut — kolumnen finns redan i datamodellen.       */
  /* Klätterverket: anläggningens rapport ses av platsansvariga, inte av
     alla som jobbar där. Undantaget är exempeldatan, som finns just för att
     rapportvyn ska gå att bedöma. */
  if(tenantId && (isLeadEmail(email) || DEMO_TENANTS.some(x => x.id === tenantId))) return 'kundadmin';
  return 'elev';
}
function roleId(){
  if(!P.user) return 'elev';
  /* Härleds varje gång i stället för att sparas: läggs någon till som
     platsansvarig i Inställningar ska det gälla direkt, utan ny registrering. */
  P.user.role = deriveRole(P.user.email, P.user.tenantId);
  return P.user.role;
}
const roleDef  = () => ROLES[roleId()] || ROLES.elev;
const isClira  = () => !!roleDef().clira;

/* Vilka personer rapporten omfattar just nu.
     '*'       samtliga kundorganisationer (endast Clira-roll)
     'ten.x'   en namngiven organisation
     '-'       de som inte tillhör någon kund (endast Clira-roll)
     null      ingen alls; rapporten visar bara den inloggade själv     */
function reportScope(){
  if(isClira()) return (P.view && P.view.tenantId) || '*';
  if(roleDef().scope === 'org') return (P.user && P.user.tenantId) || null;
  return null;
}
function setReportScope(sc){
  P.view = P.view || {};
  P.view.tenantId = sc;
  saveProgress();
}
/* Organisationer som finns i datan, med namn ur kundregistret. */
function knownTenants(){
  const m = new Map();
  for(const id of Object.keys(P.people||{})){
    const p = P.people[id];
    const ten = p.tenantId || null;
    if(!ten) continue;
    if(!m.has(ten)) m.set(ten, { id:ten, name: p.tenantName || ten, n:0 });
    m.get(ten).n++;
  }
  for(const c of (C.customers||[]))
    if(m.has(c.id)) m.get(c.id).name = c.name;
  return [...m.values()].sort((a,b) => a.name.localeCompare(b.name,'sv'));
}
function tenantName(ten){
  if(!ten || ten==='*') return null;
  if(ten==='-') return 'Utan anläggning';
  const x = knownTenants().find(k => k.id===ten);
  return x ? x.name : ten;
}
/* Registrerade som inte matchade någon kunddomän. De hamnar inte i någon
   kundrapport, och just därför måste supporten kunna hitta dem — annars
   är det de personerna som ingen kan svara på frågor om.               */
function unassignedPeople(){
  return Object.keys(P.people||{}).filter(id => !P.people[id].tenantId);
}

/* ---------- insynslogg -----------------------------------------------
   Varje gång en Clira-roll tittar på en annan organisations data skrivs
   en händelse i samma append-only-logg. Den kostar ingenting och är det
   enda svaret som håller när en kund frågar vem hos Clira som har sett
   deras anställdas resultat. Dubbletter inom samma timme hoppas över,
   annars skulle loggen fyllas av omritningar.                          */
let auditSeen = {};
function auditAccess(view, sc){
  if(!isClira()) return;
  const own = (P.user && P.user.tenantId) || null;
  if(sc && sc !== '*' && sc === own) return;      // sin egen org loggas inte
  const key = view + '|' + sc + '|' + new Date().toISOString().slice(0,13);
  if(auditSeen[key]) return;
  auditSeen[key] = 1;
  logEvent('accessed','orgReport', sc || 'ingen',
    { view, role: roleId(), tenants: sc==='*' ? knownTenants().length : 1 }, {});
}
function auditTrail(){
  return P.events
    .filter(e => e.object.type === 'orgReport')
    .map(e => ({
      ts: e.ts, who: e.actor.userId,
      role: t((ROLES[(e.context||{}).role] || {}).label || (e.context||{}).role || ''),
      scope: e.object.id,
      scopeLabel: e.object.id === '*'
        ? t('Alla anläggningar') + ((e.context||{}).tenants ? ' (' + e.context.tenants + ')' : '')
        : (tenantName(e.object.id) || e.object.id),
      view: (e.context||{}).view || ''
    }))
    .sort((a,b) => b.ts.localeCompare(a.ts));
}

/* ---------- organisationsvy: aggregering över flera användare ----------
   I skarp drift kommer listan över användare från eSource och siffrorna
   från en projektion på servern. Här härleds allt ur den lokala loggen,
   vilket ger samma form på datan och samma vyer.                        */
function orgPeople(sc){
  const s = (sc === undefined) ? reportScope() : sc;
  const all = Object.keys(P.people||{});
  const ids =
    s === '*' ? all.filter(id => !!P.people[id].tenantId) :   // kunderna, inte Clira självt
    s === '-' ? all.filter(id => !P.people[id].tenantId) :
    s         ? all.filter(id => (P.people[id].tenantId || null) === s) :
                all.filter(id => id === me());
  return ids
    .map(id => Object.assign({ userId:id }, P.people[id]))
    .sort((a,b) => (a.tenantName||'').localeCompare(b.tenantName||'','sv')
                || a.name.localeCompare(b.name,'sv'));
}
/* En rad per person och kurs — grunden för både översikt och drilldown. */
function orgCourseRows(c, sc){
  return orgPeople(sc).map(p => {
    const st = courseState(c, p.userId);
    const lt = lastTouch(c, p.userId);
    return {
      userId: p.userId, name: p.name, demo: p.demo,
      tenantId: p.tenantId || null, tenantName: p.tenantName || null,
      status: st.completed ? 'klar' : st.started ? 'pagar' : 'ej',
      pct: st.pct, done: st.done, total: st.total,
      passed: st.passed, attempts: st.attempts, best: st.best,
      minutesLeft: st.minutesLeft, last: lt
    };
  });
}
function orgCourseSummary(c, sc){
  const rows = orgCourseRows(c, sc);
  const n = rows.length;
  const klar  = rows.filter(r => r.status==='klar').length;
  const pagar = rows.filter(r => r.status==='pagar').length;
  return {
    rows, n, klar, pagar, ej: n - klar - pagar,
    startade: klar + pagar,
    pctKlar: n ? Math.round(klar/n*100) : 0,
    pctStartade: n ? Math.round((klar+pagar)/n*100) : 0
  };
}
/* Alla giltiga intyg i omfånget, ett per person och kurs. */
function orgCertificates(sc){
  const out = [];
  for(const p of orgPeople(sc))
    for(const cert of certificates(p.userId))
      out.push(Object.assign({ name:p.name, tenantId:p.tenantId||null,
                               tenantName:p.tenantName||null }, cert));
  return out.sort((a,b) => a.name.localeCompare(b.name,'sv') || a.title.localeCompare(b.title,'sv'));
}
/* En rad per organisation — Clira-vyns översta nivå. */
function tenantRows(){
  const courses = visibleCourses().filter(c => courseState(c,'x').total > 0);
  return knownTenants().map(kt => {
    const people = orgPeople(kt.id);
    const startade = people.filter(p => courses.some(c => courseState(c, p.userId).started)).length;
    const klara    = people.filter(p => courses.some(c => courseState(c, p.userId).completed)).length;
    const certs    = orgCertificates(kt.id).filter(c => c.valid);
    const kurser   = people.reduce((s,p) => s + courses.filter(c => courseState(c,p.userId).completed).length, 0);
    return {
      id:kt.id, name:kt.name, n:people.length, startade, klara,
      kurser, certs: certs.length,
      snart: certs.filter(c => dagarTill(c.validUntil) < 90).length,
      pctStartade: people.length ? Math.round(startade/people.length*100) : 0,
      pctKlara:    people.length ? Math.round(klara/people.length*100) : 0,
      last: people.reduce((m,p) => Math.max(m, courses.reduce((x,c) => Math.max(x, lastTouch(c,p.userId)||0), 0)), 0)
    };
  });
}
const dagarTill = d => Math.round((Date.parse(d) - Date.now()) / 86400000);

/* ---------- exempeldata för rapporten ----------
   Rapportvyerna går inte att bedöma med en enda användare. Den här
   genereraren skapar en fiktiv organisation så att vyerna kan utvärderas.
   Allt märks demo:true och kan tas bort i ett svep.                     */
const DEMO_TENANT = { id:'ten.demo', name:'Demohall Norr', domain:'demohall-norr.example' };
/* Tre organisationer, inte en. Clira-vyn — den som ser över kundgränsen —
   går inte att bedöma med bara en kund i datan.                        */
const DEMO_TENANTS = [
  DEMO_TENANT,
  { id:'ten.demo2', name:'Demohall Syd',    domain:'demohall-syd.example' },
  { id:'ten.demo3', name:'Demohall Väst',   domain:'demohall-vast.example' }
];
const DEMO_FORNAMN = ['Alva','Bilal','Clara','Dante','Ebba','Filip','Greta','Hampus',
                      'Iris','Jonas','Klara','Leo','Maja','Noah','Olivia','Rasmus',
                      'Saga','Theo'];
const DEMO_EFTERNAMN = ['Andersson','Bergqvist','Cederlund','Dahl','Ekström','Forsberg',
                        'Gustafsson','Hedman','Isaksson','Jansson','Karlsson','Lindberg',
                        'Möller','Nyström','Persson','Rydberg','Sjögren','Törnqvist'];
/* Exempeldatans domäner finns inte i kundregistret — de får inte hamna
   där, innehållsfilen är riktig data. Den här matchningen gäller bara så
   länge exempeldata finns i webbläsaren, så att man kan logga in som en
   av kunderna och se kundvyn med samma ögon som kunden.               */
/* Licenser för exempelkunderna. De ligger inte i kundregistret — dit hör
   bara riktiga kunder — men utan dem har alla tre demokunder noll licenser
   och rapporten blir tom på just de kurser som ska demonstreras. Ojämnt
   fördelat med flit: en kund har allt, en har hälften, en har inget.   */
function demoLicense(courseId, tenantId){
  if(!hasDemoData()) return null;
  const i = DEMO_TENANTS.findIndex(x => x.id === tenantId);
  if(i < 0) return null;
  const lic = (C.courses||[]).filter(c => c.licensed).map(c => c.id);
  if(!lic.includes(courseId)) return null;
  const n = lic.indexOf(courseId);
  if(i === 0) return { courseId, from:'2026-01-01', demo:true };                    // allt
  if(i === 1) return n === 0 ? { courseId, from:'2026-01-01', demo:true } : null;   // första
  return null;                                                                     // inget
}
function demoTenantFor(email){
  if(!hasDemoData()) return null;
  const d = String(email||'').split('@')[1];
  if(!d) return null;
  const dt = DEMO_TENANTS.find(x => x.domain === d.toLowerCase());
  return dt ? { id:dt.id, name:dt.name, demo:true } : null;
}
function demoRandom(seed){
  let x = seed;
  return () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; };
}
function generateDemoData(){
  const rnd = demoRandom(20260830);
  const courses = visibleCourses().filter(c => courseState(c, 'x').total > 0);
  const now = Date.now();
  let added = 0;

  for(let i = 0; i < DEMO_FORNAMN.length; i++){
    const fn = DEMO_FORNAMN[i], en = DEMO_EFTERNAMN[i];
    /* Ojämn fördelning: 10 / 5 / 3. Kunder är inte lika stora, och en vy
       som bara testas på jämna grupper döljer hur den beter sig.       */
    const ten = DEMO_TENANTS[i < 10 ? 0 : i < 15 ? 1 : 2];
    const email = (fn + '.' + en + '@' + ten.domain)
      .toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o');
    registerPerson({ name: fn + ' ' + en, email,
                     tenantId: ten.id, tenantName: ten.name, demo: true });

    // Tre profiler: har inte börjat, är mitt i, har gjort klart.
    const roll = rnd();
    const profil = roll < 0.28 ? 'ej' : roll < 0.62 ? 'pagar' : 'klar';
    if(profil === 'ej') continue;

    // Var och en gör en till tre kurser.
    const antalKurser = profil === 'klar' ? 1 + Math.floor(rnd()*2) : 1;
    for(let k = 0; k < antalKurser && k < courses.length; k++){
      const c = courses[(i + k) % courses.length];
      const ids = courseState(c, 'x').lessonIds;
      const kvar = profil === 'klar' ? 0 : Math.max(1, Math.floor(ids.length * (0.25 + rnd()*0.55)));
      const till = ids.length - kvar;
      /* Ett par av de färdiga gjorde kursen för nästan två år sedan, så att
         intyg som snart går ut faktiskt syns i rapporten. */
      const gammal = profil === 'klar' && i % 7 === 1;
      const start = now - Math.floor(gammal ? (690 + rnd()*20) * 86400000
                                            : (5 + rnd()*70) * 86400000);

      for(let j = 0; j < till; j++){
        const ts = new Date(start + j * (3600000 + rnd()*14400000)).toISOString();
        for(const verb of ['viewed','completed']){
          P.events.push({ id: uid('evt'), ts, demo: true,
            actor: { userId: email, tenantId: ten.id },
            verb, object: { type:'lesson', id: ids[j] },
            context: { courseId: c.id, courseVersion: c.version }, result: {} });
          added++;
        }
      }
      if(profil === 'klar'){
        const ts = new Date(start + till * 7200000).toISOString();
        if(c.quizId){
          P.events.push({ id: uid('evt'), ts, demo: true,
            actor: { userId: email, tenantId: ten.id },
            verb:'passed', object:{ type:'quiz', id:c.quizId },
            context:{ courseId:c.id, courseVersion:c.version },
            result:{ score: 80 + Math.floor(rnd()*21) } });
          added++;
        }
        P.events.push({ id: uid('evt'), ts, demo: true,
          actor: { userId: email, tenantId: ten.id },
          verb:'completed', object:{ type:'course', id:c.id },
          context:{ courseVersion:c.version }, result:{} });
        added++;
      }
    }
  }
  /* Ett par intresseanmälningar på låsta kurser, så att Efterfrågan-vyn
     går att bedöma. Bara om någon kurs faktiskt kräver licens. */
  const licKurser = (C.courses||[]).filter(c => c.licensed);
  if(licKurser.length){
    const alla = Object.keys(P.people||{}).filter(id => P.people[id].demo);
    let i = 0;
    for(const c of licKurser){
      for(const email of alla){
        const ten = P.people[email].tenantId;
        /* Licensen slås upp direkt, inte via courseAccess — den senare tar
           hänsyn till vem som är inloggad, och en Clira-adress hade då
           gjort varje kurs upplåst och genererat noll förfrågningar. */
        const lic = licenseFor(c.id, ten);
        const last = !lic || (lic.until && Date.parse(lic.until) < Date.now());
        if(last && (i++ % 3 === 0)){
          P.events.push({ id: uid('evt'),
            ts: new Date(now - Math.floor((1 + rnd()*25) * 86400000)).toISOString(), demo: true,
            actor: { userId: email, tenantId: ten },
            verb:'requested', object:{ type:'course', id:c.id },
            context:{ title:c.title }, result:{} });
          added++;
        }
      }
    }
  }

  /* Sätt inloggad användare i den första organisationen så att kundvyn
     visar något. En Clira-adress lämnas orörd — den ska se över alla
     kunder, inte flyttas in i en av dem.                              */
  if(P.user && !isClira()){
    P.user.tenantId = DEMO_TENANT.id;
    P.user.tenantName = DEMO_TENANT.name;
    P.user.role = deriveRole(P.user.email, DEMO_TENANT.id);
    registerPerson(P.user);
  }
  P.events.sort((a,b) => a.ts.localeCompare(b.ts));
  saveProgress();
  return added;
}
function removeDemoData(){
  const före = P.events.length;
  P.events = P.events.filter(e => !e.demo);
  for(const id of Object.keys(P.people||{})) if(P.people[id].demo) delete P.people[id];
  if(P.user && DEMO_TENANTS.some(x => x.id === P.user.tenantId)){
    P.user.tenantId = null; P.user.tenantName = null;
    P.user.role = deriveRole(P.user.email, null);
    registerPerson(P.user);
  }
  if(P.view) P.view.tenantId = null;
  saveProgress();
  return före - P.events.length;
}
const hasDemoData = () => P.events.some(e => e.demo);

/* Markerar kursen klar när villkoren uppfylls — en gång, aldrig igen. */
function maybeCompleteCourse(c){
  const st = courseState(c);
  if(st.completed && !hasEvent('course', c.id, 'completed')){
    logEvent('completed','course',c.id,{courseVersion:c.version},{score:st.best});
    return true;
  }
  return false;
}

<script>
/* ============================================================
   Blockregistret — bloktyp → DOM-nod.
   Innehållet innehåller aldrig markup, så allt byggs med textContent.
   XSS-säkerheten är därmed en följd av datamodellen, inte ett bibliotek.
   En okänd bloktyp renderas som platshållare och loggas — aldrig krasch.
   ============================================================ */
const BLOCKS = {};

/* Spans: [{text, mark?: bold|emphasis|code|term, termId?}] */
function spansEl(spans){
  const f = document.createDocumentFragment();
  for(const s of (spans||[])){
    if(typeof s === 'string'){ f.append(document.createTextNode(s)); continue; }
    const txt = s.text || '';
    if(s.mark === 'bold')          f.append(h('strong',{text:txt}));
    else if(s.mark === 'emphasis') f.append(h('em',{text:txt}));
    else if(s.mark === 'code')     f.append(h('code',{text:txt}));
    else if(s.mark === 'term'){

        onclick:()=>openTerm(s.termId)}, txt));

    else f.append(document.createTextNode(txt));
  }
  return f;
}

/* --- video: kapitel och transkript ligger i datan, inte i filen ---------
   Ett videoblock kan spela hela filen, eller ett AVSNITT av en längre
   inspelning. Det senare är normalfallet här: en enda genomgång spelades in
   i ett svep, och varje lektion visar sin del av den.

     src        filen
     startAt    sekund där lektionens avsnitt börjar (valfritt)
     endAt      sekund där det slutar (valfritt)

   Med startAt/endAt satta hoppar spelaren dit vid start, stannar vid
   slutet, och "sedd" räknas på avsnittets längd — inte på hela filens.
   Räknades den på hela filen skulle en lektion i början av en timslång
   inspelning aldrig kunna bli klar.                                      */
/* ---- inbäddade spelare (YouTube, Vimeo) ---- */
function embedInfo(src){
  const s = String(src||'').trim();
  if(!s) return null;
  let m = s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if(m) return {kind:'youtube', id:m[1], open:'https://www.youtube.com/watch?v=' + m[1]};
  m = s.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]{6,}))?(?:.*[?&]h=([0-9a-f]+))?/);
  if(m){ const hh = m[2] || m[3] || '';
    return {kind:'vimeo', id:m[1], hash:hh, open:'https://vimeo.com/' + m[1] + (hh ? '/' + hh : '')}; }
  return null;
}
function embedUrl(x, A, B){
  if(x.kind === 'youtube'){
    let u = 'https://www.youtube-nocookie.com/embed/' + x.id + '?enablejsapi=1&rel=0&playsinline=1&modestbranding=1';
    if(/^https?:/.test(location.protocol)) u += '&origin=' + encodeURIComponent(location.origin);
    if(A) u += '&start=' + Math.floor(A);
    if(B > A) u += '&end=' + Math.ceil(B);
    return u;
  }
  let u = 'https://player.vimeo.com/video/' + x.id + '?dnt=1&title=0&byline=0&portrait=0';
  if(x.hash) u += '&h=' + x.hash;
  if(A) u += '#t=' + Math.floor(A) + 's';
  return u;
}
/* Ett gemensamt lyssnarställe för alla spelare på sidan. */
const EMBEDS = new Map();
window.addEventListener('message', ev => {
  for(const [win, f] of EMBEDS){ if(ev.source === win){ try{ f(ev.data); }catch(e){} return; } }
});
function embedControl(x, fr, onFrac, onEnd){
  const post = o => { try{ fr.contentWindow && fr.contentWindow.postMessage(JSON.stringify(o), '*'); }catch(e){} };
  fr.addEventListener('load', () => {
    const win = fr.contentWindow;
    EMBEDS.set(win, raw => {
      let d = raw; if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ return; } }
      if(!d) return;
      if(x.kind === 'youtube'){
        if(d.event === 'infoDelivery' && d.info && d.info.duration)
          onFrac((d.info.currentTime || 0) / d.info.duration);
        if(d.event === 'onStateChange' && d.info === 0) onEnd();
      } else {
        if(d.event === 'timeupdate' && d.data) onFrac(d.data.percent || 0);
        if(d.event === 'ended') onEnd();
      }
    });
    if(x.kind === 'youtube') post({event:'listening', id:'kv', channel:'widget'});
    else { post({method:'addEventListener', value:'timeupdate'}); post({method:'addEventListener', value:'ended'}); }
  });
  return { seek: sek => {
    if(x.kind === 'youtube'){ post({event:'command', func:'seekTo', args:[sek, true]}); post({event:'command', func:'playVideo', args:[]}); }
    else { post({method:'setCurrentTime', value:sek}); post({method:'play'}); }
  }};
}

BLOCKS.video = (b, ctx) => {
  const box   = h('div',{cls:'vbox'});
  const stage = h('div',{cls:'vstage'});
  const A = Number(b.startAt) || 0;
  const B = Number(b.endAt)   || 0;
  const avsnitt = B > A;
  let vid = null;
  /* Klätterverket: filmerna ligger ofta hos någon annan — HLR-rådet på
     Vimeo, räddningstjänsten och Röda korset på YouTube. En sådan länk bäddas
     in som spelare i stället för att läsas som en videofil. Kapitel hoppar
     i spelaren via postMessage, och "sedd" räknas när spelaren rapporterar
     nio tiondelar. Fungerar inte spelaren — vanligt när appen öppnas direkt
     från disk — finns alltid en länk som öppnar filmen i en ny flik, och en
     knapp att kvittera med. Ingen återvändsgränd. */
  const ext = embedInfo(b.src);
  let ctl = { seek: sek => { if(vid){ vid.currentTime = sek; vid.play().catch(()=>{}); } } };
  if(ext){
    const fr = h('iframe',{src: embedUrl(ext, A, B), title: b.title || t('Videoklipp'),
      allow:'autoplay; fullscreen; picture-in-picture; encrypted-media', allowfullscreen:'',
      referrerpolicy:'strict-origin-when-cross-origin', loading:'lazy'});
    stage.append(fr);
    ctl = embedControl(ext, fr, frac => {
      if(avsnitt) return;                      // avsnitt: spelaren stannar själv vid end
      if(frac > 0.9) markWatched();
    }, () => markWatched());
  } else if(b.src){
    /* Mediafragment i adressen gör att webbläsaren hämtar rätt del direkt,
       i stället för att ladda från filens början och sedan spola. */
    const src = avsnitt ? b.src + '#t=' + A + ',' + B : (A ? b.src + '#t=' + A : b.src);
    vid = h('video',{controls:'', preload:'metadata', src:src, playsinline:''});
    if(b.captionsSrc) vid.append(h('track',{kind:'captions', srclang:'sv', label:'Svenska', src:b.captionsSrc, default:''}));

    /* Säkerhetsnät: alla webbläsare respekterar inte #t vid alla format. */
    vid.addEventListener('loadedmetadata', () => { if(A && vid.currentTime < A) vid.currentTime = A; });

    vid.addEventListener('timeupdate', () => {
      if(avsnitt){
        if(vid.currentTime >= B){ vid.pause(); vid.currentTime = B; markWatched(); return; }
        if(vid.currentTime < A - 1) vid.currentTime = A;      // spolade före avsnittet
        if((vid.currentTime - A) / (B - A) > 0.9) markWatched();
      } else if(vid.duration && vid.currentTime / vid.duration > 0.9) markWatched();
    });
    stage.append(vid);
  } else {
    stage.append(h('div',{cls:'vph'},
      h('b',{text: b.title || t('Videoklipp')}),
      h('span',{text:t('Filmen är inte kopplad i innehållsfilen ännu. Kapitel och transkript nedan fungerar ändå — och räknas som textalternativ.')})));
  }
  // Vattenstämpel: den som spelar in skärmen vet att kopian pekar tillbaka.
  const who = P.user ? (P.user.name + ' · ' + P.user.email) : t('ej inloggad');
  stage.append(h('div',{cls:'wmark',text: who}));
  box.append(stage);

  /* Säg rakt ut att det här är en del av en längre inspelning. Annars ser
     det ut som att filmen är avklippt, eller som att spelaren krånglar. */
  if(avsnitt) box.append(h('div',{cls:'vseg'},
    h('span',{cls:'vsl',text:t('Avsnitt ur inspelningen')}),
    h('span',{cls:'mono',text: mmss(A) + '–' + mmss(B)}),
    h('span',{cls:'muted',text:'(' + t('%1 min', Math.round((B-A)/60)) + ')'})));

  let watched = hasVideoView(b.assetId);
  function markWatched(){
    if(watched) return; watched = true;
    logEvent('viewed','video', b.assetId || 'video', {lessonId: ctx.lessonId});
    if(seenBtn){ seenBtn.textContent = t('✓ Filmen är sedd'); seenBtn.disabled = true; }
    if(ctx.onProgress) ctx.onProgress();
  }
  /* Inbäddad film: länk ut och kvittering, alltid synliga. */
  let seenBtn = null;
  if(ext){
    seenBtn = h('button',{cls:'btn sm',type:'button',
      text: watched ? t('✓ Filmen är sedd') : t('Jag har sett filmen'), onclick:()=>markWatched()});
    seenBtn.disabled = watched;
    box.append(h('div',{cls:'vext'},
      h('span',{text:t('Spelas inte filmen här? Öppna den i en ny flik och kvittera sedan att du sett den.')}),
      h('span',{cls:'spacer'}),
      h('a',{cls:'btn sm',href:ext.open,target:'_blank',rel:'noopener noreferrer',
        text:t(ext.kind==='youtube' ? 'Öppna på YouTube ↗' : 'Öppna på Vimeo ↗')}),
      seenBtn));
  }

  const tabs  = h('div',{cls:'vtabs'});
  const pane  = h('div',{cls:'vpane'});
  const panes = {};

  /* Kapitel och transkript i datan har tider räknade från FILENS början.
     Visar lektionen ett avsnitt ska bara avsnittets rader listas, och
     tiden visas räknad från avsnittets början — annars börjar lektion 2.7
     på "34:12", vilket bara förvirrar. Hoppet sker fortfarande till den
     absoluta tiden i filen. */
  const iAvsnitt = sek => !avsnitt || (sek >= A - 0.5 && sek <= B + 0.5);
  const visaTid  = sek => mmss(avsnitt ? Math.max(0, sek - A) : sek);

  const kap = (b.chapters||[]).filter(ch => iAvsnitt(ch.at));
  if(kap.length){
    panes.kapitel = h('div', null, kap.map(ch =>
      h('button',{cls:'chap', type:'button', onclick:()=>ctl.seek(ch.at)},
        h('span',{cls:'ct',text:visaTid(ch.at)}), h('span',{text:ch.label}))));
  }
  const tra = (b.transcript||[]).filter(x => iAvsnitt(x.at));
  if(tra.length){
    panes.transkript = h('div', null, tra.map(x =>
      h('button',{cls:'tr', type:'button', onclick:()=>{ ctl.seek(x.at, true); markWatched(); }},
        h('span',{cls:'ct',text:visaTid(x.at)}), h('span',{text:x.text}))));
  }
  /* Inspelningarna är gjorda på svenska. En engelsk elev ska inte behöva
     starta filmen för att upptäcka det — och transkriptet, som är översatt,
     är då vägen genom innehållet. */
  if(b.src && lang() !== 'sv') box.append(h('div',{cls:'blk-callout info',style:'margin:10px 0 0'},
    h('b',{cls:'ct',text:t('Inspelningen är på svenska')}),
    h('span',{text:t('Filmen är talad på svenska. Transkriptet nedan är översatt och går att läsa i stället — det räknas som att du tagit del av lektionen.')})));

  const RUBRIK = {kapitel:'Kapitel', transkript:'Transkript'};
  const names = Object.keys(panes);
  if(names.length){
    names.forEach((n,i) => {
      const btn = h('button',{cls: i===0?'on':'', type:'button', text: t(RUBRIK[n] || n),
        onclick: () => {
          [...tabs.children].forEach(x=>x.classList.remove('on'));
          btn.classList.add('on');
          pane.replaceChildren(panes[n]);
          if(n==='transkript') markWatched();   // textalternativet räknas som taget del av
        }});
      tabs.append(btn);
    });
    pane.replaceChildren(panes[names[0]]);
    box.append(tabs, pane);
  }
  return box;
};

/* --- uppgift: lär i verktyget, inte om verktyget --- */
BLOCKS.task = (b, ctx) => {
  const id   = b.id || (ctx.lessonId + ':task');
  const done = hasEvent('task', id, 'completed');
  const base = trainingBase();
  const url  = base && b.deepLink ? base.replace(/\/$/,'') + b.deepLink : '';

  const wrap = h('div',{cls:'task'});
  const row  = h('div',{cls:'trow'});

  /* Alla övningar sker inte i eSource. En intern processkurs har övningar
     som görs i kundkortet eller i huvudet — då ska det inte stå en knapp
     som lovar att öppna något. Saknas djuplänken visas bara kvitteringen. */
  let open = null;
  if(b.deepLink){
    open = h('a',{cls:'btn primary', href: url || '#', target: url?'_blank':null,
      rel:'noopener noreferrer', text:t('Öppna länken')});
    if(!url) open.addEventListener('click', e => { e.preventDefault();
      toast(t('Övningens adress är inte satt. Redaktören anger den på anläggningen, eller allmänt under Inställningar.')); });
  }

  const mark = h('button',{cls: done ? 'btn' : 'btn', type:'button',
    text: done ? t('✓ Klarmarkerad') : t('Jag har gjort det'),
    onclick: () => {
      if(hasEvent('task', id, 'completed')) return;
      logEvent('completed','task', id, {lessonId: ctx.lessonId});
      mark.textContent = t('✓ Klarmarkerad'); mark.disabled = true;
      if(ctx.onProgress) ctx.onProgress();
      toast(t('Uppgiften kvitterad'));
    }});
  mark.disabled = done;

  add(row, open, mark);
  wrap.append(h('div',{cls:'tl',text:t('Övning')}), h('p',null,inline(b.instruction)), row);
  if(b.hint) wrap.append(h('div',{cls:'hint small muted',text:b.hint}));
  return wrap;
};

BLOCKS.quizRef = (b, ctx) => h('div',{cls:'task'},
  h('div',{cls:'tl',text:t('Kunskapstest')}),
  h('p',null,inline(b.text || t('Kursen avslutas med ett prov.'))),
  h('div',{cls:'trow'}, h('button',{cls:'btn primary', type:'button', text:t('Till provet'),
    onclick:()=>go('#/prov/'+ctx.courseId)})));

/* Renderar en lektions block. Okänd typ ger platshållare, inte krasch. */
function renderBlocks(blocks, ctx){
  const f = document.createDocumentFragment();
  for(const b of (blocks||[])){
    const fn = BLOCKS[b.type];
    if(!fn){
      console.warn('[Academy] okänd bloktyp:', b.type);
      f.append(h('div',{cls:'blk-callout warning'},
        h('b',{cls:'ct',text:t('Block kan inte visas')}),
        h('span',{text:t('Bloktypen "%1" finns inte i renderaren.', b.type)})));
      continue;
    }
    try{ f.append(fn(b, ctx)); }
    catch(err){
      console.error('[Academy] block kraschade:', b.type, err);
      f.append(h('div',{cls:'blk-callout warning'},h('span',{text:t('Blocket kunde inte visas.')})));
    }
  }
  return f;
}

function openTerm(id){
  const d = term(id);
  if(!d) return;
  modal('narrow', d.term || id, m => {
    m.append(h('p',null,inline(d.definition)));
    if(d.more) m.append(h('p',{cls:'small muted'},inline(d.more)));
  }, [{label:t('Stäng'), cls:'btn'}]);
}

<script>
/* ============================================================
   Vyer, router och provmotor
   ============================================================ */
const APP = () => document.getElementById('app');

function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }

function parseRoute(){
  const p = (location.hash || '#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!p.length)              return {view:'start'};
  if(p[0]==='katalog')       return {view:'catalog'};
  if(p[0]==='kurs')          return {view:'course', courseId:decodeURIComponent(p[1]||'')};
  if(p[0]==='lektion')       return {view:'lesson', courseId:decodeURIComponent(p[1]||''), lessonId:decodeURIComponent(p[2]||'')};
  if(p[0]==='prov')          return {view:'quiz',   courseId:decodeURIComponent(p[1]||'')};
  if(p[0]==='intyg')         return {view:'certs'};
  if(p[0]==='rapport'){
    if(p[1]==='kurs')  return {view:'reportCourse', courseId:decodeURIComponent(p[2]||''),
                               filter:decodeURIComponent(p[3]||'alla')};
    if(p[1]==='intyg') return {view:'reportCerts'};
    if(p[1]==='org')   return {view:'reportOrgs'};
    if(p[1]==='efterfragan') return {view:'reportDemand'};
    if(p[1]==='insyn') return {view:'reportAudit'};
    return {view:'report'};
  }
  
  return {view:'start'};
}

const NAV = [
  {id:'start',   label:'Start',      hash:'#/'},
  {id:'catalog', label:'Kurser',     hash:'#/katalog'},
  {id:'certs',   label:'Mina intyg', hash:'#/intyg'},
  {id:'report',  label:'Rapport',    hash:'#/rapport'}
];
function renderNav(){

    const on = route.view===item.id
      || (item.id==='catalog' && ['course','lesson','quiz'].includes(route.view))
      || (item.id==='report'  && ['reportCourse','reportCerts','reportOrgs','reportAudit','reportDemand'].includes(route.view));
    const b = h('button',{cls: on?'on':'', type:'button', text:item.label, onclick:()=>go(item.hash)});
    if(item.id==='certs'){
      const nc = certificates().length;
      if(nc) b.append(h('span',{cls:'pill',text:String(nc)}));
    }
    return b;
  }));
  
}
/* Språkväljaren i toppraden. Göms i redaktörsläget — där finns bara ett
   språk, källspråket, och en väljare som inte gör något är värre än ingen. */

function setSaveState(){
  /* Variabeln får inte heta t — det är namnet på översättningsfunktionen. */
  const d = document.getElementById('dot'), txt = document.getElementById('savetxt'),
        f = document.getElementById('fileinfo');

    else if(n){ d.className = 'dot dirty'; txt.textContent = t('Synkar…'); }

  /* Utloggningen syns i toppraden när någon är inloggad — den ska inte

/* ---------- modal ---------- */
function modal(size, title, build, buttons){
  const host = document.getElementById('modal');
  const box  = h('div',{cls:'modal '+(size||'')});
  const body = h('div',{cls:'modal-b'});
  const close = () => host.replaceChildren();
  box.append(
    h('div',{cls:'modal-h'}, h('h2',{text:title}),
      h('button',{cls:'x',type:'button','aria-label':'Stäng',text:'×',onclick:close})),
    body);
  if(buttons && buttons.length){
    box.append(h('div',{cls:'modal-f'}, h('div',{cls:'spacer'}),
      ...buttons.map(b => h('button',{cls:b.cls||'btn',type:'button',text:b.label,
        onclick:()=>{ if(!b.onclick || b.onclick()!==false) close(); }}))));
  }
  build(body, close);
  const ovl = h('div',{cls:'ovl', onclick:e=>{ if(e.target===ovl) close(); }}, box);
  host.replaceChildren(ovl);
  const first = box.querySelector('input,button,select,textarea');
  if(first) first.focus();
  return close;
}

/* ---------- statusikon: form, inte bara färg ---------- */

  const map = {done:['done','✓'], now:['now','▸'], open:['',''], lock:['lock','🔒'], plan:['plan','·']};
  const [cls,ch] = map[state] || ['',''];

}
function progBar(pct, ok){
  return h('div',{cls:'prog'+(ok?' ok':''),role:'progressbar','aria-valuenow':String(pct),
    'aria-valuemin':'0','aria-valuemax':'100'}, h('i',{style:'width:'+pct+'%'}));
}

/* ============================== START ============================== */
function viewStart(){
  const app = APP(); app.replaceChildren();
  const target = resumeTarget();
  app.append(heroEl());

  if(target){
    const st = courseState(target);
    const next = st.next ? lesson(st.next) : null;
    const line = st.completed ? 'Klar' :
      next ? next.title + ' · ' + t('%1 min', next.estimatedMinutes||5) : 'Provet återstår';
    app.append(h('div',{cls:'resume'},
      h('div',{cls:'rgrow'},
        h('div',{cls:'rl',text: st.started ? 'Fortsätt där du var' : 'Börja här'}),
        h('h2',{text: target.title}),
        h('div',{cls:'rs',text: line + (st.started ? ' · ' + st.minutesLeft + ' min kvar i kursen' : '')})),
      h('button',{cls:'btn primary lg',type:'button',
        text: st.started ? 'Fortsätt' : 'Starta kursen',
        onclick:()=> st.next ? go('#/lektion/'+target.id+'/'+st.next) : go('#/prov/'+target.id)})));
  }

  /* Siffrorna räknar bara det eleven kan göra. Att stå på "3 av 7 klara"
     när fyra är låsta är inte ett framsteg, det är en felmätning. */
  const mina  = accessibleCourses();
  const lasta = visibleCourses().filter(c => isLocked(c));
  const cs    = mina.map(courseState);
  app.append(h('div',{cls:'kpis'},
    kpi('Kurser klara', t('%1 av %2', cs.filter(s=>s.completed).length, mina.length), '', 'ok'),
    kpi('Pågående', String(cs.filter(s=>s.started && !s.completed).length), ''),
    kpi('Intyg', String(certificates().length), 'giltiga', 'plan'),
    kpi('Tid kvar', t('%1 min', cs.reduce((a,s)=>a+(s.completed?0:s.minutesLeft),0)), 'för allt du inte gjort')));

  app.append(h('h3',{text:'Dina kurser'}));
  app.append(courseGrid(mina));

  if(lasta.length){
    app.append(h('div',{cls:'row',style:'margin:26px 0 2px'},
      h('h3',{style:'margin:0',text:'Finns också i Klätterverket Academy'}),
      h('div',{cls:'spacer'}),
      h('span',{cls:'small muted',
        text: lasta.length===1 ? t('%1 utbildning ingår inte i er tillgång', lasta.length)
                               : t('%1 utbildningar ingår inte i er tillgång', lasta.length)})));
    app.append(h('p',{cls:'small muted',style:'margin:4px 0 12px',
      text:'Klicka för att se vad de innehåller och anmäla intresse.'}));
    app.append(courseGrid(lasta));
  }
}
/* Klätterverket: startsidan börjar med hallen — bild eller film ur
   Inställningar. Den är låg, så att "Fortsätt där du var" fortfarande syns
   utan att skrolla: en enda nästa åtgärd gäller fortfarande. */
function heroEl(){
  const s = (C && C.settings) || {};
  const hero = h('div',{cls:'hero'});
  if(s.heroImage) hero.style.backgroundImage = 'url("' + String(s.heroImage).replace(/["\\]/g,'') + '")';
  const lugn = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(s.heroVideo && !lugn){
    const v = h('video',{src:s.heroVideo, autoplay:'', loop:'', playsinline:'', preload:'auto', 'aria-hidden':'true'});
    v.muted = true; v.defaultMuted = true;
    v.addEventListener('error', () => v.remove());
    hero.append(v);
  }
  const namn = P.user ? String(P.user.name||'').split(' ')[0] : '';
  hero.append(h('div',{cls:'hero-in'},
    h('div',{cls:'hero-k',text: tr(s.heroKicker) || 'Klätterverket Academy'}),
    h('div',{cls:'hero-t',text: tr(s.heroTitle) || 'Vi skapar trygghet!'}),
    h('div',{cls:'hero-s',text: (namn ? t('Hej %1!', namn) + ' ' : '') + (tr(s.heroText) || '')})));
  return hero;
}
function kpi(label, value, sub, cls){
  return h('div',{cls:'kpi'+(cls?' '+cls:'')},
    h('div',{cls:'l',text:label}), h('div',{cls:'v',text:value}),
    h('div',{cls:'s',text:sub||''}));
}

/* ============================== KATALOG ============================== */
function viewCatalog(){
  const app = APP(); app.replaceChildren();
  app.append(h('h1',{text:'Kurser'}));

  const auds = [...new Set(visibleCourses().flatMap(c=>c.audience||[]))];
  const bar  = h('div',{cls:'row',style:'margin-bottom:14px'});
  let filter = 'alla';
  const draw = () => {
    const list = visibleCourses().filter(c => filter==='alla' || (c.audience||[]).includes(filter));
    grid.replaceChildren(list.length ? courseGrid(list)
      : h('div',{cls:'nores',text:'Inga kurser för den målgruppen ännu.'}));
  };
  const mk = (val,label) => {
    const b = h('button',{cls:'btn sm'+(filter===val?' primary':''),type:'button',text:label,
      onclick:()=>{ filter=val; [...bar.children].forEach(x=>x.classList.remove('primary'));
                    b.classList.add('primary'); draw(); }});
    return b;
  };
  bar.append(mk('alla','Alla'), ...auds.map(a => mk(a, audienceLabel(a))));
  bar.firstChild.classList.add('primary');
  const grid = h('div');
  app.append(bar, grid); draw();
}
const AUD = {all:'Alla medarbetare', reception:'Reception', instructor:'Instruktörer',
             hallvard:'Hallvärdar', cafe:'Kafé', lead:'Platsansvariga', internal:'Internt'};
/* Etiketten översätts vid visning, inte i tabellen — tabellen är nycklar. */
const audienceLabel = a => t(AUD[a] || a);

/* Hänglåset. Form, inte bara färg — och en riktig etikett för skärmläsare,
   eftersom "låst" är information och inte dekoration. */
function lockIcon(){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','lockico');
  s.setAttribute('aria-hidden','true'); s.setAttribute('focusable','false');
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M7 10V7a5 5 0 0 1 10 0v3h1.2A1.8 1.8 0 0 1 20 11.8v7.4A1.8 1.8 0 0 1 18.2 21H5.8A1.8 1.8 0 0 1 4 19.2v-7.4A1.8 1.8 0 0 1 5.8 10H7Zm2 0h6V7a3 3 0 0 0-6 0v3Zm3 5.2a1.4 1.4 0 0 0-.7 2.6v1.1a.7.7 0 0 0 1.4 0v-1.1a1.4 1.4 0 0 0-.7-2.6Z');
  s.append(p);
  return s;
}
function courseGrid(list){
  return h('div',{cls:'cgrid'}, list.map(c => {
    const acc    = courseAccess(c);
    const locked = acc === 'locked' || acc === 'expired';
    const st     = courseState(c);
    const miss   = prereqMissing(c);
    const card = h('button',{cls:'ccard' + (locked?' lockd':''), type:'button',
      onclick:()=>go('#/kurs/'+c.id)});
    if(c.cover){
      const im = h('img',{src:c.cover, alt:'', loading:'lazy'});
      /* Går bilden inte att hämta (ingen uppkoppling, flyttad bild) ska
         kortet se ut som vanligt — inte visa en trasig bild. */
      im.addEventListener('error', () => { if(im.parentNode) im.parentNode.remove(); });
      card.append(h('div',{cls:'ccover'}, im));
    }
    if(locked) card.append(h('span',{cls:'lockbadge'}, lockIcon(),
      h('span',{text: acc==='expired' ? 'Licensen har gått ut' : 'Låst'})));
    add(card,
      h('div',{cls:'cmeta'},
        ...(c.audience||[]).map(a => h('span',{cls:'tag prod',text:audienceLabel(a)})),
        c.certificate && c.certificate.issue ? h('span',{cls:'tag n',text:'Intyg'}) : null),
      h('h3',{text:c.title}),
      h('div',{cls:'cs',text:c.summary||''}),
      locked ? null : (st.total ? progBar(st.pct, st.completed) : null),
      locked
        ? h('div',{cls:'row small muted'},
            h('span',{text: t('%1 min', c.estimatedMinutes || st.minutesLeft || 0)}),
            st.total ? h('span',{text:'·'}) : null,
            st.total ? h('span',{text: t('%1 lektioner', st.total)}) : null,
            h('div',{cls:'spacer'}),
            h('span',{cls:'small',style:'color:var(--brand);font-weight:600',
              text: hasRequested(c) ? 'Efterfrågad ✓' : 'Läs mer →'}))
        : (st.total
          ? h('div',{cls:'row small muted'},
              h('span',{text: st.completed ? 'Klar' : st.pct + '%'}),
              h('span',{text:'·'}),
              h('span',{text: t('%1 min', c.estimatedMinutes||st.minutesLeft)}),
              h('span',{text:'·'}),
              h('span',{text: t('%1 lektioner', st.total)}))
          : h('div',{cls:'row'}, h('span',{cls:'tag warn',text:'Under produktion'}))));
    if(!locked && miss.length) card.append(h('div',{cls:'small',style:'color:var(--warn)',
      text:t('Kräver: %1', miss.map(m=>m.title).join(', '))}));
    return card;
  }));
}

/* ---------------- Låst kurs ----------------
   En låst kurs är inte en stängd dörr utan ett skyltfönster: vad ingår, hur
   lång är den, vad kan man efteråt. Innehållet visas aldrig — bara titlar.
   Knappen skriver en händelse i loggen, så att intresset blir en lista
   någon kan agera på i stället för en känsla.                            */
function lockedCourse(c, app, acc){
  const lic = licenseFor(c.id, (P.user && P.user.tenantId) || null);
  const org = (P.user && P.user.tenantName) || null;

  app.append(h('div',{cls:'lockhero'},
    h('div',{cls:'lh-ico'}, lockIcon()),
    h('div',{style:'flex:1;min-width:220px'},
      h('div',{cls:'lh-t',text: acc === 'expired'
        ? 'Er tillgång till den här utbildningen har gått ut'
        : 'Den här utbildningen ingår inte i er tillgång'}),
      h('div',{cls:'lh-s',text: acc === 'expired'
        ? t('Licensen gick ut %1. Innehållet finns kvar och öppnas igen så snart tillgången förnyas.',
             lic && lic.until ? lic.until : t('tidigare'))
        : t('Innehållet är klart och kan öppnas för %1. Utbildningen låses upp av utbildningsansvarig.',
             org || t('er anläggning'))}))));

  /* Innehållsförteckning utan innehåll: modulnamn och antal lektioner. */
  const mods = h('div',{cls:'mods'});
  let nLes = 0;
  for(const m of (c.modules||[])){
    const live = (m.lessons||[]).filter(id => { const l = lesson(id); return l && l.status !== 'planned'; });
    nLes += live.length;
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:m.title}),
      h('div',{cls:'spacer'}),
      h('span',{cls:'small muted',text: live.length===1 ? t('%1 lektion', live.length)
                                                          : t('%1 lektioner', live.length)})));
    for(const id of live){
      const l = lesson(id);
      box.append(add(h('div',{cls:'les lesq'}),
        h('span',{cls:'st lock','aria-hidden':'true',text:'🔒'}),
        h('span',{cls:'lnum',text:l.label||''}),
        h('span',{cls:'lt'}, h('b',{text:l.title}),
          h('s',{text:t('%1 min', l.estimatedMinutes||5)}))));
    }
    mods.append(box);
  }

  app.append(h('div',{cls:'kpis'},
    kpi('Lektioner', String(nLes), 'i utbildningen'),
    kpi('Tidsåtgång', t('%1 min', c.estimatedMinutes || nLes*5), 'ungefär, i egen takt'),
    kpi('Intyg', c.certificate && c.certificate.issue ? 'Ja' : 'Nej',
        c.certificate && c.certificate.issue
          ? t('giltigt i %1 månader', (c.certificate.validMonths||24)) : 'ingen examination',
        c.certificate && c.certificate.issue ? 'ok' : '')));

  /* Intresseanmälan */
  const box = h('div',{cls:'card',style:'margin:0 0 16px'},h('div',{cls:'card-b'}));
  const b = box.firstChild;
  if(hasRequested(c)){
    b.append(h('div',{cls:'banner ok',style:'margin:0'},h('span',{
      text:'Tack — din platsansvarige och utbildningsansvarig ser att du efterfrågat den här utbildningen. Prata med din chef om det är brådskande.'})));
  } else {
    b.append(h('div',{cls:'row'},
      h('div',{style:'flex:1;min-width:240px'},
        h('div',{style:'font-weight:600',text:'Vill du gå den här utbildningen?'}),
        h('div',{cls:'small muted',text:'Anmäl intresse så syns det i anläggningens rapport och hos utbildningsansvarig. Det är bara en förfrågan — inget mer händer automatiskt.'})),
      h('button',{cls:'btn primary',type:'button',text:'Anmäl intresse',onclick:()=>{
        requestCourse(c); render(); toast('Intresset är registrerat');
      }})));
  }
  app.append(box);
  app.append(h('h3',{text:'Det här ingår'}));
  if(!nLes){
    app.append(h('div',{cls:'card'},h('div',{cls:'nores'},
      h('div',{text:'Innehållet produceras just nu.'}),
      h('div',{cls:'small muted',style:'margin-top:8px',
        text:'Utbildningen finns i planen men lektionerna är inte inspelade eller skrivna ännu. Anmäl intresse ovan om ni vill ha den när den är klar.'}))));
  } else {
    app.append(mods);
    app.append(h('p',{cls:'small muted',style:'margin-top:14px',
      text:'Lektionsrubrikerna visas för att du ska kunna bedöma innehållet. Själva lektionerna öppnas när utbildningen låses upp.'}));
  }
}

/* ============================== KURS ============================== */
function viewCourse(){
  const c = course(route.courseId);
  const app = APP(); app.replaceChildren();
  if(!c){ app.append(h('div',{cls:'nores',text:'Kursen finns inte.'})); return; }
  const st = courseState(c);
  const miss = prereqMissing(c);
  const acc = courseAccess(c);

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Kurser',onclick:()=>go('#/katalog')}),
    h('span',{text:'/'}), h('span',{text:c.title})));

  if(c.cover){ const ch = h('div',{cls:'chero'}); ch.style.backgroundImage = 'url("' + String(c.cover).replace(/["\\]/g,'') + '")'; app.append(ch); }
  app.append(h('h1',{text:c.title}));
  app.append(h('p',{cls:'muted',style:'max-width:70ch;margin-top:-6px',text:c.summary||''}));

  /* Låst kurs: visa vad den innehåller, men inget innehåll. Det är hela
     poängen — man ska kunna se att den är värd att skaffa. */
  if(acc === 'locked' || acc === 'expired'){ lockedCourse(c, app, acc); return; }

  if(miss.length) app.append(h('div',{cls:'banner warn'},
    h('span',{text:t('Den här kursen bygger på %1. Du kan läsa ändå, men gör den först om du är ny.', miss.map(m=>m.title).join(', '))})));

  if(!st.total) app.append(h('div',{cls:'banner warn'},h('span',{
    text:'Kursen är under produktion. Innehållet spelas in och skrivs — strukturen nedan visar vad som planeras.'})));
  else app.append(h('div',{cls:'card',style:'margin-bottom:16px'}, h('div',{cls:'card-b'},
    h('div',{cls:'row'},
      h('div',{style:'flex:1;min-width:200px'},
        h('div',{cls:'small muted',style:'margin-bottom:6px',
          text: st.completed ? 'Kursen är klar'
      : t('%1 av %2 lektioner · %3 min kvar', st.done, st.total, st.minutesLeft)}),
        progBar(st.pct, st.completed)),
      st.next
        ? h('button',{cls:'btn primary',type:'button',text: st.started?'Fortsätt':'Starta kursen',
            onclick:()=>go('#/lektion/'+c.id+'/'+st.next)})
        : (c.quizId ? h('button',{cls:'btn primary',type:'button',
            text: st.passed?'Gör om provet':'Till provet', onclick:()=>go('#/prov/'+c.id)}) : null)))));

  const mods = h('div',{cls:'mods'});
  for(const m of (c.modules||[])){
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:m.title})));
    for(const lid of (m.lessons||[])){
      const l = lesson(lid);
      if(!l){ continue; }
      const planned = l.status === 'planned';
      const done    = hasEvent('lesson', lid, 'completed');
      const isNext  = st.next === lid;
      const b = h('button',{cls:'les',type:'button',disabled:planned||null,
        onclick: planned ? null : ()=>go('#/lektion/'+c.id+'/'+lid)});
      add(b,
        statusEl(planned?'plan':done?'done':isNext?'now':'open'),
        h('span',{cls:'lnum',text:l.label||''}),
        h('span',{cls:'lt'}, h('b',{text:l.title}),
          h('s',{text: planned ? 'Kommande' : (l.estimatedMinutes||5)+' min'})),
        planned ? h('span',{cls:'tag n',text:'Kommande'}) : null);
      box.append(b);
    }
    mods.append(box);
  }
  if(c.quizId){
    const q = quizDef(c.quizId) || {};
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:'Kunskapstest'})));
    const b = h('button',{cls:'les',type:'button',onclick:()=>go('#/prov/'+c.id)});
    add(b, statusEl(st.passed?'done':st.next?'lock':'now'), h('span',{cls:'lnum',text:''}),
      h('span',{cls:'lt'}, h('b',{text: q.title || 'Prov'}),
        h('s',{text: t('%1 frågor', q.draw ? q.draw.count : (q.items||[]).length) +
          t(' · godkänt vid %1%', Math.round((q.passScore||0.8)*100)) +
          (st.attempts ? t(' · %1 försök gjorda', st.attempts) : '')})),
      st.passed ? h('span',{cls:'tag fakt',text:t('Godkänd %1%', st.best)}) : null);
    box.append(b); mods.append(box);
  }
  app.append(mods);
}
</script>
<script>
/* ============================== LEKTION ============================== */
/* Vad som krävs för att lektionen ska räknas som klar. Deklareras av
   innehållet, inte av koden: video ska ha setts (eller transkriptet öppnats)
   och varje övning ska vara kvitterad. */
function hasVideoView(assetId){ return hasEvent('video', assetId || 'video', 'viewed'); }
function lessonRequirements(l){
  const out = [];
  for(const b of (l.blocks||[])){
    if(b.type === 'video'){
      // Går den inte att se och saknar transkript kan den heller inte krävas.
      const watchable = !!b.src || (b.transcript||[]).length > 0;
      if(watchable && !hasVideoView(b.assetId))
        out.push({key:'video', label: (b.transcript||[]).length ? 'se filmen eller öppna transkriptet' : 'se filmen'});
    }
    if(b.type === 'task'){
      const id = b.id || (l.id + ':task');
      if(!hasEvent('task', id, 'completed')) out.push({key:'task', label:'kvittera övningen'});
    }
  }
  return out;
}

function viewLesson(){
  const c = course(route.courseId), l = lesson(route.lessonId);
  const app = APP(); app.replaceChildren();
  if(!c || !l){ app.append(h('div',{cls:'nores',text:'Lektionen finns inte.'})); return; }
  /* Låst kurs: ingen lektion, inget prov, ingen händelse i loggen. Den som
     skriver in adressen för hand landar på kursens skyltfönster. */
  if(isLocked(c)){ go('#/kurs/' + c.id); return; }
  if(l.status === 'planned'){
    app.append(h('div',{cls:'banner warn'},h('span',{text:'Den här lektionen är inte inspelad ännu.'})));
  }
  if(l.draft){
    app.append(h('div',{cls:'banner info noprint'},h('span',{
      text:'Utkast — lektionen ska granskas och kompletteras med era lokala rutiner innan den räknas som färdig.'})));
  }
  if(!hasEvent('lesson', l.id, 'viewed'))
    logEvent('viewed','lesson',l.id,{courseId:c.id, courseVersion:c.version});

  const st  = courseState(c);
  const ids = st.lessonIds;
  const i   = ids.indexOf(l.id);
  const nextId = i >= 0 && i < ids.length-1 ? ids[i+1] : null;

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Kurser',onclick:()=>go('#/katalog')}),
    h('span',{text:'/'}),
    h('button',{cls:'link',type:'button',text:c.title,onclick:()=>go('#/kurs/'+c.id)}),
    h('span',{text:'/'}), h('span',{text:l.title})));

  const wrap = h('div',{cls:'lwrap'});
  const body = h('div',{cls:'lbody'});
  const head = h('div',{cls:'lhead'},
    h('h1',{text:l.title}),
    h('div',{cls:'small muted',text:[l.label ? t('Avsnitt %1', l.label) : null,
      t('%1 min', l.estimatedMinutes||5)].filter(Boolean).join(' · ')}));
  body.append(head);

  const ctx = {courseId:c.id, lessonId:l.id, onProgress:()=>drawFoot()};
  body.append(renderBlocks(l.blocks, ctx));

  const foot = h('div',{cls:'lfoot'});
  body.append(foot);

  function drawFoot(){
    foot.replaceChildren();
    const done = hasEvent('lesson', l.id, 'completed');
    const missing = lessonRequirements(l);

    if(done){
      foot.append(h('span',{cls:'tag fakt',text:'✓ Klar'}));
      if(nextId) foot.append(h('button',{cls:'btn primary',type:'button',text:'Nästa lektion',
        onclick:()=>go('#/lektion/'+c.id+'/'+nextId)}));
      else if(c.quizId) foot.append(h('button',{cls:'btn primary',type:'button',text:'Till provet',
        onclick:()=>go('#/prov/'+c.id)}));
      else foot.append(h('button',{cls:'btn',type:'button',text:'Tillbaka till kursen',
        onclick:()=>go('#/kurs/'+c.id)}));
      return;
    }
    const btn = h('button',{cls:'btn primary',type:'button',
      text: nextId ? 'Markera klar och fortsätt' : 'Markera klar',
      onclick:()=>{
        logEvent('completed','lesson',l.id,{courseId:c.id, courseVersion:c.version});
        if(maybeCompleteCourse(c)) toast('Kursen är klar');
        if(nextId) go('#/lektion/'+c.id+'/'+nextId);
        else render();
      }});
    if(missing.length){
      btn.disabled = true;
      foot.append(btn, h('span',{cls:'small muted',
        text:t('Kvar innan lektionen kan markeras klar: %1',
               missing.map(m=>t(m.label)).join(', '))}));
    } else foot.append(btn);
    if(nextId) foot.append(h('button',{cls:'btn ghost',type:'button',text:'Hoppa över',
      onclick:()=>go('#/lektion/'+c.id+'/'+nextId)}));
  }
  drawFoot();

  /* höger räls: alltid synlig progression */
  const rail = h('div',{cls:'rail noprint'});
  rail.append(h('div',{cls:'card'},h('div',{cls:'card-b'},
