<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klätterverket Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F1; --panel:#fff; --line:#E4E2DC; --line2:#EEEDE8;
  --txt:#111111; --muted:#66655F; --brand:#111111; --brand-l:#EFEEEA;
  --ok:#027A48; --ok-l:#ECFDF3; --warn:#B54708; --warn-l:#FFFAEB;
  --plan:#3D3D3A; --plan-l:#EFEEEA; --err:#B42318; --err-l:#FEF3F2;
  --r:10px; --accent:#FFD23F; --sh:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- layout ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.top-in{max-width:1600px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:18px;height:54px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo img{height:26px;width:auto;display:block}
.logo span{font-weight:600;font-size:14.5px;color:var(--brand);padding-left:10px;border-left:1px solid var(--line)}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--bg);color:var(--txt)}
nav button.on{background:var(--brand-l);color:var(--brand);font-weight:600}
nav button .pill{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;text-align:center;vertical-align:1px}
.ednav{display:inline-flex;align-items:center;gap:7px;background:var(--brand);border:1px solid var(--brand);
  color:#fff;font-weight:600;border-radius:6px;padding:7px 14px;white-space:nowrap;box-shadow:var(--sh)}
.ednav:hover{background:#000000;border-color:#000000}
.ednav span:first-child{font-size:13px;opacity:.9}
.savebox{display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
/* Språkväljaren: två små knappar som visar båda språken samtidigt, inte en
   meny man måste öppna för att se vad som finns. Den valda är ifylld. */
.langsw{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langsw button{border:0;background:#fff;color:var(--muted);font:inherit;font-size:11.5px;
  font-weight:600;letter-spacing:.03em;padding:4px 8px;cursor:pointer}
.langsw button+button{border-left:1px solid var(--line)}
.langsw button:hover{background:var(--brand-l)}
.langsw button.on{background:var(--brand);color:#fff;cursor:default}
.langsw button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.dot.dirty{background:var(--warn)}
.dot.ro{background:var(--muted)}
.savetxt{font-size:12px;color:var(--muted);line-height:1.15;display:block}
.fileinfo{display:block;font-size:10.5px;opacity:.8}
main{max-width:1600px;margin:0 auto;padding:18px}

/* ---------- generic ---------- */
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500;box-shadow:var(--sh)}
.btn:hover{background:#FBFAF8}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#000000}
.btn.sm{padding:4px 9px;font-size:12.5px;box-shadow:none}
.btn.lg{padding:10px 18px;font-size:15px}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--txt)}
.btn.danger{color:var(--err);border-color:#FECDCA}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;font-weight:600}
.card-b{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:3px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:1px}
.kpi.plan .v{color:var(--brand)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}
h1{font-size:20px;margin:0 0 14px}
h3{font-size:14px;margin:22px 0 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}.right{text-align:right}
.nores{padding:34px;text-align:center;color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- tables ---------- */
.tw{overflow-x:auto}
.card>.tw{overflow:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#FBFAF8;position:sticky;top:0;z-index:6;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover td{background:#F7F6F3}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:var(--brand);cursor:pointer;text-decoration:none;background:none;border:0;padding:0;font:inherit}
.link:hover{text-decoration:underline}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.plan{background:var(--plan-l);color:var(--plan)}
.tag.fakt{background:var(--ok-l);color:var(--ok)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.err{background:var(--err-l);color:var(--err)}
.tag.n{background:#EEEDE8;color:var(--muted)}
.tag.prod{background:var(--brand-l);color:var(--brand);border:1px solid #DEDCD6}
.chip{display:inline-block;padding:1px 7px;border-radius:4px;background:#EEEDE8;color:var(--muted);font-size:11.5px;margin:1px 3px 1px 0}

/* ---------- forms ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:#344054}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.fld .hint{font-size:11.5px;color:var(--muted)}
input[type=search],input[type=text].f,select.f{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff;min-width:120px}
input[type=search]{min-width:230px}

/* ---------- modal / banners ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.25);width:100%;max-width:860px}
.modal.narrow{max-width:520px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h2{margin:0;font-size:16px;flex:1}
.modal-b{padding:20px;max-height:calc(100vh - 210px);overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#FBFAF8;border-radius:0 0 12px 12px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.banner{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-l);color:#93370D;border:1px solid #FEDF89}
.banner.err{background:var(--err-l);color:#912018;border:1px solid #FECDCA}
.banner.info{background:var(--brand-l);color:#2A2A28;border:1px solid #DEDCD6}
.banner.ok{background:var(--ok-l);color:#05603A;border:1px solid #A6F4C5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111111;color:#fff;padding:10px 18px;border-radius:8px;z-index:90;box-shadow:0 8px 22px rgba(0,0,0,.3);font-size:13.5px}
.printonly{display:none}
.printonly img{height:30px;width:auto}

/* ============ Academy-specifikt ============ */
/* Fortsätt-raden: en enda självklar nästa åtgärd */
.resume{background:linear-gradient(180deg,#fff,#F7F6F3);border:1px solid #DEDCD6;border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.resume .rl{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);font-weight:700}
.resume h2{margin:3px 0 2px;font-size:18px}
.resume .rs{font-size:13px;color:var(--muted)}
.resume .rgrow{flex:1;min-width:200px}

/* Kurskort */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:9px;text-align:left;cursor:pointer}
.ccard:hover{border-color:#A8A6A0;background:#F7F6F3}
.ccard h3{margin:0;font-size:15px}
.ccard .cs{font-size:13px;color:var(--muted);flex:1}
.ccard .cmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Låst kurs. Dämpad men inte avstängd — den ska locka, inte avvisa. */
.ccard.lockd{position:relative;background:linear-gradient(180deg,#F7F6F3,#fff 62px);border-color:#DEDCD6}
.ccard.lockd:hover{border-color:var(--brand);background:linear-gradient(180deg,#F2F1ED,#fff 62px)}
.ccard.lockd h3{color:#2A2A28}
.lockbadge{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:5px;
  background:var(--brand-l);color:#2A2A28;border:1px solid #DEDCD6;border-radius:20px;
  padding:3px 10px 3px 7px;font-size:11px;font-weight:700;letter-spacing:.01em}
.lockico{width:13px;height:13px;fill:currentColor;flex:0 0 auto}
.ccard.lockd .cmeta{padding-right:96px}
/* Skyltfönstret på en låst kurs */
.lockhero{display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap;
  background:var(--brand-l);border:1px solid #DEDCD6;border-radius:var(--r);padding:16px 18px;margin:2px 0 16px}
.lockhero .lh-ico{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #DEDCD6;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.lockhero .lh-ico .lockico{width:17px;height:17px;color:var(--brand)}
.lockhero .lh-t{font-weight:700;color:#111111;font-size:14.5px}
.lockhero .lh-s{font-size:13.5px;color:#2A2A28;margin-top:3px;line-height:1.5}
/* Lektionsrad utan länk, i låst läge */
.les.lesq{cursor:default;background:#FBFAF8;color:var(--muted)}
.les.lesq:hover{background:#FBFAF8}
.les.lesq .lt b{color:#475467;font-weight:600}

/* Progressstapel */
.prog{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:6px}
.prog.ok i{background:var(--ok)}

/* Modul- och lektionslista */
.mods{display:flex;flex-direction:column;gap:14px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.mod-h{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:#FBFAF8}
.mod-h h3{margin:0;font-size:14px}
.les{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:0;border-bottom:1px solid var(--line2);background:none;text-align:left}
.les:last-child{border-bottom:0}
.les:hover:not(:disabled){background:#F7F6F3}
.les:disabled{cursor:not-allowed}
.les .lt{flex:1;min-width:0}
.les .lt b{display:block;font-weight:500;font-size:13.5px}
.les .lt s{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-top:1px}
.les .lnum{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:30px;flex:0 0 auto}
/* status har form, inte bara färg */
.st{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--line);color:var(--muted);background:#fff}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.st.now{border-color:var(--brand);color:var(--brand)}
.st.lock{border-style:dashed}
.st.plan{border-style:dotted;color:#B0B7C3}

/* Lektionsvy */
.lwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:1040px){.lwrap{grid-template-columns:minmax(0,1fr) 268px}}
.crumb{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.lbody{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px 30px;max-width:780px}
.lbody h2{font-size:18px;margin:26px 0 8px}
.lbody h3{font-size:15px;margin:20px 0 6px}
.lbody p{margin:0 0 13px}
.lbody ul,.lbody ol{margin:0 0 14px;padding-left:22px}
.lbody li{margin-bottom:5px}
.lbody .term{border-bottom:1px dotted var(--brand);color:var(--brand);cursor:help;background:none;border-left:0;border-right:0;border-top:0;padding:0;font:inherit}
.lhead{border-bottom:1px solid var(--line2);padding-bottom:14px;margin-bottom:18px}
.lhead h1{margin:0 0 4px;font-size:21px}
.rail{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:12px}
.rail .card-b{padding:14px}
.railles{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.railles button{display:flex;gap:8px;align-items:center;background:none;border:0;border-radius:6px;padding:6px 8px;text-align:left;font-size:12.5px;color:var(--muted)}
.railles button:hover{background:var(--bg);color:var(--txt)}
.railles button.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.lfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}

/* Block */
.blk-callout{border-radius:var(--r);padding:12px 15px;margin:0 0 15px;font-size:13.5px;border:1px solid}
.blk-callout.info{background:var(--brand-l);color:#2A2A28;border-color:#DEDCD6}
.blk-callout.warning{background:var(--warn-l);color:#93370D;border-color:#FEDF89}
.blk-callout.ok{background:var(--ok-l);color:#05603A;border-color:#A6F4C5}
.blk-callout b.ct{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.blk-steps{counter-reset:s;list-style:none;padding:0;margin:0 0 16px}
.blk-steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;margin:0}
.blk-steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;background:var(--brand-l);color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.blk-term{border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:0 var(--r) var(--r) 0;padding:11px 15px;margin:0 0 15px;background:#FBFAF8}
.blk-term b{display:block;font-size:13.5px}
.blk-ref{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:0 0 15px;background:#fff;font-size:13px;box-shadow:var(--sh);text-decoration:none;color:var(--txt)}
.blk-ref:hover{border-color:#A8A6A0;background:#F7F6F3}
.blk-ref .ri{color:var(--brand);font-weight:700}
.blk-img{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 15px;background:var(--line2)}
.blk-img img{display:block;width:100%;height:auto}
.blk-img figcaption{font-size:12px;color:var(--muted);padding:8px 12px;background:#fff;border-top:1px solid var(--line2)}
.blk-tbl{border:1px solid var(--line);border-radius:var(--r);overflow:auto;margin:0 0 15px}
.blk-tbl th{position:static}

/* Video */
.vbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 16px;background:#fff;box-shadow:var(--sh)}
.vstage{position:relative;background:#111111;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff}
.vstage video{width:100%;height:100%;display:block;object-fit:contain;background:#111111}
/* "Avsnitt ur inspelningen 12:40–18:05" — utan den raden ser en klippt
   film ut som en trasig film. */
.vseg{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:7px 12px;
  border-top:1px solid var(--line2);background:#FBFAF8;font-size:12.5px;color:var(--muted)}
.vseg .vsl{font-weight:600;color:#475467}
.vph{text-align:center;padding:20px;color:#D0D5DD;font-size:13px;max-width:400px}
.vph b{display:block;font-size:15px;color:#fff;margin-bottom:6px}
.wmark{position:absolute;right:10px;bottom:10px;font-size:11px;color:rgba(255,255,255,.62);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:4px;pointer-events:none;letter-spacing:.2px}
.vtabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.vtabs button{background:none;border:0;padding:6px 11px;border-radius:6px 6px 0 0;color:var(--muted);font-size:12.5px;font-weight:500}
.vtabs button.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.vpane{padding:12px 14px;max-height:260px;overflow:auto}
.chap{display:flex;gap:10px;width:100%;background:none;border:0;border-radius:6px;padding:6px 8px;text-align:left;font-size:13px;align-items:center}
.chap:hover{background:var(--bg)}
.chap .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;width:42px;flex:0 0 auto}
.tr{display:flex;gap:10px;width:100%;background:none;border:0;border-radius:6px;padding:4px 8px;text-align:left;font-size:13px;line-height:1.5}
.tr:hover{background:var(--bg)}
.tr .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px;width:42px;flex:0 0 auto;padding-top:2px}

/* Uppgift */
.task{border:1px solid #DEDCD6;background:#F7F6F3;border-radius:var(--r);padding:15px 17px;margin:0 0 16px}
.task .tl{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--brand);font-weight:700;margin-bottom:5px}
.task p{margin:0 0 11px}
.task .trow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* Prov */
.qwrap{max-width:720px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .qn{font-size:12.5px;color:var(--muted);white-space:nowrap}
.qstem{font-size:16px;font-weight:600;margin:0 0 16px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:#fff;font-size:14px}
.opt:hover{border-color:#A8A6A0;background:#F7F6F3}
.opt.on{border-color:var(--brand);background:var(--brand-l)}
.opt input{accent-color:var(--brand);width:16px;height:16px;margin:2px 0 0}
.opt.right{border-color:#A6F4C5;background:var(--ok-l)}
.opt.wrong{border-color:#FECDCA;background:var(--err-l)}
.ordl{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:7px}
.ordl li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;font-size:14px}
.ordl li .oi{flex:1}
.ordbtns{display:flex;gap:3px}
.res{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;background:#fff}
.res.bad{border-color:#FECDCA}
.res.good{border-color:#A6F4C5}
.res .rq{font-weight:600;margin-bottom:5px}

/* Intyg */
.cert{border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh);padding:34px 38px;max-width:720px;margin:0 auto;text-align:center}
.cert img.cl{height:34px;margin:0 auto 22px;display:block}
.cert .ck{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--brand);font-weight:700}
.cert h1{font-size:26px;margin:12px 0 6px}
.cert .cn{font-size:19px;font-weight:600;margin:22px 0 4px}
.cert .cd{color:var(--muted);font-size:13px}
.cert .cv{margin-top:26px;padding-top:18px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted)}
.cert .cv b{font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--txt)}

/* ---------- redaktörsläge ---------- */
.edbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFFAEB;border:1px solid #FEDF89;border-radius:var(--r);padding:9px 14px;margin-bottom:16px}
.edbar .el{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#93370D;font-weight:700}
.edtabs{display:flex;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.edtabs button{background:none;border:1px solid transparent;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.edtabs button:hover{background:var(--panel);color:var(--txt)}
.edtabs button.on{background:var(--brand-l);color:var(--brand);font-weight:600}
.blkcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:10px}
.blkhead{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2);background:#FBFAF8;border-radius:var(--r) var(--r) 0 0}
.blkhead .bt{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--brand);font-weight:700}
.blkbody{padding:12px}
.trow2{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2)}
.trow2:last-child{border-bottom:0}
.trow2 .tg{flex:1;min-width:0}
.trow2 .tg b{display:block;font-weight:500;font-size:13.5px}
.trow2 .tg s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted)}
.hand{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}
.issue{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.issue:last-child{border-bottom:0}
.issue .ik{font-weight:700;white-space:nowrap}
.issue.err .ik{color:var(--err)} .issue.warn .ik{color:var(--warn)}
textarea.f{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%;font-family:inherit;line-height:1.45}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.mtb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.mtb button{background:#fff;border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:12.5px;color:var(--txt)}
.mtb button:hover{border-color:#A8A6A0;background:#F7F6F3}
.mtb select{border:1px solid var(--line);border-radius:5px;padding:3px 7px;font-size:12.5px;background:#fff}
/* Märkningsnyckeln: vad du skriver till vänster, vad eleven ser till höger.
   Poängen är att paret står på samma rad — det är det som gör att man
   förstår vad tecknen i texten betyder utan att behöva memorera något. */
.mkey{margin:6px 0 0;border:1px solid var(--line);border-radius:6px;background:#FBFAF8}
.mkey>summary{cursor:pointer;padding:6px 11px;font-size:12.5px;color:var(--brand);font-weight:600;list-style:none}
.mkey>summary::-webkit-details-marker{display:none}
.mkey>summary::before{content:"▸ "}
.mkey[open]>summary::before{content:"▾ "}
.mkey .mkb{padding:2px 11px 11px}
.mkey table{width:100%;border-collapse:collapse}
.mkey td{padding:5px 8px 5px 0;font-size:13px;vertical-align:top;border-top:1px solid var(--line2)}
.mkey tr:first-child td{border-top:0}
.mkey td.k{width:44%;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#475467;white-space:pre-wrap;word-break:break-word}
.mkey td.a{width:22px;color:var(--muted);text-align:center}
.mkey .tt{color:var(--brand);border-bottom:1px dotted var(--brand);cursor:help;font-weight:600}
.mkey .mkl{margin-left:8px;font-size:12px;color:var(--muted)}
.mkey .note{font-size:12.5px;color:var(--muted);margin:9px 0 0;line-height:1.5}
.qm{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand);
    font-size:12px;font-weight:700;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.qm:hover{border-color:var(--brand);background:var(--brand-l)}
.prev{border-top:1px solid var(--line2);background:#FBFAF8;border-radius:0 0 var(--r) var(--r)}
.prev>summary{cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--brand);font-weight:600;list-style:none}
.prev>summary::-webkit-details-marker{display:none}
.prev>summary::before{content:"▸ ";}
.prev[open]>summary::before{content:"▾ ";}
.prevbody{padding:4px 16px 14px;background:#fff;border-radius:0 0 var(--r) var(--r)}
.prevbody h2{font-size:17px;margin:14px 0 6px}
.prevbody h3{font-size:15px;margin:12px 0 5px}
.prevbody p{margin:0 0 11px}
.helpsec{max-width:76ch}
.helpsec h2{font-size:17px;margin:26px 0 8px}
.helpsec h3{font-size:14.5px;margin:18px 0 5px}
.helpsec p,.helpsec li{font-size:14px}
.helpsec .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;background:#FBFAF8;font-family:ui-monospace,Menlo,monospace;font-size:12px}
/* val-kort i "lägg till"-dialogen och mallvalet */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}
.pick2{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;background:#fff;cursor:pointer}
.pick2:hover{border-color:#A8A6A0;background:#F7F6F3}
.pick2 b{font-size:13.5px;font-weight:600}
.pick2 span{font-size:12px;color:var(--muted);line-height:1.4}
.pickgroup{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;
  margin:16px 0 7px}
.pickgroup:first-child{margin-top:0}
/* lektionsanatomi och checklista */
.anat{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.anat li{display:flex;gap:11px;align-items:flex-start;font-size:13.5px}
.anat .an{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--brand-l);color:var(--brand);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.anat b{display:block;font-weight:600}
.anat s{display:block;text-decoration:none;color:var(--muted);font-size:12.5px;line-height:1.45}
.chk{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
.chk li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.chk .ci{flex:0 0 auto;width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;border:1.5px solid var(--line);color:var(--muted);background:#fff}
.chk li.ok .ci{background:var(--ok);border-color:var(--ok);color:#fff}
.chk li.no .ci{border-color:var(--warn);color:var(--warn)}
.chk s{display:block;text-decoration:none;color:var(--muted);font-size:12px;line-height:1.4}
.steps2{counter-reset:s2;list-style:none;padding:0}
.steps2 li{counter-increment:s2;position:relative;padding:0 0 12px 34px}
.steps2 li::before{content:counter(s2);position:absolute;left:0;top:-1px;width:23px;height:23px;border-radius:50%;
  background:var(--brand-l);color:var(--brand);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

@media print{
  header.top,nav,.savebox,.noprint,.rail{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card,.cert{box-shadow:none;border:0}
  th{position:static;background:#fff}
}

/* ================================================================
   KLÄTTERVERKET — utseende
   Samma komponenter som i originalet; här byts bara uttrycket.
   Svart och vitt som på klatterverket.se, Inter i rubrikerna,
   Plus Jakarta Sans i brödtexten, pillerformade knappar och
   bilder från hallarna där de gör nytta.
   ================================================================ */
body{font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14.5px}
h1,h2,h3,.ccard h3,.resume h2,.cert h1,.kpi .v,.hero-t,.logo span{font-family:Inter,"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h3{font-weight:700}
a{color:var(--txt)}

/* ---------- toppraden: svart, som på hemsidan ---------- */
header.top{background:#000;border-bottom:0;box-shadow:none}
.top-in{height:66px;gap:16px}
.logo img{height:44px}
.logo span{color:#fff;border-left:1px solid rgba(255,255,255,.28);font-weight:800;font-size:16px;letter-spacing:-.01em;padding-left:12px}
nav button{color:rgba(255,255,255,.72);border-radius:999px;padding:8px 14px}
nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button.on{background:#fff;color:#000;font-weight:700}
nav button .pill{background:var(--accent);color:#000}
.ednav{background:#fff;border-color:#fff;color:#000;border-radius:999px}
.ednav:hover{background:var(--accent);border-color:var(--accent);color:#000}
header .savetxt{color:rgba(255,255,255,.72)}
header .dot{box-shadow:0 0 0 2px rgba(255,255,255,.15)}
header .langsw{border-color:rgba(255,255,255,.3);border-radius:999px}
header .langsw button{background:transparent;color:rgba(255,255,255,.75)}
header .langsw button+button{border-left-color:rgba(255,255,255,.3)}
header .langsw button:hover{background:rgba(255,255,255,.12)}
header .langsw button.on{background:#fff;color:#000}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);box-shadow:none}
header .btn:hover{background:rgba(255,255,255,.12)}

/* ---------- knappar: piller ---------- */
.btn{border-radius:999px;padding:8px 16px;font-weight:600}
.btn.sm{padding:4px 11px}
.btn.lg{padding:12px 24px;font-size:15px}
.btn.primary{background:#000;border-color:#000;color:#fff}
.btn.primary:hover{background:#2b2b2b;border-color:#2b2b2b}
.btn.danger{color:var(--err)}
.tag{border-radius:999px}
.tag.prod{background:#fff;color:#000;border:1px solid #000}
.kpi .v{font-weight:800;letter-spacing:-.03em}
.card,.kpi,.mod,.lbody,.ccard,.cert,.vbox{border-radius:14px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- hero på startsidan ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;background:#111 center/cover no-repeat;
  min-height:250px;display:flex;align-items:flex-end;margin-bottom:18px;color:#fff}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.78) 100%)}
.hero-in{position:relative;z-index:1;padding:26px 30px 28px;max-width:780px}
.hero-k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero-t{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:6px 0 8px}
.hero-s{font-size:15px;opacity:.9;max-width:60ch}
.resume{background:#fff;border:1px solid var(--line);border-radius:14px}
.resume .rl{color:#000;letter-spacing:.1em}
.resume h2{font-weight:800;letter-spacing:-.02em;font-size:20px}

/* ---------- kurskort med bild ---------- */
.ccard{overflow:hidden;position:relative}
.ccard:hover{border-color:#000;background:#fff;transform:translateY(-1px)}
.ccard{transition:transform .12s ease,border-color .12s ease}
.ccover{margin:-16px -16px 6px;height:150px;background:#111;overflow:hidden}
.ccover img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.95)}
.ccard h3{font-size:17px;font-weight:800;letter-spacing:-.015em}
.ccard.lockd{background:#fff}
.lockbadge{z-index:2}
.chero{height:190px;border-radius:16px;background:#111 center/cover no-repeat;margin:2px 0 18px;position:relative;overflow:hidden}
.chero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.35))}

/* ---------- lektion och video ---------- */
.lbody{padding:26px 32px}
.lhead h1{font-size:26px}
.blk-steps li::before,.steps2 li::before,.anat .an{background:#000;color:#fff}
.prog{height:7px;background:#E7E5DF}
.prog i{background:#000}
.prog.ok i{background:var(--ok)}
.st.now{border-color:#000;color:#000}
.vstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vext{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--line2);background:#FBFAF8;font-size:12.5px;color:var(--muted)}
.vext .spacer{flex:1}
.blk-img{border-radius:12px}
.blk-callout{border-radius:12px}
.blk-callout.info{background:#F1F0EC;color:#222;border-color:#DEDCD6}
.task{border:1px solid #000;background:#fff;border-radius:12px}
.task .tl{color:#000}
.res .why{margin-top:7px;font-size:13px;color:#344054}

/* ---------- intyget ---------- */
.cert{border:2px solid #000}
.cert img.cl{height:70px}
.cert .ck{color:#000;letter-spacing:.2em}
.cert h1{font-size:30px}

@media(max-width:640px){
  .top-in{gap:8px;padding:0 10px}
  header .savetxt,header .dot{display:none}
  nav button{padding:7px 10px}
  .logo img{height:38px}
  .logo span{display:none}
  .hero{min-height:200px}
  .hero-in{padding:20px}
  .lbody{padding:18px}
  main{padding:14px}
}

/* ---------- dialoger: knappen ska aldrig hamna utanför rutan ----------
   Registreringen har sin knapp inne i dialogens innehåll (ingen sidfot).
   På en låg skärm — eller med skalning 125–150 % i Windows — blev innehållet
   högre än det tillåtna och knappen klipptes av mot dialogens kant.
   Mindre luft runt dialogen, mer höjd åt innehållet, och luft i botten. */
.ovl{padding:20px 14px}
.modal-b{max-height:calc(100vh - 150px);padding-bottom:24px}
.modal>.modal-b:last-child{max-height:calc(100vh - 110px);border-radius:0 0 12px 12px}
.modal{border-radius:14px}

/* Tipset under övningens knapp: luft ovanför, så att det inte klistrar mot knappen. */
.task .hint{margin-top:12px;line-height:1.55}
.task .trow{margin-bottom:2px}

/* Kurssidans bild visas hel — även en kvadratisk bild med text, som
   HLR-bilden — centrerad på en suddig version av sig själv. */
.chero{height:280px;background-size:0 0 !important;background-color:#111}
.chero::before{content:"";position:absolute;inset:-30px;background-image:inherit;background-size:cover;
  background-position:center;filter:blur(22px) brightness(.5)}
.chero::after{content:"";position:absolute;inset:0;background-image:inherit;background-size:contain;
  background-repeat:no-repeat;background-position:center}
@media(max-width:640px){.chero{height:200px}}

</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><img id="logo" alt="Klätterverket"><span>Academy</span></div>
    <nav id="nav"></nav>
    <div class="savebox">
      <span class="dot" id="dot"></span>
      <span class="savetxt"><span id="savetxt">Sparat</span><span class="fileinfo" id="fileinfo"></span></span>
      <div class="langsw" id="langsw"></div>
      <button class="btn sm" id="btnLogout" type="button" style="display:none">Logga ut</button>
      <button class="btn sm" id="btnMenu">Meny ▾</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div id="modal"></div>
<!-- Innehållspaketet: gör att appen fungerar direkt från disk / Google Drive. Saknas filen händer inget. -->
<script src="data/kv-academy-data.js"></script>
<script>
/* ============================================================
   Klätterverket Academy — lokal enfilsapplikation
   (byggd på Klätterverket Academy; samma arkitektur och funktion, eget utseende)
   Innehåll: data/kv-academy-innehall.json  (aldrig inbäddat här)
   Facit:    data/kv-academy-facit.json     (flyttas till servern i skarp drift)
   Paket:    data/kv-academy-data.js        (samma två filer i en form som får
                                             läsas direkt från disk / Google Drive)
   Framsteg: localStorage + export/import JSON

   Arkitektur, tre lager som aldrig blandas:
     1  Content  — kurser, lektioner, block. Versionerat, utan HTML.
     2  Runtime  — blockregister, progressionsmotor, quizmotor. Ren funktion.

/* Tidsstämpel. En timslång inspelning ska inte visa "72:14" — då blir
   h:mm:ss, annars m:ss. Används av videoblocket och av redaktörens
   kapitel- och transkriptfält, så formaten måste stämma överens. */
const mmss = s => {
  s = Math.max(0, Math.floor(s||0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sek = s%60;
  return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(sek).padStart(2,'0')
           : m + ':' + String(sek).padStart(2,'0');
};
const today = () => new Date().toISOString().slice(0,10);

/* Elementbyggaren är också den plats där gränssnittet byter språk.

   All text i appen går genom h() — som {text:…}, som strängbarn, eller som
   title/placeholder/aria-label. Att slå upp översättningen HÄR, i stället
   för i tvåhundrafemtio anropställen, betyder att ingen kan glömma det, att
   svenskt läge är exakt oförändrat (t() lämnar tillbaka det den fick), och
   att redaktörsläget inte påverkas alls. Texter som byggs av flera bitar
   ("3 av 7") går inte att slå upp som helhet — de är därför skrivna med
   t('%1 av %2', …) på plats i vyerna. */
const TR_ATTR = ['title', 'placeholder', 'aria-label', 'alt'];
function h(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v==null||v===false) continue;
    if(k === 'text') n.textContent = typeof v === 'string' ? t(v) : v;
    else if(k === 'cls') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, TR_ATTR.includes(k) && typeof v === 'string' ? t(v) : v);
  }
  for(const kid of kids.flat())
    if(kid!=null) n.append(typeof kid === 'string' ? t(kid) : kid);
  return n;
}
/* Native append() gör om null till texten "null" — den här gör inte det. */
function add(node, ...kids){
  for(const k of kids.flat()) if(k!=null && k!==false) node.append(k);
  return node;
}
function toast(msg){
  const el = h('div',{cls:'toast',text:msg});
  document.body.append(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ---------- lager 3: händelseloggen ---------- */
function loadProgress(){
  try{ const s = localStorage.getItem(LS); if(s) P = JSON.parse(s); }catch(e){}
  if(!P || typeof P !== 'object') P = { user:null, events:[] };
  if(!Array.isArray(P.events)) P.events = [];
  if(!P.people || typeof P.people !== 'object') P.people = {};
  if(!P.view || typeof P.view !== 'object') P.view = {};
  registerPerson(P.user);
}
/* Personregister: userId → namn och organisation. I skarp drift kommer det
   från eSource; här fylls det av inloggad användare, av importerade
   exportfiler och av exempeldata. Behövs för att rapporten ska kunna visa
   namn och inte bara adresser. */
function registerPerson(u){
  if(!u || !u.email) return;
  P.people = P.people || {};
  P.people[u.email] = { name: u.name || u.email, tenantId: u.tenantId || null,
                        tenantName: u.tenantName || null, demo: !!u.demo };
}
/* Andras framsteg, hämtade till rapporten, sparas aldrig i webbläsaren. */
function persistable(){
  const harRemote = P.events.some(e => e.remote) || Object.values(P.people||{}).some(p => p.remote);
  if(!harRemote) return P;
  const people = {};
  for(const k of Object.keys(P.people||{})) if(!P.people[k].remote) people[k] = P.people[k];
  return Object.assign({}, P, {events: P.events.filter(e => !e.remote), people});
}
function saveProgress(){
  try{ localStorage.setItem(LS, JSON.stringify(persistable())); dirty = false; }
  catch(e){ dirty = true; }
  setSaveState();
}
/* Append-only. Ingen händelse skrivs någonsin om eller raderas. */
function logEvent(verb, objType, objId, ctx, result){
  P.events.push({
    id: uid('evt'),
    ts: new Date().toISOString(),
    actor: { userId: P.user ? P.user.email : 'anon',
             tenantId: P.user ? (P.user.tenantId || null) : null },
    verb: verb,
    object: { type: objType, id: objId },
    context: ctx || {},
    result: result || {}
  });
  saveProgress();
  syncSoon();
}
/* Uppslagen är scopade till EN användare. Utan angiven användare gäller
   den inloggade — annars skulle elevens egna vyer räkna med kollegornas
   händelser så fort loggen innehåller fler än en person. */
const me = () => (P.user ? P.user.email : 'anon');
const eventsFor = (type, id, uid) => {
  const u = uid || me();
  return P.events.filter(e => e.object.type===type && e.object.id===id && e.actor.userId===u);
};
const hasEvent = (type, id, verb, uid) => {
  const u = uid || me();
  return P.events.some(e => e.object.type===type && e.object.id===id && e.verb===verb && e.actor.userId===u);
};

/* ============================================================
   SPRÅK

   Två språk, svenska som källa. Gränssnittet går genom t(), innehållet
   genom tr(), och båda slår upp på DEN SVENSKA TEXTEN som nyckel.

   Varför källtexten och inte ett id: en nyckellista måste hållas i takt
   med innehållet, och den glider isär — någon flyttar ett block, döper om
   en lektion, och nyckeln pekar på fel sträng utan att något syns. Med
   källtexten som nyckel följer översättningen texten av sig själv.
   Skrivs den svenska meningen om faller just den tillbaka på svenska,
   vilket syns direkt, i stället för att visa en engelsk mening som inte
   längre stämmer. Priset är att samma svenska text alltid får samma
   engelska — här en fördel, eftersom det håller terminologin enhetlig.

   Gränssnittets ordlista ligger i koden (UI). Innehållets ligger i
   innehållsfilen under "translations", eftersom den tillhör redaktören
   och byts ut med språkfilerna.

   Redaktörsläget är alltid svenskt: innehåll redigeras i sitt källspråk.
   ============================================================ */
const LOCALES = [{id:'sv', name:'Svenska', kort:'SV'},
                 {id:'en', name:'English',  kort:'EN'}];
