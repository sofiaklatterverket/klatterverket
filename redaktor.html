/* Vad en lektion brukar innehålla, och varför. Fälls ihop och minns valet. */
function lessonAnatomy(){
  let hide = false;
  try{ hide = localStorage.getItem(LS + '-anat') === 'off'; }catch(e){}
  const card = h('div',{cls:'card',style:'margin-top:18px'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  b.append(h('div',{cls:'row'},
    h('h3',{style:'margin:0',text:'Så byggs en lektion'}),
    h('div',{cls:'spacer'}),
    h('button',{cls:'btn sm ghost',type:'button',text: hide ? 'Visa' : 'Dölj',
      onclick:()=>{ try{ localStorage.setItem(LS + '-anat', hide?'on':'off'); }catch(e){} render(); }})));
  if(hide) return card;
  const step = (n, t, why) => h('li',null,
    h('span',{cls:'an',text:String(n)}),
    h('span',null, h('b',{text:t}), h('s',{text:why})));
  b.append(h('ul',{cls:'anat',style:'margin-top:12px'},
    step(1,'Inledning — två eller tre meningar',
      'Varför momentet finns och när man gör det. Eleven ska förstå sammanhanget innan detaljerna. Använd Brödtext.'),
    step(2,'Filmen',
      'Visa momentet i stället för att beskriva det — en kort film säger mer om HLR än en sida text.'),
    step(3,'Stegen eller reglerna',
      'Det som är svårt att komma ihåg efter filmen: ordningen, undantagen, siffrorna. Använd Numrerade steg eller Punktlista.'),
    step(4,'Fallgropen',
      'En Ruta med det som är lätt att göra fel, särskilt sådant som inte går att ångra. Högst en per lektion, annars slutar den märkas.'),
    step(5,'Övningen',
      'Något medarbetaren gör på riktigt i hallen. Det är här kunskapen fastnar — och det enda ni kan mäta som betyder något.'),
    step(6,'Länken till källan',
      'Detaljerna hör hemma i källan, inte i lektionen. Lektionen ska gå att göra på fem minuter.')));
  b.append(h('p',{cls:'hint',style:'margin-top:12px',
    text:'Alla sex behövs inte alltid. Men om en lektion saknar både film och övning är den oftast bara text som lika gärna kunde ha stått i en pärm.'}));
  return card;
}

/* Levande checklista — inte blockerande, bara ett mål att sikta på. */
function lessonChecklist(l){
  const blocks = l.blocks || [];
  const has = t => blocks.some(b => b.type === t);
  const textLen = blocks.filter(b => b.type==='richtext')
    .reduce((n,b) => n + spansToText(b.spans).trim().length, 0);
  const emptyText = blocks.some(b =>
    (b.type==='richtext' || b.type==='callout') && !spansToText(b.spans).trim());
  const emptyList = blocks.some(b =>
    (b.type==='list' || b.type==='steps') && !(b.items||[]).length);

  /* Kryssen tittar på innehållet, inte på att delen råkar finnas. */
  const realVideo = blocks.some(b => b.type==='video' &&
    (b.src || (b.transcript||[]).length || (b.chapters||[]).length));
  const realTask  = blocks.some(b => b.type==='task' &&
    String(Array.isArray(b.instruction)?spansToText(b.instruction):(b.instruction||'')).trim());
  const realRef   = blocks.some(b => b.type==='reference' && (b.kbArticleId || b.url));

  const items = [
    [textLen > 40, 'Har en inledning',
     'Två eller tre meningar om varför momentet finns.'],
    [realVideo || textLen > 400, 'Visar momentet',
     'En film med kapitel eller transkript, eller tillräckligt med text för att klara sig utan.'],
    [realTask, 'Har en övning',
     'Något medarbetaren gör i hallen, med ifylld instruktion. Starkt rekommenderat.'],
    [(l.estimatedMinutes||0) > 0 && (l.estimatedMinutes||0) <= 8, 'Håller sig kort',
     'Sikta på högst åtta minuter. Dela annars lektionen i två.'],
    [realRef, 'Länkar till källan',
     'Frivilligt, men bra när detaljerna finns någon annanstans — och för att visa var fakta kommer ifrån.'],
    [!emptyText && !emptyList, 'Inga tomma rutor',
     'Tomma text- eller listrutor blir tomrum för eleven. Fyll i eller ta bort dem.']
  ];
  const done = items.filter(x => x[0]).length;
  const card = h('div',{cls:'card',style:'margin-top:16px'},h('div',{cls:'card-b'}));
  card.firstChild.append(
    h('div',{cls:'row',style:'margin-bottom:10px'},
      h('h3',{style:'margin:0',text:'Är lektionen klar?'}),
      h('div',{cls:'spacer'}),
      h('span',{cls:'small muted',text: done + ' av ' + items.length})),
    h('ul',{cls:'chk'}, items.map(([ok, t, why]) =>
      h('li',{cls: ok?'ok':'no'},
        h('span',{cls:'ci',text: ok?'✓':'!'}),
        h('span',null, h('b',{text:t}), ok ? null : h('s',{text:why}))))));
  return card;
}

function blockEditor(l, b, i){
  const card = h('div',{cls:'blkcard'});
  const label = (BLOCK_TYPES.find(x=>x[0]===b.type)||[b.type,b.type])[1];
  add(card, h('div',{cls:'blkhead'},
    h('span',{cls:'bt',text:label}),
    helpBtn(b.type),
    h('div',{cls:'spacer'}),
    iconBtn('↑','Flytta delen uppåt i lektionen',()=>{ if(moveIn(l.blocks,i,-1)) render(); }),
    iconBtn('↓','Flytta delen nedåt i lektionen',()=>{ if(moveIn(l.blocks,i,1)) render(); }),
    iconBtn('Kopiera','Gör en kopia av den här delen',()=>{
      l.blocks.splice(i+1,0,JSON.parse(JSON.stringify(b))); touchContent(); render(); }),
    iconBtn('Ta bort','Ta bort den här delen',()=>{
      if(!confirm('Ta bort den här innehållsdelen?')) return;
      l.blocks.splice(i,1); touchContent(); render(); },'danger')));

  const body = h('div',{cls:'blkbody'});
  const g = h('div',{cls:'fgrid'});

  if(b.type === 'heading'){
    add(g, ph(fText('Rubriktext', b.text, v=>{ b.text=v; }, null, true),
        'T.ex. Så använder du hjärtstartaren'),
      fSel('Storlek', String(b.level||2),
        [{v:'2',t:'Vanlig rubrik'},{v:'3',t:'Underrubrik'}], v=>{ b.level=Number(v); }));
  }
  else if(b.type === 'richtext'){
    add(g, ph(fRich('Text', spansToText(b.spans), v=>{ b.spans = textToSpans(v); }, 4),
      'Två eller tre meningar. Vad är det här momentet till för, och när gör man det?'));
  }
  else if(b.type === 'list' || b.type === 'steps'){
    add(g, ph(fRich(b.type==='steps' ? 'Ett steg per rad' : 'En punkt per rad',
      (b.items||[]).map(x=>Array.isArray(x)?spansToText(x):x).join('\n'),
      v=>{ b.items = v.split('\n').filter(x=>x.trim()!=='').map(textToSpans); }, 5,
      b.type==='steps' ? 'Siffrorna sätts automatiskt — skriv dem inte själv.' : null),
      b.type==='steps'
        ? 'Kontrollera att platsen är säker\nRing 112 och slå på högtalaren\nStarta HLR\nSkicka någon efter hjärtstartaren'
        : 'Skriv en punkt per rad'));
    if(b.type === 'list') add(g, fChk('Numrera punkterna', !!b.ordered, v=>{ b.ordered=v; }));
  }
  else if(b.type === 'callout'){
    add(g, fSel('Vilken sorts ruta', b.intent||'info',
        [{v:'info',t:'Information — ett tips'},
         {v:'warning',t:'Varning — något som är lätt att göra fel'},
         {v:'ok',t:'Bra att veta — sammanhang'}], v=>{ b.intent=v; }),
      ph(fText('Rubrik i rutan (kan lämnas tom)', b.title, v=>{ b.title=v; }),
        'T.ex. Går inte att ångra'),
      ph(fRich('Text', spansToText(b.spans), v=>{ b.spans = textToSpans(v); }, 3),
        'Vad är det som är lätt att göra fel här, och vad händer om man gör det?'));
  }
  else if(b.type === 'keyTerm'){
    /* Rutan kan peka på ordlistan i stället för att bära egen text. Säg det,
       annars ser fälten tomma ut fast eleven ser en ifylld ruta. */
    if(b.termId) add(g, h('div',{cls:'fld full'},
      h('div',{cls:'banner info',style:'margin:0'},
        h('span',null, h('b',{text:'Hämtas ur ordlistan: ' + ((C.terms||{})[b.termId] ? C.terms[b.termId].term : b.termId) + '. '}),
          h('span',{text:'Ändra förklaringen under fliken Ordlista — den gäller då överallt. Skriver du i fälten nedan används din text i just den här rutan i stället.'})))));
    add(g, ph(fText('Ordet som förklaras', b.term, v=>{ b.term=v; }), 'T.ex. Återsamlingsplats'),
      ph(fArea('Förklaring', Array.isArray(b.definition)?spansToText(b.definition):b.definition,
        v=>{ b.definition=v; }, 2), 'En mening som förklarar ordet för någon som aldrig hört det.'));
  }
  else if(b.type === 'video'){
    add(g, ph(fText('Filmens id', b.assetId, v=>{ b.assetId=v; },
        'Används för att räkna vem som sett filmen. Skriv ett kort namn utan mellanslag, t.ex. vid.hlr-vuxen.'),
        'vid.hlr-vuxen'),
      ph(fText('Filmens rubrik', b.title, v=>{ b.title=v; }), 'Vuxen-HLR — så gör du'),
      fText('Länk till filmen', b.src, v=>{ b.src=v||undefined; },
        'En videofil (.mp4), eller en länk till YouTube eller Vimeo — klistra in den som den ser ut i webbläsaren. Lämna tom tills filmen har en adress. Flera lektioner får gärna peka på samma film — ange då avsnittet nedan.', true),
      fText('Länk till undertextfil (.vtt)', b.captionsSrc, v=>{ b.captionsSrc=v||undefined; }, null, true),
      ph(fText('Avsnittet börjar', secToStampOrEmpty(b.startAt), v=>{
          const t = String(v).trim(); b.startAt = t ? stampToSec(t) : undefined; },
          'Skriv tiden i inspelningen, t.ex. 12:40 eller 1:04:37. Lämna tom om lektionen visar hela filen.'),
        '12:40'),
      ph(fText('Avsnittet slutar', secToStampOrEmpty(b.endAt), v=>{
          const t = String(v).trim(); b.endAt = t ? stampToSec(t) : undefined; },
          'Spelaren stannar där, och "sedd" räknas på avsnittets längd — inte på hela filmens.'),
        '18:05'),
      ph(fArea('Kapitel — skriv tid och rubrik, en per rad', timedToLines(b.chapters,'label'),
        v=>{ b.chapters = linesToTimed(v,'label'); }, 4, 'Ett kapitel per moment i filmen.'),
        '0:00 Kontrollera medvetandet\n0:25 Larma 112\n0:50 Kompressionerna'),
      ph(fArea('Transkript — skriv tid och text, en per rad', timedToLines(b.transcript,'text'),
        v=>{ b.transcript = linesToTimed(v,'text'); }, 6,
        'Transkriptet är textalternativet för den som inte kan se filmen — det är ett lagkrav. Det gör också innehållet sökbart.'),
        '0:00 Personen svarar inte när du ropar och skakar.\n0:08 Ring 112 och slå på högtalaren.'));
  }
  else if(b.type === 'task'){
    add(g, ph(fText('Övningens id', b.id, v=>{ b.id=v; },
        'Ett kort unikt namn. Kvitteringen sparas mot det.'), 'task.hitta-hjartstartaren'),
      ph(fArea('Vad eleven ska göra', Array.isArray(b.instruction)?spansToText(b.instruction):b.instruction,
        v=>{ b.instruction=v; }, 2, 'Skriv som en uppmaning, och håll den till ett moment.'),
        'Gå till hjärtstartaren i din hall och kontrollera att statuslampan visar OK.'),
      ph(fText('Länk för knappen (valfritt)', b.deepLink, v=>{ b.deepLink=v; },
        'Lämna tom för övningar som görs i hallen — då visas bara kvitteringen. En del av en adress läggs på grundadressen under Inställningar.', true), ''),
      fText('Extra tips (kan lämnas tomt)', b.hint, v=>{ b.hint=v||undefined; }, null, true));
  }
  else if(b.type === 'image'){
    add(g, fText('Länk till bilden', b.src, v=>{ b.src=v; }, null, true),
      ph(fText('Beskrivning av bilden', b.alt, v=>{ b.alt=v; },
        'Läses upp för den som inte kan se bilden. Beskriv vad den visar, inte att det är en bild.', true),
        'Hjärtstartaren i sitt skåp vid receptionen'),
      fText('Bildtext under bilden', b.caption, v=>{ b.caption=v; }, null, true));
  }
  else if(b.type === 'table'){
    add(g, ph(fArea('Kolumnrubriker — skilj dem med semikolon', (b.head||[]).join(';'),
        v=>{ b.head = v.split(';').map(x=>x.trim()); }, 1), 'Steg;Vad du gör;När'),
      ph(fArea('Innehåll — en tabellrad per rad, kolumner med semikolon',
        (b.rows||[]).map(r=>r.map(c=>Array.isArray(c)?spansToText(c):c).join(';')).join('\n'),
        v=>{ b.rows = v.split('\n').filter(x=>x.trim()!=='').map(r=>r.split(';').map(c=>c.trim())); }, 5),
        'Pulver;Alla brandklasser;5–7 m\nKolsyra;El, men kort räckvidd;1–3 m'));
  }
  else if(b.type === 'reference'){
    add(g, ph(fText('Text på knappen', b.label, v=>{ b.label=v; }, null, true),
        'Läs mer: HLR-rådet'),
      fText('Adress', b.url, v=>{ b.url=v||undefined; }, 'Hela adressen, med https://.', true));
  }
  else if(b.type === 'quizRef'){
    add(g, ph(fArea('Text ovanför knappen', Array.isArray(b.text)?spansToText(b.text):b.text,
      v=>{ b.text=v; }, 2), 'Nu är du klar med kursen. Provet tar cirka tio minuter.'));
  }
  else {
    add(g, fArea('Rådata (JSON)', JSON.stringify(b,null,1), v=>{
      try{ Object.assign(b, JSON.parse(v)); }catch(e){} }, 6, null, true));
  }
  body.append(g);
  card.append(body);
  card.append(blockPreview(b, l.id));
  return card;
}

function edQuiz(){
  const app = edShell('edQuiz');
  const qs = Object.values(C.quizzes||{});
  const q  = route.quizId ? quizDef(route.quizId) : null;

  if(!q){
    app.append(h('h1',{text:'Prov'}));
    const card = h('div',{cls:'card'});
    for(const x of qs){
      const usedBy = (C.courses||[]).filter(c=>c.quizId===x.id).map(c=>c.title).join(', ');
      card.append(h('div',{cls:'trow2'},
        h('span',{cls:'tg'}, h('b',{text:x.title||x.id}),
          h('s',{text:[(x.items||[]).length+' frågor',
            'drar '+((x.draw&&x.draw.count)||(x.items||[]).length),
            'godkänt '+Math.round((x.passScore||0.8)*100)+'%',
            usedBy?('används i '+usedBy):'används inte'].join(' · ')})),
        iconBtn('Redigera','Redigera provet',()=>go('#/red/prov/'+x.id))));
    }
    if(!qs.length) card.append(h('div',{cls:'nores',text:'Inga prov ännu.'}));
    app.append(card);
    app.append(h('div',{cls:'row',style:'margin-top:14px'},
      h('button',{cls:'btn primary',type:'button',text:'Nytt prov',onclick:()=>{
        const t = prompt('Vad ska provet heta?','Nytt prov'); if(!t) return;
        const id = uniqueId('quiz', slug(t), new Set(Object.keys(C.quizzes||{})));
        C.quizzes[id] = {id, title:t, passScore:0.8, draw:{count:5}, shuffleOptions:true,
          attempts:{max:3}, feedback:'afterSubmit', items:[]};
        touchContent(); go('#/red/prov/'+id);
      }})));
    return;
  }

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Prov',onclick:()=>go('#/red/prov')}),
    h('span',{text:'/'}), h('span',{text:q.title||q.id})));
  app.append(h('h1',{text:q.title || q.id}));

  const meta = h('div',{cls:'card',style:'margin-bottom:16px'},h('div',{cls:'card-b'}));
  q.draw = q.draw || {count:(q.items||[]).length};
  q.attempts = q.attempts || {max:3};
  const g = h('div',{cls:'fgrid'});
  add(g,
    fText('Titel', q.title, v=>{ q.title=v; }, null, true),
    fNum('Godkänt vid (%)', Math.round((q.passScore||0.8)*100), v=>{ q.passScore=(v||80)/100; }),
    fNum('Antal frågor som dras', q.draw.count, v=>{ q.draw.count=v; },
      'Dras slumpvis ur frågebanken nedan.'),
    fNum('Max antal försök', q.attempts.max, v=>{ q.attempts.max=v; }));
  meta.firstChild.append(g);
  meta.firstChild.append(h('div',{cls:'row',style:'margin-top:12px'},
    fChk('Blanda svarsalternativen', q.shuffleOptions !== false, v=>{ q.shuffleOptions=v; })));
  app.append(meta);

  KEY.keys = KEY.keys || {};
  (q.items||[]).forEach((it, i) => app.append(itemEditor(q, it, i)));
  if(!(q.items||[]).length) app.append(h('div',{cls:'card'},h('div',{cls:'nores',text:'Inga frågor ännu.'})));

  const sel = h('select',{cls:'f'});
  sel.append(h('option',{value:'',text:'Lägg till fråga…'}));
  for(const [v,t] of [['single','Ett rätt svar'],['multi','Flera rätta svar'],
                      ['trueFalse','Sant eller falskt'],['ordering','Sortera i rätt ordning'],
                      ['scenario','Fallbeskrivning med ett rätt svar']])
    sel.append(h('option',{value:v,text:t}));
  sel.addEventListener('change',()=>{
    if(!sel.value) return;
    const base = slug(q.id.replace(/^quiz\./,'')) + '-' + ((q.items||[]).length+1);
    const id = uniqueId('q', base, new Set(Object.values(C.quizzes||{}).flatMap(x=>(x.items||[]).map(y=>y.id))));
    const t = sel.value;
    const it = {id, type: t==='scenario'?'single':t, points:1, stem:[{text:'Ny fråga'}]};
    if(t === 'trueFalse') it.options = [{id:'a',text:'Sant'},{id:'b',text:'Falskt'}];
    else it.options = [{id:'a',text:'Alternativ 1'},{id:'b',text:'Alternativ 2'}];
    if(t === 'scenario') it.intro = [{text:'Kort fallbeskrivning…'}];
    q.items = q.items || []; q.items.push(it);
    KEY.keys[id] = t==='ordering' ? {order: it.options.map(o=>o.id)} : {correct:[]};
    touchContent(); render();
  });
  app.append(h('div',{cls:'row',style:'margin-top:12px'}, sel));
}

function itemEditor(q, it, i){
  KEY.keys[it.id] = KEY.keys[it.id] || (it.type==='ordering' ? {order:(it.options||[]).map(o=>o.id)} : {correct:[]});
  const key = KEY.keys[it.id];
  const card = h('div',{cls:'blkcard'});
  add(card, h('div',{cls:'blkhead'},
    h('span',{cls:'bt',text: 'Fråga ' + (i+1) + ' · ' + it.type}),
    h('div',{cls:'spacer'}),
    iconBtn('↑','Flytta upp',()=>{ if(moveIn(q.items,i,-1)) render(); }),
    iconBtn('↓','Flytta ner',()=>{ if(moveIn(q.items,i,1)) render(); }),
    iconBtn('Ta bort','Ta bort frågan',()=>{
      if(!confirm('Ta bort frågan?')) return;
      q.items.splice(i,1); delete KEY.keys[it.id]; touchContent(); render(); },'danger')));

  const body = h('div',{cls:'blkbody'});
  const g = h('div',{cls:'fgrid'});
  add(g,
    it.intro ? fArea('Fallbeskrivning', spansToText(it.intro), v=>{ it.intro=textToSpans(v); }, 2) : null,
    fRich('Frågan', spansToText(it.stem), v=>{ it.stem = textToSpans(v); }, 2),
    fNum('Poäng', it.points||1, v=>{ it.points=v||1; },
      'Väg tyngre frågor högre. Vanligast är 1.'),
    fSel('Om eleven svarar fel — läs om i', String(key.remediation||'').split('#')[0] || '',
      [{v:'',t:'Ingen lektion vald'}].concat(Object.values(C.lessons||{}).map(l=>({v:l.id,t:l.title}))),
      v=>{ if(v) key.remediation=v; else delete key.remediation; },
      'Eleven får en knapp direkt till den lektionen.'));
  body.append(g);

  body.append(h('div',{cls:'small muted',style:'margin:12px 0 6px',
    text: it.type==='ordering' ? 'Alternativ — ordningen nedan är den rätta.' : 'Alternativ — kryssa i det eller de som är rätt.'}));

  (it.options||[]).forEach((o, oi) => {
    const row = h('div',{cls:'trow2'});
    let markEl = null;
    if(it.type === 'ordering'){
      markEl = h('span',{cls:'hand',text:String(oi+1)});
    } else {
      const multi = it.type === 'multi';
      const inp = h('input',{type: multi?'checkbox':'radio', name:'key_'+it.id,
        checked: (key.correct||[]).includes(o.id) ? '' : null});
      inp.addEventListener('change',()=>{
        if(multi){
          const s = new Set(key.correct||[]);
          inp.checked ? s.add(o.id) : s.delete(o.id);
          key.correct = [...s];
        } else key.correct = [o.id];
        touchContent();
        /* Ingen omritning: radiogruppen sköter exklusiviteten själv och
           kryssrutorna visar redan rätt. Att rita om skulle bara kasta
           redaktören till sidans topp. */
      });
      markEl = inp;
    }
    const ti = h('input',{type:'text',cls:'f',value:o.text,style:'flex:1'});
    ti.addEventListener('input',()=>{ o.text=ti.value; touchContent(); });
    add(row, markEl, ti,
      it.type==='ordering'
        ? [iconBtn('↑','Flytta upp',()=>{ if(moveIn(it.options,oi,-1)){ key.order=it.options.map(x=>x.id); render(); } }),
           iconBtn('↓','Flytta ner',()=>{ if(moveIn(it.options,oi,1)){ key.order=it.options.map(x=>x.id); render(); } })]
        : null,
      iconBtn('Ta bort','Ta bort alternativet',()=>{
        it.options.splice(oi,1);
        if(key.correct) key.correct = key.correct.filter(x=>x!==o.id);
        if(key.order)   key.order = it.options.map(x=>x.id);
        touchContent(); render(); },'danger'));
    body.append(row);
  });

  body.append(h('div',{cls:'row',style:'margin-top:10px'},
    h('button',{cls:'btn sm',type:'button',text:'Nytt alternativ',onclick:()=>{
      const used = new Set((it.options||[]).map(o=>o.id));
      let c = 'a'; while(used.has(c)) c = String.fromCharCode(c.charCodeAt(0)+1);
      it.options = it.options || []; it.options.push({id:c, text:'Nytt alternativ'});
      if(it.type==='ordering') key.order = it.options.map(x=>x.id);
      touchContent(); render();
    }})));
  card.append(body);
  return card;
}

/* Ett arbetat exempel i tre steg: så här fyller du i begreppet, så här ser
   det ut i ditt fält, så här ser eleven det. Samma ord hela vägen. */
function termExplainer(){
  const ids = Object.keys(C.terms||{});
  const first = ids.find(i => (C.terms[i].term||'').length && (C.terms[i].definition||'').length) || ids[0];
  const ex = first
    ? { id:first, ord:(C.terms[first].term||first), def:(C.terms[first].definition||'Förklaringen du skriver här.') }
    : { id:'aed', ord:'hjärtstartaren',
        def:'En bärbar apparat som analyserar hjärtrytmen och vid behov ger en strömstöt.' };

  const d = h('details',{cls:'mkey',style:'width:100%;max-width:78ch;margin:14px 0 0'});
  const body = h('div',{cls:'mkb'});
  d.append(h('summary',{text:'Hur ett begrepp hamnar i en lektion — med exempel'}), body);

  const steg = (n, rubrik, ...kids) => h('li',null,
    h('span',{cls:'an',text:String(n)}),
    add(h('span'), h('b',{text:rubrik}), ...kids));

  const ol = h('ul',{cls:'anat',style:'margin:6px 0 0'});
  ol.append(
    steg(1, 'Här i ordlistan skriver du ordet och förklaringen.',
      h('s',null, h('span',{text:'Ordet: '}), h('b',{style:'display:inline',text:ex.ord}),
        h('span',{text:' · Förklaring: ' + ex.def}))),
    steg(2, 'I lektionen markerar du ordet i din text och väljer det i listan "Gör ordet klickbart".',
      h('s',{text:'Du skriver inga tecken själv — de sätts dit åt dig.'})),
    steg(3, 'I ditt fält ser det sedan ut så här:',
      h('s',null, h('code',{text:'Skicka någon efter [[' + ex.id + '|' + ex.ord + ']] direkt.'}))),
    steg(4, 'Eleven ser aldrig klamrarna — bara ett ord som går att trycka på:',
      h('s',null, h('span',{text:'Skicka någon efter '}),
        h('span',{cls:'tt',text:ex.ord}), h('span',{text:' direkt.'}))));
  body.append(ol);
  body.append(h('p',{cls:'note'},
    h('b',{text:'Det enda du behöver komma ihåg: '}),
    h('span',{text:'klamrarna är märkning, inte text. Ordet före strecket är kortnamnet som kopplar till den här listan — det ser bara du. Ordet efter strecket är det eleven läser, och det får du ändra fritt: skriv "inköpssystemet" i en mening där det passar bättre, förklaringen följer med ändå.'})));
  return d;
}

/* Licenser per kund. En kryssruta per licensierad kurs, plus valfritt
   slutdatum — abonnemang som löper ut är normalfallet, inte undantaget.
   Kurser som inte kräver licens listas inte: de är öppna för alla och en
   kryssruta för dem skulle bara vara en lögn om att den betyder något. */
function licenseEditor(cu){
  const lic = (cu.licenses = cu.licenses || []);
  /* HELA katalogen listas, inte bara de licensierade. Tidigare visades bara
     kurser med licenskrav, vilket gjorde det omöjligt att se vad som fanns
     och omöjligt att göra en kurs säljbar härifrån — man fick gissa sig
     till att svaret låg under fliken Kurser. Nu står allt här, i två
     grupper, och en öppen kurs kan göras licensierad med ett klick. */
  const kurser  = (C.courses||[]).filter(c => c.licensed && !c.internal);
  const oppna   = (C.courses||[]).filter(c => !c.licensed && !c.internal);
  const interna = (C.courses||[]).filter(c => c.internal);
  const wrap = h('div',{style:'margin-top:14px;border-top:1px solid var(--line);padding-top:13px'});
  wrap.append(h('div',{cls:'row'},
    h('div',{style:'font-weight:600;font-size:13px;color:#344054',text:'Tillgång till utbildningar'}),
    h('div',{cls:'spacer'}),
    h('span',{cls:'small muted',
      text: kurser.length + ' kräver tillgång · ' + oppna.length + ' öppna för alla'})));
  wrap.append(h('div',{cls:'hint',style:'margin:4px 0 9px',
    text:'Ikryssat = upplåst för anläggningen. Okryssat = hänglås i katalogen, med möjlighet att anmäla intresse. Öppna utbildningar syns för alla och behöver ingen kryssruta.'}));

  for(const c of kurser){
    const i = lic.findIndex(l => l.courseId === c.id);
    const har = i >= 0;
    const l = har ? lic[i] : null;
    const utgangen = har && l.until && Date.parse(l.until) < Date.now();

    const rad = h('div',{cls:'row',style:'padding:7px 0;border-top:1px solid var(--line2);gap:12px'});
    add(rad,
      h('div',{style:'flex:1;min-width:200px'},
        fChk(c.title, har, v=>{
          if(v) lic.push({courseId:c.id, from:today()});
          else   lic.splice(lic.findIndex(x=>x.courseId===c.id), 1);
          render();
        })),
      har ? h('div',{style:'width:165px'},
        fText('Gäller till (valfritt)', l.until || '', v=>{
          const t = v.trim();
          if(t) l.until = t; else delete l.until;
        }, 'ÅÅÅÅ-MM-DD. Tom = ingen tidsgräns.')) : null,
      har && utgangen ? h('span',{cls:'tag err',text:'Utgången'})
        : har && l.until ? h('span',{cls:'tag warn',text: dagarTill(l.until) + ' dagar kvar'})
        : har ? h('span',{cls:'tag fakt',text:'Upplåst'})
        : h('span',{cls:'tag n',text:'Låst'}));
    wrap.append(rad);
  }

  if(!kurser.length) wrap.append(h('div',{cls:'issue warn',style:'margin:2px 0 8px'},
    h('span',{cls:'ik',text:'Se över'}),
    h('span',{text:'Ingen utbildning kräver tillgång ännu, så alla ser allt. Det är normalläget — lås bara utbildningar som gäller vissa anläggningar.'})));

  /* Öppna kurser: de kräver ingen kryssruta, men de ska synas — annars går
     det inte att se vad som finns, och inte heller att göra något säljbart
     utan att lämna sidan. */
  if(oppna.length){
    wrap.append(h('div',{style:'margin-top:13px;font-weight:600;font-size:13px;color:#344054',
      text:'Öppna för alla — ingen tillgång krävs'}));
    for(const c of oppna){
      wrap.append(h('div',{cls:'row',style:'padding:7px 0;border-top:1px solid var(--line2);gap:10px'},
        h('span',{style:'flex:1;min-width:200px;color:#475467;font-size:13px',text:c.title}),
        h('span',{cls:'tag n',text:'Öppen'}),
        h('button',{cls:'btn sm',type:'button',text:'Kräv tillgång',
          title:'Kursen börjar kräva tillgång, och den här anläggningen får den direkt. Övriga ser den med hänglås.',
          onclick:()=>{
            if(!confirm('"' + c.title + '" börjar kräva tillgång.\n\n' + (cu.name||'Anläggningen') +
                        ' får tillgång direkt. Alla andra anläggningar ser kursen med hänglås och kan anmäla intresse.\n\nFortsätt?')) return;
            c.licensed = true;
            lic.push({courseId:c.id, from:today()});
            touchContent(); render();
          }})));
    }
  }
  if(interna.length) wrap.append(h('div',{cls:'hint',style:'margin-top:10px'},
    h('span',{text:'Visas inte här: '}),
    h('span',{text: interna.map(c=>c.title).join(', ')}),
    h('span',{text: interna.length===1 ? ' är märkt som internt och syns bara för central roll.'
                                       : ' är märkta som interna och syns bara för central roll.'})));

  /* Efterfrågan från just den här kunden — den kommersiella poängen. */
  const onskade = demandRows(cu.id).filter(r => r.tenantId === cu.id);
  if(onskade.length){
    wrap.append(h('div',{cls:'banner info',style:'margin:11px 0 0'},
      h('span',null,
        h('b',{text:'Efterfrågat på den här anläggningen: '}),
        h('span',{text: onskade.map(r => r.title + ' (' + r.n + ')').join(', ')}))));
  }
  return wrap;
}

      testRes.textContent = 'Anslutningen fungerar' + (o.events != null ? ' — ' + o.events + ' händelser och ' + o.people + ' personer i registret.' : '.');
      testRes.style.color = 'var(--ok)'; }
    catch(e){ testRes.textContent = 'Fungerar inte: ' + e.message + '. Kontrollera adressen, och att skriptet är publicerat med åtkomst "Alla".'; testRes.style.color = 'var(--err)'; }
  }});
  const reg = h('div',{cls:'fld full'});
  reg.append(h('label',{text:'Adress till framstegsregistret (Google Apps Script)'}), urlIn,
    h('div',{cls:'hint',text:'Adressen du får när skriptet i kalkylarket publiceras som webbapp. Slutar på /exec. Med en adress här sparas allas framsteg automatiskt i kalkylarket, och rapporten kan hämta dem med en rapportnyckel. Tom = framstegen ligger bara i varje webbläsare. Kom ihåg att trycka Spara.'}),
    h('div',{cls:'row',style:'margin-top:6px'}, testBtn), testRes);
  app.append(kort('Framstegsregister', reg));
  app.append(kort('Länkar',
    fText('Grundadress för övningarnas länkar', s.trainingBaseUrl, v=>{ s.trainingBaseUrl=v; },
      'Bara om övningarna ska länka till ett system, t.ex. bokningssystemet. Lämna tom — övningarna i hallen behöver ingen länk.', true),
    fText('Grundadress för källhänvisningar', s.kbArticleBase, v=>{ s.kbArticleBase=v; },
      'Används bara om en länk anges med id i stället för hel adress. Lämna tom.', true)));

  app.append(h('div',{cls:'banner warn',style:'margin-top:4px'},h('span',{
    text:'Kom ihåg: den här kontrollen körs i webbläsaren och är en demonstration av flödet. Riktig åtkomstkontroll kräver att inloggning och roller ligger på en server. En adresslista i en innehållsfil är inte ett behörighetssystem — men det räcker för att hålla ordning internt.'})));
}

/* ---------------- Kontroll ---------------- */
function edCheck(){
  const app = edShell('edCheck','Kontroll');
  const issues = validate();
  const errs = issues.filter(i=>i.k==='err'), warns = issues.filter(i=>i.k==='warn');
  app.append(h('div',{cls:'kpis'},
    kpi('Kurser', String((C.courses||[]).length), ''),
    kpi('Lektioner', String(Object.keys(C.lessons||{}).length),
      Object.values(C.lessons||{}).filter(l=>l.draft).length + ' i utkast'),
    kpi('Fel', String(errs.length), 'måste rättas', errs.length?'warn':'ok'),
    kpi('Anmärkningar', String(warns.length), 'bör ses över')));
  const card = h('div',{cls:'card'},h('div',{cls:'card-b'}));
  if(!issues.length) card.firstChild.append(h('div',{cls:'nores',
    text:'Inget att anmärka på. Innehållet hänger ihop.'}));
  for(const x of issues)
    card.firstChild.append(h('div',{cls:'issue '+x.k},
      h('span',{cls:'ik',text: x.k==='err'?'Fel':'Se över'}),
      h('span',null, h('span',{text:x.t}),
        x.fix ? h('span',{cls:'muted',text:' ' + x.fix}) : null)));
  app.append(card);
  if(issues.length) app.append(h('p',{cls:'small muted',style:'margin-top:12px',
    text:'Rött måste rättas innan innehållet sparas — annars kan eleven möta något som inte fungerar. Gult är sådant du bör se över när du hinner.'}));
}

/* ---------------- Kunder ---------------- */
function edCustomers(){
  const app = edShell('edCust','Anläggningar');
  C.customers = C.customers || [];
  app.append(h('p',{cls:'muted',style:'max-width:74ch;margin-top:-6px',
    text:'En anläggning är en av hallarna. Medarbetarna väljer sin anläggning när de registrerar sig, och rapporten grupperas per anläggning — så att platsansvarig ser hur långt de egna kommit. Har en anläggning en egen e-postdomän kopplas medarbetarna dit automatiskt.'}));

  if(!C.customers.length) app.append(h('div',{cls:'banner warn'},h('span',{
    text:'Inga anläggningar är upplagda. Så länge listan är tom kopplas ingen till någon anläggning och rapporten visar bara var och en själv.'})));

  for(let i = 0; i < C.customers.length; i++){
    const cu = C.customers[i];
    cu.contact = cu.contact || {};
    const box = h('div',{cls:'card',style:'margin-bottom:12px'},h('div',{cls:'card-b'}));
    const g = h('div',{cls:'fgrid'});

    /* Övningsmiljön är oftast kundens egen. Fältet visar med en gång vad som
       gäller när det lämnas tomt, så ingen behöver gissa. */
    const allman = ((C.settings||{}).trainingBaseUrl || '').trim();
    const tbIn = h('input',{type:'text', value: cu.trainingBaseUrl || '',
      placeholder: allman || 'ingen allmän adress är angiven'});
    const tbHint = h('div',{cls:'hint'});
    const tbVisa = () => {
      tbHint.textContent = (cu.trainingBaseUrl||'').trim()
        ? 'Anläggningens egen adress. Övningsknapparna leder hit för dem som hör till den här anläggningen.'
        : (allman
            ? 'Tomt — då gäller den allmänna adressen ' + allman + ', som står under Inställningar.'
            : 'Tomt, och ingen allmän adress finns under Inställningar. Det gör inget — övningar i hallen har ingen länk.');
    };
    tbIn.addEventListener('input', () => {
      cu.trainingBaseUrl = tbIn.value.trim() || undefined; touchContent(); tbVisa();
    });
    tbVisa();
    const tbFld = fld('Egen grundadress för övningarnas länkar (valfritt)', tbIn, null, true);
    tbFld.append(tbHint);

    add(g,
      fText('Anläggningens namn', cu.name, v=>{ cu.name=v; }, null, true),
      fArea('Egna e-postdomäner (valfritt) — en per rad', (cu.domains||[]).join('\n'),
        v=>{ cu.domains = v.split('\n').map(x=>x.trim().toLowerCase().replace(/^@/,'')).filter(Boolean); }, 4,
        'Bara om anläggningen har en egen domän. Delar hallarna klatterverket.se: lämna tomt, så väljer medarbetaren anläggning i en lista.'),
      tbFld,
      fText('Platsansvarig', cu.contact.name, v=>{ cu.contact.name=v; },
        'Den som följer upp utbildningen på anläggningen. Lägg också in adressen under Inställningar → Platsansvariga.'),
      fText('Platsansvarigs e-post', cu.contact.email, v=>{ cu.contact.email=v; }),
      fArea('Anteckning', cu.note, v=>{ cu.note=v||undefined; }, 2));
    box.firstChild.append(g);
    box.firstChild.append(licenseEditor(cu));

    const users = new Set(P.events.filter(e => e.actor && e.actor.tenantId === cu.id).map(e => e.actor.userId));
    box.firstChild.append(h('div',{cls:'row',style:'margin-top:12px'},
      h('span',{cls:'small muted',
        text: (cu.domains||[]).length + ' domän(er) · id ' + cu.id +
              (users.size ? ' · ' + users.size + ' användare i den här webbläsaren' : '')}),
      h('div',{cls:'spacer'}),
      iconBtn('Ta bort','Ta bort anläggningen',()=>{
        if(!confirm('Ta bort ' + (cu.name||'anläggningen') + '? De som redan registrerat sig behåller sin koppling.')) return;
        C.customers.splice(i,1); touchContent(); render();
      },'danger')));
    app.append(box);
  }

  app.append(h('div',{cls:'row',style:'margin-top:14px'},
    h('button',{cls:'btn primary',type:'button',text:'Ny anläggning',onclick:()=>{
      const name = prompt('Vad heter anläggningen?','Klätterverket ');
      if(!name) return;
      const id = uniqueId('ten', slug(name), new Set(C.customers.map(x=>x.id)));
      C.customers.push({id, name, domains:[], contact:{}});
      touchContent(); render();
    }})));

  app.append(h('div',{cls:'banner info',style:'margin-top:16px'},h('span',{
    text:'Anläggningarnas id (t.ex. ten.gasverket) ligger i varje medarbetares framsteg. Byt därför namn hur du vill, men ta inte bort en anläggning som används.'})));
  app.append(h('div',{cls:'banner warn',style:'margin-top:10px'},h('span',{
    text:'Om låsen: de håller ordning, de skyddar inte. Innehållet till en låst utbildning ligger i samma innehållsfil som allt annat, så den som kan läsa filen kan läsa kursen. Lägg inget känsligt i en låst kurs.'})));
}

(async function init(){
  const lg = document.getElementById('logo');

  document.getElementById('btnLogout').addEventListener('click', logout);
  document.documentElement.lang = locale;
  window.addEventListener('hashchange', render);
  /*#ED*/
  /* Varningen om osparat innehåll gäller bara redaktören — contentDirty finns
     inte i elevfilen. */
  window.addEventListener('beforeunload', e => {
    if(contentDirty){ e.preventDefault(); e.returnValue = ''; }
  });
  /*#/ED*/
  loadProgress();
  const ok = await loadContent();
  if(!ok){ pickContentScreen(); return; }
  await loadPackages();
  boot();
})();
