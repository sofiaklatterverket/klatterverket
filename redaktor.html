/* ============================== UTBILDNINGSPAKET ==============================
   Klätterverket: en färdig utbildning kan läggas upp som en egen mapp,
     utbildningar/<mappnamn>/utbildning.json   (+ ev. bilder bredvid)
   utan att någon behöver öppna redaktören. Listan över mappar ligger i
   utbildningar/index.json, som GitHub bygger automatiskt vid varje
   uppladdning (se .github/workflows/publicera.yml).

   Paketformatet är medvetet förlåtande, så att en utbildning skriven av
   ChatGPT går att lägga upp som den är: text får skrivas som vanliga
   strängar med **fet** och [[id|ord]], svarsalternativ som en lista med
   texter, och rätt svar direkt på frågan. normalizePackage() gör om det till
   exakt samma datamodell som resten av appen — innehåll i C, rätta svar i
   KEY — och samlar allt som är fel i en lista i stället för att krascha.

   Paketkurser sparas aldrig in i innehållsfilen av redaktören: mappen är
   deras hem. Därför hålls reda på vad som kom från ett paket (PKG). */
const PKG_DIR = 'utbildningar/';
const PKG = { courses:new Set(), lessons:new Set(), quizzes:new Set(), terms:new Set(),
              keys:new Set(), origin:new Map(), list:[] };
const pkgSlug = s => String(s||'').toLowerCase()
  .replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/é/g,'e')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'utbildning';
const pkgIsAbs = u => /^(https?:|data:|blob:|\/|#)/i.test(String(u||''));
const pkgHasMarkup = s => typeof s === 'string' && /\*|\[\[|`/.test(s);
const pkgRich = v => Array.isArray(v) ? v : (pkgHasMarkup(v) ? textToSpans(v) : v);

function normalizePackage(pkg, folder){
  const problems = [];
  const base = folder ? PKG_DIR + folder + '/' : '';
  const rel  = u => (!u || pkgIsAbs(u)) ? u : base + String(u).replace(/^\.\//,'');
  if(!pkg || typeof pkg !== 'object') return {problems:['Filen innehåller ingen utbildning.']};
  const c0 = pkg.course || pkg.kurs;
  if(!c0 || !c0.title) return {problems:['Fältet "course" saknas, eller saknar "title".']};

  const suffix = pkgSlug(String(c0.id || folder || c0.title).replace(/^crs\./,''));
  const cid = 'crs.' + suffix;
  const lesId = x => { const s = String(x||''); return s.startsWith('les.') ? s : 'les.' + s; };

  /* ---- lektioner ---- */
  const rawLessons = Array.isArray(pkg.lessons) ? pkg.lessons
                   : (pkg.lessons && typeof pkg.lessons === 'object') ? Object.values(pkg.lessons) : [];
  if(!rawLessons.length) problems.push('Utbildningen har inga lektioner ("lessons").');
  const lessons = {};
  const order = [];
  rawLessons.forEach((l0, i) => {
    const l = Object.assign({}, l0);
    l.id = lesId(l.id || (suffix + '-' + (i+1)));
    if(lessons[l.id]) problems.push('Lektions-id "' + l.id + '" finns två gånger.');
    if(!l.title) problems.push('Lektion ' + (i+1) + ' saknar "title".');
    l.label = l.label != null ? String(l.label) : String(i+1);
    l.estimatedMinutes = Number(l.estimatedMinutes) || 5;
    l.status = l.status || 'published';
    if(l.required === undefined) l.required = true;
    l.blocks = (l.blocks || []).map((b0, j) => {
      const b = Object.assign({}, b0);
      const var_ = 'Lektion "' + (l.title || l.id) + '", del ' + (j+1);
      switch(b.type){
        case 'richtext':
          if(!b.spans) b.spans = textToSpans(String(b.text || '')); delete b.text; break;
        case 'callout':
          if(!b.spans) b.spans = textToSpans(String(b.text || '')); delete b.text;
          if(!['info','warning','ok'].includes(b.intent)) b.intent = 'info'; break;
        case 'heading': b.level = b.level === 3 ? 3 : 2; break;
        case 'list': case 'steps':
          b.items = (b.items || []).map(pkgRich); break;
        case 'task':
          b.id = b.id || ('task.' + l.id.slice(4) + '-' + (j+1));
          b.instruction = pkgRich(b.instruction || ''); b.deepLink = b.deepLink || ''; break;
        case 'video':
          b.assetId = b.assetId || ('vid.' + l.id.slice(4) + '-' + (j+1));
          b.src = rel(b.src); b.chapters = b.chapters || []; b.transcript = b.transcript || [];
          if(!b.src) problems.push(var_ + ': videon saknar "src".'); break;
        case 'image':
          b.src = rel(b.src); if(!b.alt) problems.push(var_ + ': bilden saknar "alt" (beskrivning).'); break;
        case 'table':
          b.rows = (b.rows || []).map(r => (r || []).map(pkgRich)); b.head = b.head || []; break;
        case 'keyTerm': case 'reference': case 'quizRef': break;
        default: problems.push(var_ + ': okänd typ "' + b.type + '".');
      }
      return b;
    });
    lessons[l.id] = l;
    order.push(l.id);
  });

  /* ---- ordlista ---- */
  const terms = {};
  const rawTerms = pkg.terms || {};
  if(Array.isArray(rawTerms)) rawTerms.forEach(x => { if(x && x.id) terms[x.id] = {term:x.term, definition:x.definition, more:x.more}; });
  else for(const k of Object.keys(rawTerms)) terms[k] = Object.assign({}, rawTerms[k]);

  /* ---- prov ---- */
  let quiz = null;
  const keys = {};
  const q0 = pkg.quiz || pkg.prov;
  if(q0 && (q0.items || []).length){
    const qid = 'quiz.' + suffix;
    const letters = 'abcdefghij';
    const items = (q0.items || []).map((it0, n) => {
      const it = Object.assign({}, it0);
      it.id = it.id ? String(it.id) : (suffix + '-q' + (n+1));
      it.type = ['single','multi','ordering','trueFalse'].includes(it.type) ? it.type : 'single';
      it.points = it.points || 1;
      it.options = (it.options || []).map((o, i) => typeof o === 'string'
        ? {id: letters[i], text: o} : {id: o.id || letters[i], text: o.text});
      if(it.options.length < 2) problems.push('Fråga ' + (n+1) + ' har färre än två alternativ.');
      const stemTxt = Array.isArray(it.stem) ? spansToText(it.stem) : String(it.stem || '');
      if(!stemTxt) problems.push('Fråga ' + (n+1) + ' saknar "stem" (själva frågan).');
      it.stem = textToSpans(stemTxt);
      if(it.intro && !Array.isArray(it.intro)) it.intro = textToSpans(String(it.intro));
      const k = {};
      if(it.type === 'ordering') k.order = it.options.map(o => o.id);
      else {
        let c = it.correct; if(c == null) c = [];
        if(!Array.isArray(c)) c = [c];
        k.correct = c.map(x => typeof x === 'number' ? letters[x] : String(x).toLowerCase())
                     .filter(x => it.options.some(o => o.id === x));
        if(!k.correct.length) problems.push('Fråga ' + (n+1) + ' ("' + stemTxt.slice(0,50) + '…") saknar rätt svar ("correct").');
        if(it.type !== 'multi' && k.correct.length > 1) problems.push('Fråga ' + (n+1) + ' har flera rätta svar men typen är inte "multi".');
      }
      const rem = it.lesson || it.remediation;
      if(rem){ const r = lesId(rem); if(lessons[r]) k.remediation = r; else problems.push('Fråga ' + (n+1) + ' pekar på lektionen "' + rem + '", som inte finns.'); }
      delete it.correct; delete it.lesson; delete it.remediation;
      keys[it.id] = k;
      return it;
    });
    const draw = typeof q0.draw === 'number' ? q0.draw : (q0.draw && q0.draw.count) || Math.min(10, items.length);
    let pass = Number(q0.passScore || 0.8); if(pass > 1) pass = pass / 100;
    quiz = { id: qid, title: q0.title || ('Prov: ' + c0.title), passScore: pass,
             draw: {count: Math.min(draw, items.length)}, shuffleOptions: q0.shuffleOptions !== false,
             attempts: {max: typeof q0.attempts === 'number' ? q0.attempts : (q0.attempts && q0.attempts.max) || 3},
             feedback: 'afterSubmit', items };
  }

  /* ---- kursen ---- */
  let modules = (c0.modules || []).map((m, i) => ({
    id: m.id || ('mod.' + suffix + '-' + (i+1)), title: m.title || ('Del ' + (i+1)), gate: m.gate || 'none',
    lessons: (m.lessons || []).map(lesId) }));
  if(!modules.length) modules = [{id:'mod.' + suffix + '-1', title: c0.title, gate:'none', lessons: order}];
  for(const m of modules) for(const lid of m.lessons)
    if(!lessons[lid]) problems.push('Modulen "' + m.title + '" pekar på lektionen "' + lid + '", som inte finns.');
  const course = Object.assign({}, c0, {
    id: cid, version: c0.version || '1.0.0', status: c0.status || 'published', locale: 'sv-SE',
    audience: Array.isArray(c0.audience) && c0.audience.length ? c0.audience : ['all'],
    prerequisites: c0.prerequisites || [],
    estimatedMinutes: Number(c0.estimatedMinutes) || order.reduce((s, id) => s + (lessons[id].estimatedMinutes||5), 0),
    cover: rel(c0.cover),
    banner: rel(c0.banner),
    certificate: c0.certificate || {issue: !!quiz, validMonths: 24},
    completion: {rule:'allRequiredLessons'}, modules });
  if(quiz) course.quizId = quiz.id; else delete course.quizId;
  if(course.certificate && course.certificate.issue && !quiz) problems.push('Kursen ger intyg men har inget prov ("quiz").');

  /* ordlistan: varje klickbart ord måste finnas */
  const allTerms = Object.assign({}, (C && C.terms) || {}, terms);
  for(const l of Object.values(lessons)) for(const id of blockTerms(l))
    if(!allTerms[id]) problems.push('Lektionen "' + l.title + '" använder begreppet "' + id + '", som saknas i "terms".');

  return { course, lessons, quiz, keys, terms, problems, folder };
}

/* Lägger in ett normaliserat paket i innehållet. Krockar det med något som
   redan finns i innehållsfilen hoppas paketet över — innehållsfilen vinner,
   annars kunde en uppladdad mapp tyst skriva över en kurs någon redigerat. */
function mergePackage(n, folder){
  const rad = {folder, title: n.course ? n.course.title : folder, problems: n.problems || [], ok:false};
  PKG.list.push(rad);
  if(!n.course) return rad;
  const main = id => (C.courses||[]).some(c => c.id === id) && !PKG.courses.has(id);
  if(main(n.course.id)){ rad.problems.push('Det finns redan en kurs med id "' + n.course.id + '" i innehållsfilen. Byt "id" i paketet.'); return rad; }
  for(const lid of Object.keys(n.lessons))
    if((C.lessons||{})[lid] && !PKG.lessons.has(lid)){ rad.problems.push('Lektions-id "' + lid + '" finns redan. Byt id i paketet.'); return rad; }
  C.courses = (C.courses||[]).filter(c => c.id !== n.course.id).concat([n.course]);
  C.lessons = C.lessons || {}; C.quizzes = C.quizzes || {}; C.terms = C.terms || {};
  Object.assign(C.lessons, n.lessons);
  for(const k of Object.keys(n.lessons)) PKG.lessons.add(k);
  if(n.quiz){ C.quizzes[n.quiz.id] = n.quiz; PKG.quizzes.add(n.quiz.id); }
  for(const k of Object.keys(n.terms)) if(!C.terms[k] || PKG.terms.has(k)){ C.terms[k] = n.terms[k]; PKG.terms.add(k); }
  KEY = KEY || {keys:{}}; KEY.keys = KEY.keys || {};
  for(const k of Object.keys(n.keys)){ KEY.keys[k] = n.keys[k]; PKG.keys.add(k); }
  PKG.courses.add(n.course.id);
  PKG.origin.set(n.course.id, folder || '(testat paket)');
  rad.ok = true;
  trCache = {};
  return rad;
}

/* Hämtar listan och paketen. Finns ingen lista (appen öppnad från disk,
   eller ingen har lagt upp något) händer ingenting. */
async function loadPackages(){
  let list = [];
  try{
    const r = await fetch(PKG_DIR + 'index.json', {cache:'no-cache'});
    if(!r.ok) return;
    const o = await r.json();
    list = Array.isArray(o) ? o : (o.utbildningar || o.packages || []);
  }catch(e){ return; }
  for(const folder of list){
    try{
      const r = await fetch(PKG_DIR + encodeURIComponent(folder) + '/utbildning.json', {cache:'no-cache'});
      if(!r.ok) throw new Error('kunde inte hämtas (' + r.status + ')');
      const n = normalizePackage(await r.json(), folder);
      const rad = mergePackage(n, folder);
      if(rad.problems.length) console.warn('[Academy] utbildningar/' + folder + ':\n  ' + rad.problems.join('\n  '));
    }catch(e){
      PKG.list.push({folder, ok:false, problems:[String(e.message || e)]});
      console.warn('[Academy] utbildningar/' + folder + ':', e);
    }
  }
}
/* Det redaktören sparar: allt utom det som kom från paket. */
function contentForSave(){
  if(!PKG.courses.size) return C;
  const o = Object.assign({}, C);
  const ut = (obj, set) => { const r = {}; for(const k of Object.keys(obj||{})) if(!set.has(k)) r[k] = obj[k]; return r; };
  o.courses = (C.courses||[]).filter(c => !PKG.courses.has(c.id));
  o.lessons = ut(C.lessons, PKG.lessons);
  o.quizzes = ut(C.quizzes, PKG.quizzes);
  o.terms   = ut(C.terms,   PKG.terms);
  return o;
}
function keyForSave(){
  if(!PKG.keys.size || !KEY) return KEY;
  const r = {}; for(const k of Object.keys(KEY.keys||{})) if(!PKG.keys.has(k)) r[k] = KEY.keys[k];
  return Object.assign({}, KEY, {keys:r});
}


/* ============================== FRAMSTEGSREGISTER ==============================
   Klätterverket: framstegen sparas automatiskt i ett Google-kalkylark, via ett
   litet Apps Script (se mappen Framstegsregister). Adressen till skriptet står
   under Inställningar → Framstegsregister. Står ingen adress där fungerar allt
   som förut: framstegen ligger bara i webbläsaren.

   Det är händelseloggen som skickas — samma poster som appen redan skriver.
   Rapporten och intygen är fortfarande projektioner av loggen; skillnaden är
   bara att loggen nu också finns på ett gemensamt ställe.

     skriva   varje egen händelse skickas strax efter att den skrivits. Utan
              nät ligger den kvar (synced saknas) och skickas vid nästa
              tillfälle — när nätet kommer tillbaka, vid nästa händelse,
              eller en gång i minuten.
     läsa     vid inloggning hämtas den inloggades egna händelser, så att man
              kan fortsätta på en annan dator och intygen följer med.
     rapport  platsansvarig och utbildningsansvarig hämtar allas händelser med
              en rapportnyckel. Nyckeln avgör omfånget på servern: en nyckel
              per anläggning, och en för alla. Andras data sparas aldrig i
              webbläsaren (remote) — den hämtas på nytt varje gång. */
const syncUrl = () => ((C && C.settings && C.settings.syncUrl) || '').trim();
const SYNC = { busy:false, timer:null, last:null, error:null, reportAt:null, reportScope:null,
               reportBusy:false, autoTried:false };
const needsSync = e => !e.synced && !e.demo && !e.remote && P.user && e.actor && e.actor.userId === P.user.email;
function syncPending(){ return (syncUrl() && P.user) ? P.events.filter(needsSync).length : 0; }
function syncSoon(){
  if(!syncUrl()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncPush(), 1200);
}
/* text/plain undviker en CORS-förfrågan i förväg, som Apps Script inte svarar på. */
async function syncPost(body){
  const r = await fetch(syncUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                                    body: JSON.stringify(body), redirect:'follow'});
  const o = await r.json();
  if(!o.ok){ const e = new Error(o.error || 'okänt fel'); e.code = o.error; throw e; }
  return o;
}
async function syncGet(params){
  const u = syncUrl() + (syncUrl().includes('?') ? '&' : '?') + new URLSearchParams(params).toString();
  const r = await fetch(u, {redirect:'follow'});
  const o = await r.json();
  if(!o.ok){ const e = new Error(o.error || 'okänt fel'); e.code = o.error; throw e; }
  return o;
}
function personPayload(){
  const u = P.user;
  return u ? {email:u.email, name:u.name, tenantId:u.tenantId || '', tenantName:u.tenantName || '', since:u.since || ''} : null;
}
async function syncPush(force){
  if(!syncUrl() || !P.user || SYNC.busy) return;
  const evs = P.events.filter(needsSync).slice(0, 200);
  if(!evs.length && !force) return;
  SYNC.busy = true;
  try{
    const o = await syncPost({action:'events', person: personPayload(), events: evs});
    const ok = new Set(o.ids || evs.map(e => e.id));
    for(const e of P.events) if(ok.has(e.id)) e.synced = true;
    SYNC.error = null; SYNC.last = new Date();
    saveProgress();
    if(P.events.some(needsSync)) setTimeout(() => syncPush(), 300);
  }catch(e){ SYNC.error = String(e.message || e); }
  finally{ SYNC.busy = false; setSaveState(); }
}
function mergeEvents(list, flags){
  const seen = new Set(P.events.map(e => e.id));
  let n = 0;
  for(const e of (list || [])){
    if(!e || !e.id || seen.has(e.id)) continue;
    P.events.push(Object.assign({}, e, flags));
    seen.add(e.id); n++;
  }
  if(n) P.events.sort((a,b) => String(a.ts).localeCompare(String(b.ts)));
  return n;
}
async function syncPull(){
  if(!syncUrl() || !P.user) return;
  try{
    const o = await syncGet({action:'mine', email: P.user.email});
    const n = mergeEvents(o.events, {synced:true});
    SYNC.error = null;
    if(n){ saveProgress(); render(); } else setSaveState();
  }catch(e){ SYNC.error = String(e.message || e); setSaveState(); }
}
async function syncAfterLogin(){ await syncPull(); await syncPush(true); }
window.addEventListener('online', () => syncPush());
setInterval(() => { if(syncPending()) syncPush(); }, 60000);

/* ---- rapportnyckeln ---- */
const getReportKey = () => { try{ return localStorage.getItem(LS + '-rkey') || ''; }catch(e){ return ''; } };
const setReportKey = k => { try{ k ? localStorage.setItem(LS + '-rkey', k) : localStorage.removeItem(LS + '-rkey'); }catch(e){} };
function dropRemote(){
  P.events = P.events.filter(e => !e.remote);
  for(const id of Object.keys(P.people || {})) if(P.people[id].remote) delete P.people[id];
  SYNC.reportAt = null; SYNC.reportScope = null;
}
async function syncReport(key, quiet){
  if(!syncUrl() || SYNC.reportBusy) return;
  SYNC.reportBusy = true;
  try{
    const o = await syncGet({action:'report', key});
    dropRemote();
    mergeEvents(o.events, {remote:true, synced:true});
    for(const em of Object.keys(o.people || {})){
      if(P.user && em === P.user.email) continue;
      const p = o.people[em];
      P.people[em] = {name: p.name || em, tenantId: p.tenantId || null, tenantName: p.tenantName || null, remote:true};
    }
    SYNC.reportAt = new Date(); SYNC.reportScope = o.scope;
    setReportKey(key);
    if(!quiet) toast(t('Hämtat från registret'));
  }catch(e){
    if(e.code === 'nyckel'){ setReportKey(''); toast(t('Fel rapportnyckel')); }
    else toast(t('Kunde inte hämta från registret: %1', e.message));
  }finally{ SYNC.reportBusy = false; render(); }
}
/* Raden överst i rapporten: hämta, eller visa när det hämtades. */
function syncReportBar(){
  if(!syncUrl()) return null;
  if(!(isClira() || roleDef().scope === 'org')) return null;
  const bar = h('div',{cls:'banner info',style:'margin-bottom:12px'});
  if(SYNC.reportBusy){ bar.append(h('span',{text:t('Hämtar allas framsteg från registret…')})); return bar; }
  if(SYNC.reportAt){
    bar.append(h('span',{text: t('Visar allas framsteg från registret · hämtat %1',
      SYNC.reportAt.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})) +
      (SYNC.reportScope && SYNC.reportScope !== 'alla' ? ' · ' + (tenantName(SYNC.reportScope) || SYNC.reportScope) : '')}),
      h('div',{cls:'spacer'}),
      h('button',{cls:'btn sm',type:'button',text:t('Uppdatera'),onclick:()=>syncReport(getReportKey())}));
    return bar;
  }
  const k = getReportKey();
  if(k && !SYNC.autoTried){ SYNC.autoTried = true; setTimeout(() => syncReport(k, true), 0);
    bar.append(h('span',{text:t('Hämtar allas framsteg från registret…')})); return bar; }
  const inp = h('input',{type:'password',cls:'f',placeholder:'Rapportnyckel',style:'min-width:170px'});
  const go_ = () => { const v = inp.value.trim(); if(v) syncReport(v); };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') go_(); });
  bar.append(h('span',{text:t('Rapporten visar bara det som finns i den här webbläsaren. Ange rapportnyckeln för att hämta allas framsteg.')}),
    h('div',{cls:'spacer'}), inp, h('button',{cls:'btn sm primary',type:'button',text:t('Hämta'),onclick:go_}));
  return bar;
}


/* ============================== LADDNING ============================== */
/* Innehållet hämtas i första hand över http (så modulen fungerar när den
   ligger i eSource). Öppnas filen direkt från disk blockerar webbläsaren
   fetch — då väljer man filerna manuellt, precis som i CDM-modulen. */
async function loadContent(){
  try{
    const [a,b] = await Promise.all([fetch(CONTENT_URL), fetch(KEY_URL).catch(()=>null)]);
    if(!a.ok) throw new Error('http ' + a.status);
    C = await a.json();
    if(b && b.ok){ KEY = await b.json(); keyLoaded = !!(KEY && KEY.keys); }
    else { KEY = {keys:{}}; keyLoaded = false; }
    cacheContent();
    return true;
  }catch(e){
    /* Öppnas filen från disk blockerar webbläsaren hämtningen. Vi faller
       INTE tillbaka på den lokala kopian automatiskt — den kan vara äldre
       än filen i mappen, och sparas den sedan tillbaka skriver den över
       nyare innehåll utan att någon märker det. Användaren får välja.

       Klätterverket: innan dess provas paketet data/kv-academy-data.js.
       Det laddas med en vanlig script-tagg, vilket webbläsaren tillåter
       även från disk — det är det som gör att mappen fungerar direkt ur en
       synkad Google Drive. Paketet skrivs av redaktören vid varje Spara,
       samtidigt som JSON-filerna, så det är aldrig äldre än dem. */
    const pk = window.KV_ACADEMY_DATA;
    if(pk && pk.content && Array.isArray(pk.content.courses)){
      C = pk.content;
      KEY = (pk.key && pk.key.keys) ? pk.key : {keys:{}};
      keyLoaded = !!(pk.key && pk.key.keys);
      cacheContent();
      return true;
    }
    return false;
  }
}
function cacheContent(){
  try{ localStorage.setItem(LS + '-content',
    JSON.stringify({at:new Date().toISOString(), C, KEY})); }catch(e){}
}
function readCachedContent(){
  try{ return JSON.parse(localStorage.getItem(LS + '-content') || 'null'); }catch(e){ return null; }
}
function pickContentScreen(){
  const app = APP(); app.replaceChildren();
  const card = h('div',{cls:'card',style:'max-width:620px;margin:60px auto'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  if(LOGO_SRC) b.append(h('img',{src:LOGO_DARK,alt:'Klätterverket',style:'height:56px;display:block;margin-bottom:18px'}));
  b.append(h('h1',{text:'Öppna innehållsfilerna'}),
    h('p',{cls:'muted',text:'Innehållet kunde inte laddas automatiskt. Öppna BÅDA filerna i mappen data — markera dem tillsammans med Ctrl:'}));
  b.append(h('ul',{cls:'muted',style:'margin:0 0 4px;padding-left:20px;font-size:13.5px'},
    h('li',null,h('code',{text:'kv-academy-innehall.json'}),
      h('span',{text:' — kurser, lektioner och prov'})),
    h('li',null,h('code',{text:'kv-academy-facit.json'}),
      h('span',{text:' — de rätta svaren'}))));

  const varning = h('div');

  /* Två vägar in, och den första är den viktiga:

     showOpenFilePicker ger ett filhandtag som går att SKRIVA till. Öppnas
     filerna så kan Spara senare skriva tillbaka i samma filer utan att
     fråga var. Går det inte — Safari och Firefox saknar stödet — faller vi
     tillbaka på en vanlig filväljare, som bara kan läsa, och då blir
     sparandet en nedladdning.                                          */
  const efterInlasning = async (gotC, gotK) => {
    if(!gotC){ alert(t('Ingen innehållsfil hittades bland de valda filerna. Det är den som heter kv-academy-innehall.json.')); return; }
    keyLoaded = gotK;
    if(!KEY) KEY = {keys:{}};

    /* Saknas facitet ska ingen komma vidare utan att ha sett varför. Det
       är den här tysta halvladdningen som en gång tömde facitfilen. */
    if(!gotK){
      varning.replaceChildren(h('div',{cls:'banner err',style:'margin-top:14px'},
        h('div',null,
          h('div',{style:'font-weight:600'},'Facitfilen valdes inte'),
          h('div',{cls:'small',style:'margin-top:3px'},
            'Utbildningen fungerar, men provsvaren är okända: Kontroll-fliken visar provet som ofullständigt och du kan inte redigera rätta svar. Filen på disk ändras inte — redaktörsläget vägrar spara över ett facit det inte har läst.'))));
      varning.append(h('div',{cls:'row',style:'margin-top:10px'},
        h('button',{cls:'btn primary',type:'button',text:'Välj filerna igen',
          onclick:()=>{ varning.replaceChildren(); oppna(); }}),
        h('button',{cls:'btn',type:'button',text:'Fortsätt utan facit',
          onclick:()=>{ cacheContent(); boot(); }})));
      return;
    }
    cacheContent();
    boot();
  };

  /* Väg 1: filhandtag med skrivrättighet (Chrome, Edge). */
  async function oppnaMedHandtag(){
    let handles;
    try{
      handles = await window.showOpenFilePicker({ multiple:true,
        types:[{description:'Klätterverket Academy-filer', accept:{'application/json':['.json'],'text/javascript':['.js']}}] });
    }catch(e){ return; }                       // avbröt väljaren
    let gotC = false, gotK = false;
    for(const hh of handles){
      if(/\.js$/i.test(hh.name)){ fileH.bundle = hh; continue; }
      try{
        const o = JSON.parse(await (await hh.getFile()).text());
        if(o.courses){ C = o; fileH.content = hh; gotC = true; }
        else if(o.keys){ KEY = o; fileH.key = hh; gotK = true; }
      }catch(e){ alert(t('Kunde inte läsa %1', hh.name)); }
    }
    efterInlasning(gotC, gotK);
  }
  /* Väg 2: vanlig filväljare. Läser, men kan inte skriva tillbaka. */
  const inp = h('input',{type:'file',accept:'application/json,.json,.js',multiple:'',
                         style:'display:none'});
  inp.addEventListener('change', async () => {
    let gotC = false, gotK = false;
    for(const f of inp.files){
      if(/\.js$/i.test(f.name)) continue;
      try{
        const o = JSON.parse(await f.text());
        if(o.courses){ C = o; gotC = true; }
        else if(o.keys){ KEY = o; gotK = true; }
      }catch(e){ alert(t('Kunde inte läsa %1', f.name)); }
    }
    efterInlasning(gotC, gotK);
  });
  const kanSkriva = fsaOk();
  const oppna = () => kanSkriva ? oppnaMedHandtag() : (inp.value = '', inp.click());

  b.append(h('div',{style:'margin:16px 0'},
    h('button',{cls:'btn primary lg',type:'button',text:'Öppna innehållsfilerna',onclick:oppna}),
    inp,
    h('div',{cls:'hint',style:'margin-top:7px',
      text: kanSkriva
        ? 'Markera båda filerna i rutan som öppnas. Ändringar du gör sparas sedan tillbaka i samma filer — du behöver aldrig välja var något ska sparas.'
        : 'Den här webbläsaren kan läsa filerna men inte skriva tillbaka i dem. Ändringar laddas ned som nya filer som får ersätta de gamla. Använd Chrome eller Edge för att slippa det steget.'})),
    varning);

  /* Den lokala kopian erbjuds bara som andrahandsval, med tidsstämpel och
     varning — aldrig tyst, eftersom den kan vara äldre än filen i mappen. */
  const cached = readCachedContent();
  if(cached && cached.C){
    const nar = cached.at ? new Date(cached.at).toLocaleString('sv-SE') : 'okänd tidpunkt';
    b.append(h('div',{cls:'banner warn',style:'margin-top:4px'},
      h('span',{text:t('Det finns en lokal kopia från %1. Den kan vara äldre än filerna i mappen — sparar du över filen försvinner nyare ändringar.', nar)}),
      h('button',{cls:'btn sm',type:'button',text:'Använd kopian ändå',onclick:()=>{
        C = cached.C;
        KEY = cached.KEY || {keys:{}};
        keyLoaded = !!(cached.KEY && cached.KEY.keys && Object.keys(cached.KEY.keys).length);
        boot();
      }})));
  }
  b.append(h('p',{cls:'small muted',
    text:'Tips: ligger data/kv-academy-data.js kvar i mappen — eller läggs mappen på en webbserver — laddas innehållet automatiskt och den här rutan visas aldrig.'}));
  app.append(card);
}

/* ============================== RENDER + INIT ==============================
   Sidan ritas om även vid små ändringar. Då ska läsläget behållas — annars
   kastas man till toppen varje gång man kryssar i ett svar långt ner i ett
   prov. Bara en verklig navigering scrollar upp.                          */
let lastRenderHash = null;
function render(){
  route = parseRoute();
  const hash = location.hash || '#/';
  const samePlace = hash === lastRenderHash;
  const y = samePlace ? window.scrollY : 0;

  /* Redaktören arbetar alltid i källspråket. Raden nedan finns bara i
     redaktörsfilen; i elevfilen är svOnly alltid false, vilket är rätt. */
  svOnly = false;
  /*#ED*/ svOnly = !!editing || route.view.startsWith('ed'); /*#/ED*/

  renderNav(); setSaveState(); renderLangSwitch();
  renderView();
  lastRenderHash = hash;

  if(samePlace){ if(window.scrollY !== y) window.scrollTo({top:y}); }
  else window.scrollTo({top:0});
}
function renderView(){
  try{
    /*#ED*/
    if(route.view.startsWith('ed')){
      if(!edUnlocked){ edLockScreen(); return; }
      if(!editing){ editing = true; }
      if(route.view === 'edCourse') edCourse();
      else if(route.view === 'edLesson') edLesson();
      else if(route.view === 'edQuiz') edQuiz();
      else if(route.view === 'edTerms') edTerms();
      else if(route.view === 'edSet') edSettings();
      else if(route.view === 'edCheck') edCheck();
      else if(route.view === 'edHelp') edHelp();
      else if(route.view === 'edCust') edCustomers();
      else edCourses();
      return;
    }
    /*#/ED*/
    if(route.view === 'catalog') viewCatalog();
    else if(route.view === 'course') viewCourse();
    else if(route.view === 'lesson') viewLesson();
    else if(route.view === 'quiz') viewQuiz();
    else if(route.view === 'certs') viewCerts();
    else if(route.view === 'report') viewReport();
    else if(route.view === 'reportCourse') viewReportCourse();
    else if(route.view === 'reportCerts') viewReportCerts();
    else if(route.view === 'reportOrgs') viewReportOrgs();
    else if(route.view === 'reportDemand') viewReportDemand();
    else if(route.view === 'reportAudit') viewReportAudit();
    else viewStart();
  }catch(err){
    console.error(err);
    APP().replaceChildren(h('div',{cls:'banner err'},
      h('span',{text:t('Något gick fel i vyn: %1', err.message)})));
  }
}
async function boot(){
  if(!P.user) await askUser(false);
  render();
  syncAfterLogin();
}

<script>
/* ============================================================
   REDAKTÖRSLÄGE
   Skriver på lager 1 (innehållet) och sparar tillbaka till
   data/kv-academy-innehall.json + data/kv-academy-facit.json,
   och paketet data/kv-academy-data.js som gör att appen går att öppna
   direkt från disk / Google Drive.
   Ingen HTML skapas någonsin — editorn producerar samma typade
   block som renderaren läser.
   ============================================================ */
let editing      = false;   // redaktörsläge på/av
let contentDirty = false;
/* fileH och fsaOk ligger i part2.js — de används av filväljaren, som är
   DELAD kod. Låg de här försvann de ur elevfilen och väljaren kraschade
   med ReferenceError, vilket bara syntes när filen öppnades från disk. */

/* Lås på redaktörsläget. Lösenordet ligger som SHA-256 så att det inte
   går att läsa rakt av i filen — men allt körs i webbläsaren, så det är
   ett lås mot misstag, inte ett säkerhetsskydd. Se LÄSMIG. */
/* Lösenord: klatterverket — byt genom att lägga in SHA-256 av ett nytt här. */
const EDITOR_PASS_SHA = '126cc4359df522956325558cfdc4f66f7b708126a55eb1d63e642ef2ec89a7db';
let edUnlocked = false;
try{ edUnlocked = sessionStorage.getItem(LS + '-ed') === '1'; }catch(e){}

async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function unlockEditor(){
  modal('narrow','Redaktörsläge', (m, close) => {
    m.append(h('p',{cls:'muted',
      text:'Redaktörsläget är låst så att ingen råkar ändra i utbildningen av misstag.'}));
    const inp = h('input',{type:'password', placeholder:'Lösenord'});
    const err = h('div',{cls:'hint',style:'color:var(--err)'});
    const tryIt = async () => {
      let ok = false;
      try{ ok = (await sha256hex(inp.value)) === EDITOR_PASS_SHA; }
      catch(e){ err.textContent = 'Webbläsaren kan inte kontrollera lösenordet här.'; return; }
      if(!ok){ err.textContent = 'Fel lösenord.'; inp.select(); return; }
      edUnlocked = true;
      try{ sessionStorage.setItem(LS + '-ed','1'); }catch(e){}
      close(); editing = true; go('#/red');
    };
    inp.addEventListener('keydown', e => { if(e.key === 'Enter') tryIt(); });
    m.append(h('div',{cls:'fld full'}, h('label',{text:'Lösenord'}), inp, err));
    m.append(h('div',{cls:'row',style:'margin-top:16px'}, h('div',{cls:'spacer'}),
      h('button',{cls:'btn primary',type:'button',text:'Lås upp',onclick:tryIt})));
  }, null);
}

const MARKHINT ='Markera text och tryck på en knapp — tecknen som dyker upp i texten är bara märkning.';

/* Märkningsnyckeln.
   Bakgrund: när redaktören gör ett ord klickbart dyker [[dis|texten]] upp
   mitt i hennes text. Det ser ut som ett fel. Ingen förklaring i löptext
   löser det — men ett par där vänsterkolumnen visar exakt det hon ser i
   fältet och högerkolumnen visar exakt det eleven ser gör det. Därför är
   nyckeln ett par per rad, med riktig rendering till höger, och inte en
   uppräkning av syntax.                                                  */
function markKey(){
  const d = h('details',{cls:'mkey'});
  const body = h('div',{cls:'mkb'});
  d.append(h('summary',{text:'Vad betyder tecknen i texten?'}), body);

  const t = h('table');
  const rad = (skriv, visa) => t.append(h('tr',null,
    h('td',{cls:'k',text:skriv}),
    h('td',{cls:'a','aria-hidden':'true',text:'→'}),
    h('td',null, visa)));

  rad('**112**', h('span',null, h('b',{text:'112'}),
    h('span',{cls:'mkl',text:'fet'})));
  rad('*ungefär*', h('span',null, h('em',{text:'ungefär'}),
    h('span',{cls:'mkl',text:'kursiv'})));

  /* Begreppsraden använder ett riktigt begrepp ur ordlistan om det finns
     ett, annars ett påhittat — exemplet ska kännas som hennes egen text. */
  const ids = Object.keys(C.terms||{});
  const ex  = ids.length ? { id: ids[0], ord: (C.terms[ids[0]].term || ids[0]) }
                         : { id: 'aed',  ord: 'hjärtstartaren' };
  rad('[[' + ex.id + '|' + ex.ord + ']]',
    h('span',null, h('span',{cls:'tt',text:ex.ord}),
      h('span',{cls:'mkl',
        text:'klickbart — eleven får förklaringen ur ordlistan'})));

  body.append(t);
  body.append(h('p',{cls:'note'},
    h('b',{text:'Om begreppen: '}),
    h('span',{text:'du skriver aldrig de dubbla klamrarna själv. Markera ordet i texten, välj begreppet i listan ovanför fältet, och märkningen sätts dit åt dig. '}),
    h('span',{text:'Det som står inuti klamrarna före strecket är begreppets id i ordlistan — det ser bara du. Det eleven läser är ordet efter strecket, och det kan du ändra fritt.'})));
  body.append(h('p',{cls:'note',
    text:'Vill du ta bort en märkning: radera tecknen runt ordet, eller hela [[…]] och skriv ordet igen. Öppna "Så här blir det för eleven" längst ned i rutan om du vill se resultatet.'}));
  return d;
}

function fld(label, control, hint, full){
  return h('div',{cls:'fld' + (full?' full':'')},
    label ? h('label',{text:label}) : null,
    control,
    hint ? h('div',{cls:'hint',text:hint}) : null);
}
function fText(label, val, on, hint, full){
  const i = h('input',{type:'text', value: val==null?'':val});
  i.addEventListener('input', () => { on(i.value); touchContent(); });
  return fld(label, i, hint, full);
}
function fNum(label, val, on, hint){
  const i = h('input',{type:'number', value: val==null?'':val, min:'0'});
  i.addEventListener('input', () => { on(i.value===''?null:Number(i.value)); touchContent(); });
  return fld(label, i, hint);
}
function fArea(label, val, on, rows, hint, code){
  const t = h('textarea',{cls:'f' + (code?' code':''), rows:String(rows||3)});
  t.value = val==null ? '' : val;
  t.addEventListener('input', () => { on(t.value); touchContent(); });
  return fld(label, t, hint, true);
}
/* Textfält med formateringsknappar — redaktören ska aldrig behöva
   memorera märkspråket, bara markera text och trycka på en knapp. */
function fRich(label, val, on, rows, hint){
  const t = h('textarea',{cls:'f', rows:String(rows||3)});
  t.value = val==null ? '' : val;
  t.addEventListener('input', () => { on(t.value); touchContent(); });

  /* Kräver markerad text. Utan markering skrev knapparna in ord mitt i
     texten, vilket är svårt att upptäcka och lätt att göra av misstag. */
  const wrap = (pre, post, vad) => {
    const s = t.selectionStart, e = t.selectionEnd;
    if(e <= s){
      t.focus();
      toast('Markera först den text som ska bli ' + vad);
      return;
    }
    const sel = t.value.slice(s,e);
    t.value = t.value.slice(0,s) + pre + sel + post + t.value.slice(e);
    t.focus();
    t.setSelectionRange(s + pre.length, s + pre.length + sel.length);
    on(t.value); touchContent();
  };
  const tb = h('div',{cls:'mtb'},
    h('button',{type:'button', title:'Markera text och tryck här för fet stil',
      onclick:()=>wrap('**','**','fet')}, h('b',{text:'F'})),
    h('button',{type:'button', title:'Markera text och tryck här för kursiv stil',
      onclick:()=>wrap('*','*','kursiv')}, h('em',{text:'K'})));

  const terms = Object.keys(C.terms||{});
  if(terms.length){
    const sel = h('select',{title:'Markera ett ord i texten och välj sedan begreppet här — ordet blir klickbart för eleven'});
    sel.append(h('option',{value:'',text:'Gör ordet klickbart…'}));
    for(const id of terms) sel.append(h('option',{value:id, text:(C.terms[id].term||id)}));
    sel.addEventListener('change',()=>{
      if(!sel.value) return;
      const s = t.selectionStart, e = t.selectionEnd;
      if(e <= s){
        sel.value = ''; t.focus();
        toast('Markera först det ord i texten som ska bli klickbart');
        return;
      }
      const ord = t.value.slice(s,e);
      const id  = sel.value;
      t.value = t.value.slice(0,s) + '[[' + id + '|' + ord + ']]' + t.value.slice(e);
      on(t.value); touchContent();
      sel.value = ''; t.focus();
      /* Säg vad som hände, i ord. Annars ser det bara ut som att texten
         plötsligt fick en massa klamrar i sig. */
      toast('"' + ord + '" är nu klickbart. Klamrarna är bara märkning — eleven ser dem inte.');
    });
    tb.append(sel);
  }
  tb.append(h('span',{cls:'hint',style:'margin-left:4px',
    text:'Markera först texten, tryck sedan på en knapp.'}));

  return h('div',{cls:'fld full'},
    label ? h('label',{text:label}) : null,
    tb, t,
    hint ? h('div',{cls:'hint',text:hint}) : null,
    markKey());
}
function fSel(label, val, opts, on, hint){
  const s = h('select');
  for(const o of opts) s.append(h('option',{value:o.v, selected: o.v===val ? '' : null, text:o.t}));
  s.value = val;
  s.addEventListener('change', () => { on(s.value); touchContent(); });
  return fld(label, s, hint);
}
function fChk(label, val, on){
  const i = h('input',{type:'checkbox', checked: val?'':null});
  i.addEventListener('change', () => { on(i.checked); touchContent(); });
  return h('label',{cls:'cb',style:'display:flex;gap:7px;align-items:center;font-size:13px;color:#344054;font-weight:600'},
    i, h('span',{text:label}));
}

function ph(fieldEl, text){
  const c = fieldEl.querySelector('input,textarea');
  if(c) c.placeholder = text;
  return fieldEl;
}
function iconBtn(label, title, fn, cls){
  return h('button',{cls:'btn sm '+(cls||''), type:'button', title:title||label,
    'aria-label':title||label, text:label, onclick:fn});
}
function moveIn(arr, i, d){
  const j = i + d;
  if(j < 0 || j >= arr.length) return false;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  touchContent();
  return true;
}
function slug(s){
  return String(s||'').toLowerCase()
    .replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[éè]/g,'e')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'ny';
}
function uniqueId(prefix, base, taken){
  let id = prefix + '.' + base, n = 2;
  while(taken.has(id)){ id = prefix + '.' + base + '-' + n; n++; }
  return id;
}

/* ---- ångra och automatisk säkerhetskopia ---- */
let undoStack = [], lastSnap = 0;
function snapshotContent(force){
  const now = Date.now();
  if(!force && now - lastSnap < 2500) return;
  lastSnap = now;
  try{
    undoStack.push(JSON.stringify({C, KEY}));
    if(undoStack.length > 25) undoStack.shift();
  }catch(e){}
}
function undoContent(){
  if(!undoStack.length){ toast('Det finns inget att ångra'); return; }
  try{
    const s = JSON.parse(undoStack.pop());
    C = s.C; KEY = s.KEY;
    contentDirty = true; saveDraft(); render();
    toast('Ångrat');
  }catch(e){ toast('Kunde inte ångra'); }
}
function saveDraft(){
  try{ localStorage.setItem(LS + '-draft', JSON.stringify({at:new Date().toISOString(), C, KEY})); }catch(e){}
}
function clearDraft(){ try{ localStorage.removeItem(LS + '-draft'); }catch(e){} }
function readDraft(){
  try{ return JSON.parse(localStorage.getItem(LS + '-draft') || 'null'); }catch(e){ return null; }
}

/* ---- spara -----------------------------------------------------------
   Spara ska skriva tillbaka i SAMMA fil som öppnades. Inget "spara som",
   ingen fråga om var filen ska ligga.

   Det förutsätter att filen öppnades med showOpenFilePicker, som ger ett
   filhandtag man kan skriva till. Tidigare öppnades den med en vanlig
   <input type=file>, som bara kan läsa — därför tvingades sparandet fråga
   var filen skulle läggas, varje gång, och det var lätt att råka spara på
   fel ställe. Handtagen ligger i fileH och lever hela sessionen.        */
async function ensureWritable(h){
  if(!h || !h.queryPermission) return true;
  if(await h.queryPermission({mode:'readwrite'}) === 'granted') return true;
  return (await h.requestPermission({mode:'readwrite'})) === 'granted';
}
async function writeJson(which, obj, suggested){
  const h = fileH[which];
  if(h){
    try{
      if(!(await ensureWritable(h))){
        toast('Webbläsaren nekade skrivning till ' + suggested);
        return false;
      }
      const w = await h.createWritable();
      await w.write(JSON.stringify(obj, null, 1));
      await w.close();
      return true;
    }catch(e){
      if(e && e.name === 'AbortError') return false;
      /* Filen kan ha flyttats eller tagits bort sedan den öppnades. */
      fileH[which] = null;
      toast('Kunde inte skriva till ' + suggested + ': ' + (e && e.message || 'okänt fel'));
      return false;
    }
  }
  /* Inget handtag: filerna kom över http, eller webbläsaren saknar stödet.
     Då finns inget "samma fil" att skriva till, och nedladdning är enda
     vägen. Ingen dialog om var — filen hamnar bland nedladdningarna.   */
  download(suggested, obj);
  return true;
}
/* Paketet för Google Drive / öppning från disk. Samma innehåll och facit
   som JSON-filerna, inslaget i en script-rad. Skrivs vid varje Spara så att
   det aldrig blir äldre än JSON-filerna. Är facitet inte inläst behålls det
   facit som redan låg i paketet — annars skulle elevernas prov tappa svaren. */
function bundleText(){
  const gammalt = (window.KV_ACADEMY_DATA && window.KV_ACADEMY_DATA.key) || null;
  const nyckel = keyLoaded ? keyForSave() : gammalt;
  return '/* Klätterverket Academy — innehållspaket.\n' +
         '   Skrivs automatiskt av redaktören vid varje Spara. Redigera inte för hand.\n' +
         '   Gör att appen fungerar när mappen öppnas direkt från disk, t.ex. en synkad Google Drive-mapp. */\n' +
         'window.KV_ACADEMY_DATA = ' + JSON.stringify({savedAt:new Date().toISOString(), content:contentForSave(), key:nyckel}) + ';\n';
}
async function writeBundle(){
  const hh = fileH.bundle;
  if(hh){
    try{
      if(!(await ensureWritable(hh))){ toast('Webbläsaren nekade skrivning till kv-academy-data.js'); return false; }
      const w = await hh.createWritable(); await w.write(bundleText()); await w.close();
      return true;
    }catch(e){
      fileH.bundle = null;
      toast('Kunde inte skriva till kv-academy-data.js: ' + (e && e.message || 'okänt fel'));
      return false;
    }
  }
  const b = new Blob([bundleText()],{type:'text/javascript'});
  const a = h('a',{href:URL.createObjectURL(b), download:'kv-academy-data.js'});
  document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}
/* Öppna om filerna med skrivrättighet. Används när sessionen saknar
   handtag men webbläsaren kan ge dem. */
async function adoptFiles(){
  if(!fsaOk()) return false;
  let handles;
  try{
    handles = await window.showOpenFilePicker({ multiple:true,
      types:[{description:'Klätterverket Academy-filer', accept:{'application/json':['.json']}}] });
  }catch(e){ return false; }
  let n = 0;
  for(const h of handles){
    if(/\.js$/i.test(h.name)){ fileH.bundle = h; n++; continue; }
    try{
      const o = JSON.parse(await (await h.getFile()).text());
      if(o.courses){ fileH.content = h; n++; }
      else if(o.keys){ fileH.key = h; n++; }
    }catch(e){}
  }
  return n > 0;
}
async function saveContent(){
  /* Saknas filhandtag men webbläsaren kan ge dem — filerna kom över http,
     eller sessionen startade från den lokala kopian — så frågar vi EN gång
     vilka filer som ska uppdateras. Det är en öppna-dialog, inte "spara
     som": man pekar ut de filer som redan finns, inte var något ska läggas. */
  if(!fileH.content && fsaOk()){
    const svar = await new Promise(res => {
      modal('narrow','Vilka filer ska uppdateras?', (m, close) => {
        m.append(h('p',{cls:'muted',
          text:'Programmet vet ännu inte vilka filer det ska skriva i. Öppna mappen data och markera alla tre filerna — kv-academy-innehall.json, kv-academy-facit.json och kv-academy-data.js — med Ctrl. Sedan skrivs de direkt vid varje Spara.'}));
        m.append(h('div',{cls:'row',style:'margin-top:14px'},
          h('button',{cls:'btn primary',type:'button',text:'Peka ut filerna',
            onclick:()=>{ close(); res('valj'); }}),
          h('button',{cls:'btn',type:'button',text:'Ladda ned i stället',
            onclick:()=>{ close(); res('ladda'); }})));
      }, null);
    });
    if(svar === 'valj') await adoptFiles();
  }
  /* Skyddsräcke. Är facitet inte inläst innehåller KEY på sin höjd de svar
     som råkat kryssas i under den här sessionen. Skrivs det tillbaka
     raderas alla övriga rätta svar utan att någon märker det. Då sparar vi
     innehållet men lämnar facitfilen i fred. */
  if(!keyLoaded){
    const okC = await writeJson('content', contentForSave(), 'kv-academy-innehall.json');
    if(!okC) return;
    await writeBundle();
    try{ localStorage.setItem(LS + '-content', JSON.stringify({C,KEY})); }catch(e){}
    contentDirty = false; clearDraft(); render();
    modal('narrow','Innehållet sparat — facitet lämnades orört', (m, close) => {
      m.append(h('p',null,
        h('b',{text:'kv-academy-innehall.json är sparad. '}),
        h('span',{text:'kv-academy-facit.json har medvetet INTE skrivits över.'})));
      m.append(h('p',{cls:'muted',
        text:'Facitfilen lästes aldrig in när appen startade, så programmet känner inte till de rätta svaren. Hade den sparats nu skulle alla svar utom de du råkat kryssa i just den här gången ha försvunnit.'}));
      m.append(h('p',{cls:'muted',
        text:'Vill du redigera provsvar: ladda om sidan och öppna BÅDA filerna — kv-academy-innehall.json och kv-academy-facit.json. Markera dem tillsammans med Ctrl.'}));
    }, [{label:'Jag förstår', cls:'btn primary'}]);
    return;
  }
  const okC = await writeJson('content', contentForSave(), 'kv-academy-innehall.json');
  if(!okC) return;
  await writeJson('key', keyForSave(), 'kv-academy-facit.json');
  await writeBundle();
  try{ localStorage.setItem(LS + '-content', JSON.stringify({C,KEY})); }catch(e){}
  contentDirty = false;
  clearDraft();
  render();
  toast(fileH.content
    ? (fileH.bundle ? 'Sparat i data/ — innehåll, facit och Drive-paketet'
                    : 'Sparat i innehåll och facit — kv-academy-data.js laddades ned, lägg den i mappen data')
    : 'Filerna nedladdade — lägg dem i mappen data bredvid appen');
}

/* ---- validering ---- */
function validate(){
  const out = [];
  const lessonIds = new Set(Object.keys(C.lessons||{}));
  const used = new Set();
  for(const c of (C.courses||[])){
    if(!(c.modules||[]).length) out.push({k:'warn', t:c.title + ' har inga moduler och därmed inget innehåll.', fix:'Lägg till en modul och en lektion i den.'});
    for(const m of (c.modules||[])) for(const lid of (m.lessons||[])){
      used.add(lid);
      if(!lessonIds.has(lid)) out.push({k:'err', t:c.title + ' → ' + m.title + ': lektionen "' + lid + '" finns inte.', fix:'Ta ur den ur modulen, eller skapa en lektion med det namnet.'});
    }
    for(const p of (c.prerequisites||[])) if(!course(p))
      out.push({k:'err', t:c.title + ': den kurs som anges som förkunskap finns inte längre.', fix:'Välj en annan kurs, eller ingen alls.'});
    if(c.quizId && !quizDef(c.quizId))
      out.push({k:'err', t:c.title + ': provet som kursen pekar på finns inte.', fix:'Välj ett annat prov under kursens inställningar, eller inget.'});
    if(c.certificate && c.certificate.issue && !c.quizId)
      out.push({k:'warn', t:c.title + ' ger intyg men har inget prov.', fix:'Intyget säger då bara att någon klickat sig igenom. Lägg till ett prov, eller stäng av intyget.'});
  }
  /* Licenser: två fel som är lätta att göra och kostar pengar respektive
     förvirring. En licensierad kurs som ingen kund har är osäljbar tills
     någon får den; en licens som pekar på en kurs som inte längre kräver
     licens ser ut att betyda något men gör det inte. */
  for(const c of (C.courses||[])){
    if(!c.licensed) continue;
    const har = (C.customers||[]).filter(cu => (cu.licenses||[]).some(l => l.courseId===c.id));
    if(!har.length) out.push({k:'warn',
      t:c.title + ' kräver tillgång men ingen anläggning har fått den.',
      fix:'Alla ser den med hänglås. Ge tillgång under Anläggningar, eller kryssa av "Kräver tillgång" om den ska vara öppen.'});
  }
  for(const cu of (C.customers||[])) for(const l of (cu.licenses||[])){
    const c = course(l.courseId);
    if(!c) out.push({k:'err',
      t:cu.name + ' har tillgång till en utbildning som inte finns (' + l.courseId + ').',
      fix:'Ta bort raden under Anläggningar.'});
    else if(!c.licensed) out.push({k:'warn',
      t:cu.name + ' har tillgång till ' + c.title + ', men den kursen kräver ingen licens — alla ser den ändå.',
      fix:'Antingen: kryssa i "Kräver licens" på kursen. Eller: ta bort tillgången, den gör inget.'});
    else if(l.until && Date.parse(l.until) < Date.now()) out.push({k:'warn',
      t:cu.name + ': tillgången till ' + c.title + ' gick ut ' + l.until + '.',
      fix:'Förläng datumet, eller lämna det — anläggningen ser kursen låst med "Licensen har gått ut".'});
  }
  for(const lid of lessonIds) if(!used.has(lid))
    out.push({k:'warn', t:'Lektionen "' + (C.lessons[lid].title||lid) + '" ligger inte i någon kurs.', fix:'Ingen kan hitta den. Lägg in den i en modul, eller låt den ligga kvar som utkast.'});

  /* Språk: en halvöversatt kurs ser hel ut för den som inte läser engelska.
     Eleven får svenska stycken mitt i en engelsk kurs, vilket är sämre än
     att kursen helt saknar översättning. Därför tas det upp här. */
  for(const l of LOCALES.filter(x => x.id !== 'sv')){
    for(const c of (C.courses||[])){
      if(c.status === 'draft') continue;
      const tk = trCoverage(c.id, l.id);
      if(!tk.total || tk.klara === 0 || tk.klara >= tk.total) continue;
      out.push({k:'warn',
        t:c.title + ' är ' + tk.pct + ' % översatt till ' + l.name +
          ' (' + tk.klara + ' av ' + tk.total + ' texter).',
        fix:'Det som saknas visas på svenska mitt i den engelska kursen. Ladda ut språkfilen under kursen, rubriken Språk — de rader som redan är översatta följer med ifyllda.'});
    }
  }

  /* Övningsmiljön: en kund utan egen adress och utan allmän adress får
     övningsknappar som inte leder någonstans. Det märks först när en elev
     trycker på dem, så det tas upp här. */
  if((C.lessons ? Object.values(C.lessons) : []).some(l =>
       (l.blocks||[]).some(b => b.type === 'task' && b.deepLink))){
    const allman = ((C.settings||{}).trainingBaseUrl || '').trim();
    if(!allman){
      const utan = (C.customers||[]).filter(cu => !(cu.trainingBaseUrl||'').trim());
      if(utan.length) out.push({k:'warn',
        t:'Ingen allmän adress till övningsorganisationen finns, och ' +
          (utan.length === 1 ? utan[0].name + ' saknar egen.'
                             : utan.length + ' anläggningar saknar egen: ' +
                               utan.map(cu=>cu.name).join(', ') + '.'),
        fix:'Övningsknapparna leder ingenstans för dem. Skriv in en adress på anläggningen under Anläggningar, eller en allmän under Inställningar.'});
    }
  }
  /* Videoavsnitt: de fel som är lätta att göra när flera lektioner delar
     samma inspelning, och som inte syns förrän en elev fastnar. */
  for(const l of Object.values(C.lessons||{})){
    for(const b of (l.blocks||[])){
      if(b.type !== 'video') continue;
      const A = Number(b.startAt)||0, B = Number(b.endAt)||0;
      if(B && B <= A) out.push({k:'err',
        t:l.title + ': videoavsnittet slutar (' + mmss(B) + ') före eller samtidigt som det börjar (' + mmss(A) + ').',
        fix:'Rätta tiderna på filmen i lektionen. Sluttiden ska vara senare än starttiden.'});
      if((A || B) && !b.src) out.push({k:'warn',
        t:l.title + ': ett avsnitt är angivet men filmen saknar länk.',
        fix:'Lägg in länken till filmen, eller ta bort tiderna.'});
      if(A && (b.chapters||[]).length && !(b.chapters||[]).some(ch => ch.at >= A - 0.5 && (!B || ch.at <= B + 0.5)))
        out.push({k:'warn',
          t:l.title + ': inget kapitel ligger inom avsnittet, så kapitelfliken blir tom.',
          fix:'Kontrollera tiderna — kapitlens tider räknas från filmens början, inte från avsnittets.'});
    }
    if(l.status !== 'planned' && !(l.blocks||[]).length)
      out.push({k:'warn', t:l.title + ' visas för eleven men är tom.', fix:'Lägg till innehåll, eller ställ "Visas för eleven" på Nej.'});
    for(const b of (l.blocks||[])) for(const s of (b.spans||[]))
      if(s && s.mark === 'term' && !term(s.termId))
        out.push({k:'err', t:l.title + ': ordet "' + s.text + '" är gjort klickbart, men förklaringen det pekar på (' + s.termId + ') finns inte i ordlistan. Eleven får då ingenting när hen trycker på ordet.',
                  fix:'Antingen: lägg upp begreppet på fliken Ordlista. Eller: markera ordet i texten och ta bort märkningen runt det.'});
  }
  /* Är facitet inte inläst saknar VARJE fråga rätt svar. Att då rada upp
     en post per fråga är inte arton fel utan ett — och det ser ut som att
     innehållet är trasigt när det i själva verket är facitfilen som inte
     följde med. Ett tydligt besked i stället. */
  const antalFragor = Object.values(C.quizzes||{}).reduce((s,q)=>s+(q.items||[]).length, 0);
  if(antalFragor && !keyLoaded){
    out.push({k:'err',
      t:'Facitfilen är inte inläst, så programmet känner inte till något rätt svar — det gäller alla ' + antalFragor + ' frågor på en gång, inte varje fråga för sig.',
      fix:'Ladda om sidan och välj BÅDA filerna i rutan: kv-academy-innehall.json och kv-academy-facit.json. Håll ned Ctrl och klicka på båda. Provsvaren i filen är oförändrade — de syns bara inte här.'});
  }
  for(const q of Object.values(C.quizzes||{})){
    const n = (q.draw && q.draw.count) || 0;
    if(n > (q.items||[]).length) out.push({k:'err', t:q.title + ' ska dra ' + n + ' frågor men har bara ' + (q.items||[]).length + '.', fix:'Sänk antalet, eller skriv fler frågor.'});
    if(!keyLoaded) continue;              // facitkontroller är meningslösa utan facit
    for(const it of (q.items||[])){
      const k = (KEY.keys||{})[it.id];
      const fraga = spansToText(it.stem||[]).slice(0,70) || it.id;
      if(!k){ out.push({k:'err', t:q.title + ': frågan "' + fraga + '" saknar rätt svar.', fix:'Öppna provet och kryssa i vilket alternativ som är rätt.'}); continue; }
      if(it.type === 'ordering'){
        const ids = new Set((it.options||[]).map(o=>o.id));
        if(!k.order || k.order.length !== ids.size || !k.order.every(x=>ids.has(x)))
          out.push({k:'err', t:q.title + ': sorteringsfrågan "' + fraga + '" har alternativ som inte stämmer med facit.', fix:'Öppna frågan och lägg alternativen i rätt ordning igen.'});
      } else if(!(k.correct||[]).length){
        out.push({k:'err', t:q.title + ': frågan "' + fraga + '" har inget alternativ markerat som rätt.', fix:'Kryssa i rätt svar.'});
      }
      if(k && k.remediation && !lesson(String(k.remediation).split('#')[0]))
        out.push({k:'warn', t:q.title + ': frågan "' + fraga + '" hänvisar till en lektion som inte finns.', fix:'Välj en annan lektion under "Om eleven svarar fel".'});
    }
  }
  return out;
}

/* ---------------- Utbildningspaket i redaktören ----------------
   Två verktyg: ladda ned en kurs som ett paket (en mapp att lägga upp i
   GitHub), och testa ett paket — t.ex. ett som ChatGPT skrivit — innan det
   läggs upp. Testet visar exakt vad som är fel, och kursen går att öppna
   och gå igenom direkt. Inget av det sparas i innehållsfilen. */
function packageFromCourse(c){
  const letters = 'abcdefghij';
  const origin = PKG.origin.get(c.id);
  const strip = u => (origin && typeof u === 'string' && u.indexOf(PKG_DIR + origin + '/') === 0)
    ? u.slice((PKG_DIR + origin + '/').length) : u;
  const L = courseLessons(c).map(id => lessonRaw(id)).filter(Boolean).map(l => {
    const x = JSON.parse(JSON.stringify(l));
    /* Enkel form: text med märkning i stället för spans — lättare att läsa
       och att ge till ChatGPT som förebild. Inläsningen gör om det igen. */
    const txt = v => Array.isArray(v) ? spansToText(v) : v;
    for(const b of (x.blocks||[])){
      if(b.src) b.src = strip(b.src);
      if(b.spans){ b.text = spansToText(b.spans); delete b.spans; }
      if(b.items) b.items = b.items.map(txt);
      if(b.instruction) b.instruction = txt(b.instruction);
      if(b.rows) b.rows = b.rows.map(r => r.map(txt));
      if(b.definition) b.definition = txt(b.definition);
      if(b.type === 'video'){ if(!(b.chapters||[]).length) delete b.chapters; if(!(b.transcript||[]).length) delete b.transcript; }
      if(b.type === 'task' && !b.deepLink) delete b.deepLink;
    }
    delete x.status; if(x.required === true) delete x.required;
    return x;
  });
  const terms = {};
  for(const id0 of courseLessons(c)){ const l = lessonRaw(id0); if(l) for(const id of blockTerms(l)) if(termRaw(id)) terms[id] = termRaw(id); }
  const pkg = { format:'kv-utbildning-1',
    course: { id: c.id.replace(/^crs\./,''), title:c.title, summary:c.summary, audience:c.audience,
      estimatedMinutes:c.estimatedMinutes, cover: strip(c.cover), banner: strip(c.banner), certificate:c.certificate,
      modules:(c.modules||[]).map(m => ({id:m.id, title:m.title, lessons:m.lessons})) },
    lessons: L, terms };
  const q = c.quizId ? quizRaw(c.quizId) : null;
  if(q) pkg.quiz = { title:q.title, passScore:q.passScore, draw:(q.draw && q.draw.count) || (q.items||[]).length,
    attempts:(q.attempts && q.attempts.max) || 3,
    items:(q.items||[]).map(it => {
      const k = (KEY && KEY.keys && KEY.keys[it.id]) || {};
      const o = {id:it.id, type:it.type, stem:spansToText(it.stem)};
      if(it.intro) o.intro = spansToText(it.intro);
      if(it.type === 'ordering'){
        const ord = k.order || (it.options||[]).map(x => x.id);
        o.options = ord.map(id => ((it.options||[]).find(x => x.id === id) || {}).text);
      } else {
        o.options = (it.options||[]).map(x => x.text);
        o.correct = (k.correct||[]).map(id => letters[(it.options||[]).findIndex(x => x.id === id)]).filter(Boolean);
      }
      if(k.remediation) o.lesson = k.remediation;
      if(it.why) o.why = Array.isArray(it.why) ? spansToText(it.why) : it.why;
      return o;
    })};
  return pkg;
}
function downloadPackage(c){
  const b = new Blob([JSON.stringify(packageFromCourse(c), null, 1)], {type:'application/json'});

/* ---------------- Språkfil per kurs ----------------
   En kurs åt gången, inte hela innehållet: en översättare ska kunna få en
   kurs skickad till sig utan att få allt annat, och en färdig kurs ska
   kunna läsas in utan att någon annans arbete rörs.

   Filen är avsiktligt tråkig: en lista rader med "what" (var texten hör
   hemma, på svenska), "sv" (källtexten — nyckeln, får inte ändras) och
   "en" (tomt att fylla i). Ingen struktur att förstå, inga id:n att hålla
   reda på. Vid inläsning skrivs bara de rader som fyllts i. */
function langCard(c){
  const box = h('div',{cls:'card',style:'margin-top:18px'});
  const b   = h('div',{cls:'card-b'});
  box.append(h('div',{cls:'card-h'}, h('b',{text:'Språk'})), b);

  b.append(h('p',{cls:'muted',style:'max-width:76ch;margin-top:0',
    text:'Kursen skrivs på svenska. Vill du ha den på ett annat språk laddar du ut en språkfil, låter någon fylla i den, och läser in den igen. Ingenting i den svenska kursen ändras — översättningen läggs vid sidan om, och elever som har svenska valt märker inget.'}));

  for(const l of LOCALES.filter(x => x.id !== 'sv')){
    const tackning = trCoverage(c.id, l.id);
    const rad = h('div',{cls:'row',style:'margin-top:10px;align-items:flex-start'});
    const status = tackning.klara === 0 ? h('span',{cls:'tag warn',text:'inte översatt'})
      : tackning.klara >= tackning.total ? h('span',{cls:'tag fakt',text:'komplett'})
      : h('span',{cls:'tag warn',text:tackning.pct + ' % översatt'});
    add(rad,
      h('div',{style:'min-width:170px'},
        h('b',{text:l.name}),
        h('div',{cls:'small muted',text:tackning.klara + ' av ' + tackning.total + ' texter'})),
      status,
      h('div',{cls:'spacer'}),
      h('button',{cls:'btn sm',type:'button',text:'Ladda ut språkfil',
        onclick:()=>exportLangFile(c, l.id)}),
      h('button',{cls:'btn sm primary',type:'button',text:'Läs in översättning',
        onclick:()=>importLangFile(c, l.id)}));
    b.append(rad);
    if(tackning.klara && tackning.klara < tackning.total) b.append(h('div',{cls:'hint',
      text:'Det som inte är översatt visas på svenska för eleven. Ladda ut filen igen — de rader som redan är översatta följer med ifyllda, så bara resten återstår.'}));
  }
  return box;
}
function langFileName(c, till){
  return 'kv-academy-sprak-' + c.id + '-' + till + '.json';
}
function exportLangFile(c, till){
  const rader = courseStrings(c.id, till);
  const d = (C.translations || {})[till] || {};
  download(langFileName(c, till), {
    schemaVersion: 1,
    type: 'kv-academy-sprakfil',
    course: c.id,
    courseTitle: c.title,
    from: 'sv',
    to: till,
    generated: new Date().toISOString().slice(0,16).replace('T',' '),
    sadarhargorduh: [
      'Fyll i fältet "' + till + '" för varje rad. Lämna "sv" exakt som det står — det är nyckeln som binder översättningen till den svenska texten.',
      'Ändra inte ordningen och ta inte bort rader. Rader du lämnar tomma visas på svenska för eleven.',
      '"what" säger var texten hör hemma i kursen. Den är bara till hjälp och översätts inte.',
      'Märkning ska följa med: **fet text** förblir fet, *kursiv* förblir kursiv, och [[begreppsid|ordet]] ska ha samma begreppsid kvar — bara ordet efter strecket översätts.',
      'Spara filen och läs in den i redaktören under kursen, rubriken Språk.'
    ],

  });

/* Läser in en språkfil. Kontrollerar tre saker som annars ger fel som
   först syns för eleven: att filen hör till den här kursen, att märkningen
   är hel, och att den svenska texten fortfarande finns i kursen. */
function importLangFile(c, till){
  const inp = h('input',{type:'file',accept:'application/json,.json',style:'display:none'});
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    let o;
    try{ o = JSON.parse(await f.text()); }
    catch(e){ alert('Filen går inte att läsa som JSON. Kom den från redaktören?'); return; }
    if(o.type !== 'kv-academy-sprakfil' || !Array.isArray(o.strings)){
      alert('Det här ser inte ut som en språkfil från Klätterverket Academy.'); return;
    }
    const spr = o.to || till;
    if(o.course && o.course !== c.id && !confirm(
      'Filen är gjord för kursen "' + (o.courseTitle || o.course) +
      '", men du står i "' + c.title + '". Läsa in den ändå? Texter som inte finns i den här kursen hamnar i innehållet men visas ingenstans.')) return;

    const nu = new Set(courseStrings(c.id, spr).map(r => r.sv));
    C.translations = C.translations || {};
    C.translations[spr] = C.translations[spr] || {};
    const d = C.translations[spr];
    let skrivna = 0, tomma = 0, brutna = [], okanda = 0;
    for(const r of o.strings){
      const sv = r && r.sv, ut = r && (r[spr] != null ? r[spr] : r.text);
      if(typeof sv !== 'string' || !sv) continue;
      if(ut == null || String(ut).trim() === ''){ tomma++; continue; }
      const fel = markupDiff(sv, String(ut));
      if(fel){ brutna.push({sv, fel}); continue; }
      if(!nu.has(sv)) okanda++;
      d[sv] = String(ut); skrivna++;
    }
    touchContent();
    modal('', 'Översättningen inläst', m => {
      m.append(h('p',null, h('b',{text:skrivna + ' texter'}),
        h('span',{text:' lästes in för ' + localeName(spr) + '.'})));
      const rad = (txt, kl) => m.append(h('div',{cls:'hint' + (kl?' '+kl:''),text:txt}));
      if(tomma)  rad(tomma + ' rader var tomma och hoppades över. De visas på svenska för eleven.');
      if(okanda) rad(okanda + ' texter i filen finns inte längre i kursen — den svenska texten har ändrats sedan filen gjordes. De ligger kvar i innehållet utan att visas, och gör ingen skada.');
      if(brutna.length){
        m.append(h('div',{cls:'banner err',style:'margin-top:12px'},h('div',null,
          h('div',{style:'font-weight:600'},brutna.length + ' rader hoppades över: märkningen stämmer inte'),
          h('div',{cls:'small',style:'margin-top:3px'},
            'Fet text, kursiv och klickbara begrepp måste se likadana ut i båda språken. Raderna nedan behöll svenskan.'))));
        const ul = h('ul',{cls:'small',style:'margin:8px 0 0;padding-left:18px'});
        for(const x of brutna.slice(0,12))
          ul.append(h('li',null, h('span',{text:x.fel + ': '}), h('i',{text:x.sv.slice(0,80)})));
        if(brutna.length > 12) ul.append(h('li',{cls:'muted',text:'… och ' + (brutna.length-12) + ' till'}));
        m.append(ul);
      }
      const tk = trCoverage(c.id, spr);
      m.append(h('p',{cls:'small muted',style:'margin-top:12px',
        text:'Kursen är nu ' + tk.pct + ' % översatt till ' + localeName(spr) +
             ' (' + tk.klara + ' av ' + tk.total + '). Kom ihåg att spara innehållsfilen.'}));
    }, [{label:'Klart', cls:'btn primary', onclick:()=>{ render(); }}]);
  });
  document.body.append(inp); inp.click();
  setTimeout(()=>inp.remove(), 60000);
}
/* Returnerar en förklaring om märkningen skiljer sig, annars null. */
function markupDiff(sv, en){
  const ids = s => (s.match(/\[\[([^\]|]+)\|/g) || []).map(x => x.slice(2,-1)).sort().join(',');
  if(ids(sv) !== ids(en)) return 'begreppen [[…]] stämmer inte';
  const par = (s, tecken) => (s.split(tecken).length - 1) % 2 === 0;
  if(!par(en, '**')) return 'ojämnt antal ** för fet text';
  const stjarnor = s => (s.replace(/\*\*/g,'').match(/\*/g) || []).length;
  if(stjarnor(en) % 2) return 'ojämnt antal * för kursiv';
  if((en.match(/`/g) || []).length % 2) return 'ojämnt antal ` för kod';
  return null;
}

function newLessonDialog(onCreate){
  modal('', 'Ny lektion', (m, close) => {
    const nameIn = h('input',{type:'text', placeholder:'T.ex. Hjärtstartaren'});
    const err = h('div',{cls:'hint',style:'color:var(--err)'});
    m.append(h('div',{cls:'fld full'}, h('label',{text:'Vad ska lektionen heta?'}), nameIn, err));

function newBlock(type){
  switch(type){
    case 'heading':   return {type,level:2,text:''};
    case 'richtext':  return {type,spans:[{text:''}]};
    case 'list':      return {type,ordered:false,items:[]};
    case 'steps':     return {type,items:[]};
    case 'callout':   return {type,intent:'info',title:'',spans:[{text:''}]};
    case 'keyTerm':   return {type,term:'',definition:''};
    case 'video':     return {type,assetId:'',title:'',chapters:[],transcript:[]};
    case 'task':      return {type,id:'',instruction:'',deepLink:''};
    case 'image':     return {type,src:'',alt:'',caption:''};
    case 'table':     return {type,head:[],rows:[]};
    case 'reference': return {type,label:'Läs mer: ',url:''};
    case 'quizRef':   return {type,text:''};
    default:          return {type};
  }
}
const secToStamp = s => mmss(s||0);
/* Tomt fält ska vara tomt, inte "0:00" — annars ser varje film ut att ha
   ett avsnitt som börjar på noll, och sparas det blir startAt=0 överallt. */
const secToStampOrEmpty = s => (s == null || s === '') ? '' : mmss(s);
/* Tar emot 12, 2:14 och 1:04:37 — inspelningen är längre än en timme. */
const stampToSec = t => {
  const p = String(t).trim().split(':').map(Number);
  if(p.length === 3) return p[0]*3600 + p[1]*60 + (p[2]||0);
  if(p.length === 2) return p[0]*60 + (p[1]||0);
  return Number(t)||0;
};
const linesToTimed = (txt, field) => String(txt).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  const m = l.match(/^(\d+:\d{1,2}:\d{1,2}|\d+:\d{1,2}|\d+)\s+(.*)$/);
  return m ? {at: stampToSec(m[1]), [field]: m[2]} : {at:0, [field]: l};
});
const timedToLines = (arr, field) => (arr||[]).map(x => secToStamp(x.at) + ' ' + (x[field]||'')).join('\n');

function edLesson(){

  const app = edShell('ed');
  if(!l){ app.append(h('div',{cls:'nores',text:'Lektionen finns inte.'})); return; }

     lektionen på annat sätt letar vi upp den kurs som innehåller den, så att
     sökvägen aldrig tappar kursnamnet. */

    || (C.courses||[]).find(c => courseLessons(c).includes(l.id));
  const back = hemkurs ? '#/red/kurs/' + hemkurs.id : '#/red';

  const sokvag = h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Kurser',onclick:()=>go('#/red')}),

  if(hemkurs) sokvag.append(h('span',{text:'/'}),
    h('button',{cls:'link',type:'button',text:hemkurs.title || '(utan titel)',
                onclick:()=>go(back)}));
  sokvag.append(h('span',{text:'/'}), h('span',{text:l.title}));
  app.append(sokvag);
  app.append(h('h1',{text:l.title || '(utan titel)'}));

  const meta = h('div',{cls:'card',style:'margin-bottom:16px'},h('div',{cls:'card-b'}));
  const g = h('div',{cls:'fgrid'});
  l.source = l.source || {};
  add(g,
    fText('Lektionens namn', l.title, v=>{ l.title=v; }, null, true),
    fText('Avsnittsnummer', l.label, v=>{ l.label=v; },
      'Visas bredvid namnet, t.ex. 2.3. Ordningen bestäms av listan i kursen, inte av numret.'),
    fNum('Ungefärlig tid i minuter', l.estimatedMinutes, v=>{ l.estimatedMinutes=v; },
      'Visas för eleven. Sikta på fem minuter per lektion.'),
    fSel('Visas för eleven', l.status||'published',
      [{v:'published',t:'Ja — lektionen är klar att läsa'},
       {v:'planned',t:'Nej — kommande, visas låst'}], v=>{ l.status=v; }),
    fText('Bygger på källa (adress)', l.source.url, v=>{ l.source.url=v||undefined; },
      'Var fakta i lektionen kommer ifrån, t.ex. hlr.nu. Gör det möjligt att se om källan ändrats.', true));
  meta.firstChild.append(g);
  meta.firstChild.append(h('div',{cls:'row',style:'margin-top:12px'},
    fChk('Måste göras för att kursen ska bli klar', l.required !== false, v=>{ l.required=v; }),
    fChk('Texten är ett utkast — visa varning för eleven', !!l.draft, v=>{ l.draft=v; })));

    h('h3',{style:'margin:0',text:'Lektionens innehåll, del för del'}),
    h('div',{cls:'spacer'}),
    h('span',{cls:'small muted',text:(l.blocks||[]).length + ' delar'})));
  const list = h('div');
  (l.blocks||[]).forEach((b, i) => list.append(blockEditor(l, b, i)));
  if(!(l.blocks||[]).length) list.append(h('div',{cls:'card'},h('div',{cls:'nores',text:'Lektionen är tom. Välj något i listan nedan för att lägga till första delen.'})));
  app.append(list);

  app.append(lessonChecklist(l));
  app.append(h('div',{cls:'row',style:'margin-top:12px'},
    h('button',{cls:'btn primary',type:'button',text:'+ Lägg till innehållsdel',
      onclick:()=>addBlockDialog(l)}),
    h('button',{cls:'btn',type:'button',text:'Förhandsgranska hela lektionen',
      onclick:()=>{ if(route.courseId) go('#/lektion/'+route.courseId+'/'+l.id); else toast('Öppna lektionen via sin kurs för att förhandsgranska.'); }})));
