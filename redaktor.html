function setSaveState(){
  /* Variabeln får inte heta t — det är namnet på översättningsfunktionen. */
  const d = document.getElementById('dot'), txt = document.getElementById('savetxt'),
        f = document.getElementById('fileinfo');
  if(!d) return;
  d.className = 'dot' + (dirty?' dirty':'');
  txt.textContent = t(dirty ? 'Ej sparat' : 'Sparat');
  /* Med framstegsregister: visa om allt har nått registret. */
  if(typeof syncUrl === 'function' && syncUrl() && P.user){
    const n = syncPending();
    if(SYNC.error && n){ d.className = 'dot dirty'; txt.textContent = t('Ej synkat (%1)', n); txt.title = SYNC.error; }
    else if(n){ d.className = 'dot dirty'; txt.textContent = t('Synkar…'); }
    else { txt.textContent = t('Synkat'); txt.title = ''; }
  }
  f.textContent = P.user ? P.user.name : '';
  /* Utloggningen syns i toppraden när någon är inloggad — den ska inte
     behöva letas fram i en meny på en dator som flera delar på. */
  const lo = document.getElementById('btnLogout');
  if(lo){ lo.style.display = P.user ? '' : 'none'; lo.textContent = t('Logga ut'); }
}

/* ---------- modal ---------- */
function modal(size, title, build, buttons){
  const host = document.getElementById('modal');
  const box  = h('div',{cls:'modal '+(size||'')});
  const body = h('div',{cls:'modal-b'});
  const close = () => host.replaceChildren();
  box.append(
    h('div',{cls:'modal-h'}, h('h2',{text:title}),
      h('button',{cls:'x',type:'button','aria-label':'Stäng',text:'×',onclick:close})),
    body);
  if(buttons && buttons.length){
    box.append(h('div',{cls:'modal-f'}, h('div',{cls:'spacer'}),
      ...buttons.map(b => h('button',{cls:b.cls||'btn',type:'button',text:b.label,
        onclick:()=>{ if(!b.onclick || b.onclick()!==false) close(); }}))));
  }
  build(body, close);
  const ovl = h('div',{cls:'ovl', onclick:e=>{ if(e.target===ovl) close(); }}, box);
  host.replaceChildren(ovl);
  const first = box.querySelector('input,button,select,textarea');
  if(first) first.focus();
  return close;
}

/* ---------- statusikon: form, inte bara färg ---------- */
function statusEl(state){
  const map = {done:['done','✓'], now:['now','▸'], open:['',''], lock:['lock','🔒'], plan:['plan','·']};
  const [cls,ch] = map[state] || ['',''];
  return h('span',{cls:'st '+cls,'aria-hidden':'true',text:ch});
}
function progBar(pct, ok){
  return h('div',{cls:'prog'+(ok?' ok':''),role:'progressbar','aria-valuenow':String(pct),
    'aria-valuemin':'0','aria-valuemax':'100'}, h('i',{style:'width:'+pct+'%'}));
}

/* ============================== START ============================== */
function viewStart(){
  const app = APP(); app.replaceChildren();
  const target = resumeTarget();
  app.append(heroEl());

  if(target){
    const st = courseState(target);
    const next = st.next ? lesson(st.next) : null;
    const line = st.completed ? 'Klar' :
      next ? next.title + ' · ' + t('%1 min', next.estimatedMinutes||5) : 'Provet återstår';
    app.append(h('div',{cls:'resume'},
      h('div',{cls:'rgrow'},
        h('div',{cls:'rl',text: st.started ? 'Fortsätt där du var' : 'Börja här'}),
        h('h2',{text: target.title}),
        h('div',{cls:'rs',text: line + (st.started ? ' · ' + st.minutesLeft + ' min kvar i kursen' : '')})),
      h('button',{cls:'btn primary lg',type:'button',
        text: st.started ? 'Fortsätt' : 'Starta kursen',
        onclick:()=> st.next ? go('#/lektion/'+target.id+'/'+st.next) : go('#/prov/'+target.id)})));
  }

  /* Siffrorna räknar bara det eleven kan göra. Att stå på "3 av 7 klara"
     när fyra är låsta är inte ett framsteg, det är en felmätning. */
  const mina  = accessibleCourses();
  const lasta = visibleCourses().filter(c => isLocked(c));
  const cs    = mina.map(courseState);
  app.append(h('div',{cls:'kpis'},
    kpi('Kurser klara', t('%1 av %2', cs.filter(s=>s.completed).length, mina.length), '', 'ok'),
    kpi('Pågående', String(cs.filter(s=>s.started && !s.completed).length), ''),
    kpi('Intyg', String(certificates().length), 'giltiga', 'plan'),
    kpi('Tid kvar', t('%1 min', cs.reduce((a,s)=>a+(s.completed?0:s.minutesLeft),0)), 'för allt du inte gjort')));

  app.append(h('h3',{text:'Dina kurser'}));
  app.append(courseGrid(mina));

  if(lasta.length){
    app.append(h('div',{cls:'row',style:'margin:26px 0 2px'},
      h('h3',{style:'margin:0',text:'Finns också i Klätterverket Academy'}),
      h('div',{cls:'spacer'}),
      h('span',{cls:'small muted',
        text: lasta.length===1 ? t('%1 utbildning ingår inte i er tillgång', lasta.length)
                               : t('%1 utbildningar ingår inte i er tillgång', lasta.length)})));
    app.append(h('p',{cls:'small muted',style:'margin:4px 0 12px',
      text:'Klicka för att se vad de innehåller och anmäla intresse.'}));
    app.append(courseGrid(lasta));
  }
}
/* Klätterverket: startsidan börjar med hallen — bild eller film ur
   Inställningar. Den är låg, så att "Fortsätt där du var" fortfarande syns
   utan att skrolla: en enda nästa åtgärd gäller fortfarande. */
function heroEl(){
  const s = (C && C.settings) || {};
  const hero = h('div',{cls:'hero'});
  if(s.heroImage) hero.style.backgroundImage = 'url("' + String(s.heroImage).replace(/["\\]/g,'') + '")';
  const lugn = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(s.heroVideo && !lugn){
    const v = h('video',{src:s.heroVideo, autoplay:'', loop:'', playsinline:'', preload:'auto', 'aria-hidden':'true'});
    v.muted = true; v.defaultMuted = true;
    v.addEventListener('error', () => v.remove());
    hero.append(v);
  }
  const namn = P.user ? String(P.user.name||'').split(' ')[0] : '';
  hero.append(h('div',{cls:'hero-in'},
    h('div',{cls:'hero-k',text: tr(s.heroKicker) || 'Klätterverket Academy'}),
    h('div',{cls:'hero-t',text: tr(s.heroTitle) || 'Vi skapar trygghet!'}),
    h('div',{cls:'hero-s',text: (namn ? t('Hej %1!', namn) + ' ' : '') + (tr(s.heroText) || '')})));
  return hero;
}
function kpi(label, value, sub, cls){
  return h('div',{cls:'kpi'+(cls?' '+cls:'')},
    h('div',{cls:'l',text:label}), h('div',{cls:'v',text:value}),
    h('div',{cls:'s',text:sub||''}));
}

/* ============================== KATALOG ============================== */
function viewCatalog(){
  const app = APP(); app.replaceChildren();
  app.append(h('h1',{text:'Kurser'}));

  const auds = [...new Set(visibleCourses().flatMap(c=>c.audience||[]))];
  const bar  = h('div',{cls:'row',style:'margin-bottom:14px'});
  let filter = 'alla';
  const draw = () => {
    const list = visibleCourses().filter(c => filter==='alla' || (c.audience||[]).includes(filter));
    grid.replaceChildren(list.length ? courseGrid(list)
      : h('div',{cls:'nores',text:'Inga kurser för den målgruppen ännu.'}));
  };
  const mk = (val,label) => {
    const b = h('button',{cls:'btn sm'+(filter===val?' primary':''),type:'button',text:label,
      onclick:()=>{ filter=val; [...bar.children].forEach(x=>x.classList.remove('primary'));
                    b.classList.add('primary'); draw(); }});
    return b;
  };
  bar.append(mk('alla','Alla'), ...auds.map(a => mk(a, audienceLabel(a))));
  bar.firstChild.classList.add('primary');
  const grid = h('div');
  app.append(bar, grid); draw();
}
const AUD = {all:'Alla medarbetare', reception:'Reception', instructor:'Instruktörer',
             hallvard:'Hallvärdar', shop:'Shoppen', kids:'Barn & ungdom', pt:'Personliga tränare',
             cafe:'Restaurang & café', lead:'Platsansvariga', internal:'Internt'};
/* Etiketten översätts vid visning, inte i tabellen — tabellen är nycklar. */
const audienceLabel = a => t(AUD[a] || a);

/* Hänglåset. Form, inte bara färg — och en riktig etikett för skärmläsare,
   eftersom "låst" är information och inte dekoration. */
function lockIcon(){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','lockico');
  s.setAttribute('aria-hidden','true'); s.setAttribute('focusable','false');
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M7 10V7a5 5 0 0 1 10 0v3h1.2A1.8 1.8 0 0 1 20 11.8v7.4A1.8 1.8 0 0 1 18.2 21H5.8A1.8 1.8 0 0 1 4 19.2v-7.4A1.8 1.8 0 0 1 5.8 10H7Zm2 0h6V7a3 3 0 0 0-6 0v3Zm3 5.2a1.4 1.4 0 0 0-.7 2.6v1.1a.7.7 0 0 0 1.4 0v-1.1a1.4 1.4 0 0 0-.7-2.6Z');
  s.append(p);
  return s;
}
function courseGrid(list){
  return h('div',{cls:'cgrid'}, list.map(c => {
    const acc    = courseAccess(c);
    const locked = acc === 'locked' || acc === 'expired';
    const st     = courseState(c);
    const miss   = prereqMissing(c);
    const card = h('button',{cls:'ccard' + (locked?' lockd':''), type:'button',
      onclick:()=>go('#/kurs/'+c.id)});
    if(c.cover){
      const im = h('img',{src:c.cover, alt:'', loading:'lazy'});
      /* Går bilden inte att hämta (ingen uppkoppling, flyttad bild) ska
         kortet se ut som vanligt — inte visa en trasig bild. */
      im.addEventListener('error', () => { if(im.parentNode) im.parentNode.remove(); });
      card.append(h('div',{cls:'ccover'}, im));
    }
    if(locked) card.append(h('span',{cls:'lockbadge'}, lockIcon(),
      h('span',{text: acc==='expired' ? 'Licensen har gått ut' : 'Låst'})));
    add(card,
      h('div',{cls:'cmeta'},
        ...(c.audience||[]).map(a => h('span',{cls:'tag prod',text:audienceLabel(a)})),
        c.certificate && c.certificate.issue ? h('span',{cls:'tag n',text:'Intyg'}) : null),
      h('h3',{text:c.title}),
      h('div',{cls:'cs',text:c.summary||''}),
      locked ? null : (st.total ? progBar(st.pct, st.completed) : null),
      locked
        ? h('div',{cls:'row small muted'},
            h('span',{text: t('%1 min', c.estimatedMinutes || st.minutesLeft || 0)}),
            st.total ? h('span',{text:'·'}) : null,
            st.total ? h('span',{text: t('%1 lektioner', st.total)}) : null,
            h('div',{cls:'spacer'}),
            h('span',{cls:'small',style:'color:var(--brand);font-weight:600',
              text: hasRequested(c) ? 'Efterfrågad ✓' : 'Läs mer →'}))
        : (st.total
          ? h('div',{cls:'row small muted'},
              h('span',{text: st.completed ? 'Klar' : st.pct + '%'}),
              h('span',{text:'·'}),
              h('span',{text: t('%1 min', c.estimatedMinutes||st.minutesLeft)}),
              h('span',{text:'·'}),
              h('span',{text: t('%1 lektioner', st.total)}))
          : h('div',{cls:'row'}, h('span',{cls:'tag warn',text:'Under produktion'}))));
    if(!locked && miss.length) card.append(h('div',{cls:'small',style:'color:var(--warn)',
      text:t('Kräver: %1', miss.map(m=>m.title).join(', '))}));
    return card;
  }));
}

/* ---------------- Låst kurs ----------------
   En låst kurs är inte en stängd dörr utan ett skyltfönster: vad ingår, hur
   lång är den, vad kan man efteråt. Innehållet visas aldrig — bara titlar.
   Knappen skriver en händelse i loggen, så att intresset blir en lista
   någon kan agera på i stället för en känsla.                            */
function lockedCourse(c, app, acc){
  const lic = licenseFor(c.id, (P.user && P.user.tenantId) || null);
  const org = (P.user && P.user.tenantName) || null;

  app.append(h('div',{cls:'lockhero'},
    h('div',{cls:'lh-ico'}, lockIcon()),
    h('div',{style:'flex:1;min-width:220px'},
      h('div',{cls:'lh-t',text: acc === 'expired'
        ? 'Er tillgång till den här utbildningen har gått ut'
        : 'Den här utbildningen ingår inte i er tillgång'}),
      h('div',{cls:'lh-s',text: acc === 'expired'
        ? t('Licensen gick ut %1. Innehållet finns kvar och öppnas igen så snart tillgången förnyas.',
             lic && lic.until ? lic.until : t('tidigare'))
        : t('Innehållet är klart och kan öppnas för %1. Utbildningen låses upp av utbildningsansvarig.',
             org || t('er anläggning'))}))));

  /* Innehållsförteckning utan innehåll: modulnamn och antal lektioner. */
  const mods = h('div',{cls:'mods'});
  let nLes = 0;
  for(const m of (c.modules||[])){
    const live = (m.lessons||[]).filter(id => { const l = lesson(id); return l && l.status !== 'planned'; });
    nLes += live.length;
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:m.title}),
      h('div',{cls:'spacer'}),
      h('span',{cls:'small muted',text: live.length===1 ? t('%1 lektion', live.length)
                                                          : t('%1 lektioner', live.length)})));
    for(const id of live){
      const l = lesson(id);
      box.append(add(h('div',{cls:'les lesq'}),
        h('span',{cls:'st lock','aria-hidden':'true',text:'🔒'}),
        h('span',{cls:'lnum',text:l.label||''}),
        h('span',{cls:'lt'}, h('b',{text:l.title}),
          h('s',{text:t('%1 min', l.estimatedMinutes||5)}))));
    }
    mods.append(box);
  }

  app.append(h('div',{cls:'kpis'},
    kpi('Lektioner', String(nLes), 'i utbildningen'),
    kpi('Tidsåtgång', t('%1 min', c.estimatedMinutes || nLes*5), 'ungefär, i egen takt'),
    kpi('Intyg', c.certificate && c.certificate.issue ? 'Ja' : 'Nej',
        c.certificate && c.certificate.issue
          ? t('giltigt i %1 månader', (c.certificate.validMonths||24)) : 'ingen examination',
        c.certificate && c.certificate.issue ? 'ok' : '')));

  /* Intresseanmälan */
  const box = h('div',{cls:'card',style:'margin:0 0 16px'},h('div',{cls:'card-b'}));
  const b = box.firstChild;
  if(hasRequested(c)){
    b.append(h('div',{cls:'banner ok',style:'margin:0'},h('span',{
      text:'Tack — din platsansvarige och utbildningsansvarig ser att du efterfrågat den här utbildningen. Prata med din chef om det är brådskande.'})));
  } else {
    b.append(h('div',{cls:'row'},
      h('div',{style:'flex:1;min-width:240px'},
        h('div',{style:'font-weight:600',text:'Vill du gå den här utbildningen?'}),
        h('div',{cls:'small muted',text:'Anmäl intresse så syns det i anläggningens rapport och hos utbildningsansvarig. Det är bara en förfrågan — inget mer händer automatiskt.'})),
      h('button',{cls:'btn primary',type:'button',text:'Anmäl intresse',onclick:()=>{
        requestCourse(c); render(); toast('Intresset är registrerat');
      }})));
  }
  app.append(box);
  app.append(h('h3',{text:'Det här ingår'}));
  if(!nLes){
    app.append(h('div',{cls:'card'},h('div',{cls:'nores'},
      h('div',{text:'Innehållet produceras just nu.'}),
      h('div',{cls:'small muted',style:'margin-top:8px',
        text:'Utbildningen finns i planen men lektionerna är inte inspelade eller skrivna ännu. Anmäl intresse ovan om ni vill ha den när den är klar.'}))));
  } else {
    app.append(mods);
    app.append(h('p',{cls:'small muted',style:'margin-top:14px',
      text:'Lektionsrubrikerna visas för att du ska kunna bedöma innehållet. Själva lektionerna öppnas när utbildningen låses upp.'}));
  }
}

/* ============================== KURS ============================== */
function viewCourse(){
  const c = course(route.courseId);
  const app = APP(); app.replaceChildren();
  if(!c){ app.append(h('div',{cls:'nores',text:'Kursen finns inte.'})); return; }
  const st = courseState(c);
  const miss = prereqMissing(c);
  const acc = courseAccess(c);

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Kurser',onclick:()=>go('#/katalog')}),
    h('span',{text:'/'}), h('span',{text:c.title})));

  /* banner: en bred bild för kurssidan (valfri). Annars visas omslaget. */
  if(c.banner){ const bi = h('img',{cls:'cbanner',src:c.banner,alt:''}); bi.addEventListener('error',()=>bi.remove()); app.append(bi); }
  else if(c.cover){ const ch = h('div',{cls:'chero'}); ch.style.backgroundImage = 'url("' + String(c.cover).replace(/["\\]/g,'') + '")'; app.append(ch); }
  app.append(h('h1',{text:c.title}));
  app.append(h('p',{cls:'muted',style:'max-width:70ch;margin-top:-6px',text:c.summary||''}));

  /* Låst kurs: visa vad den innehåller, men inget innehåll. Det är hela
     poängen — man ska kunna se att den är värd att skaffa. */
  if(acc === 'locked' || acc === 'expired'){ lockedCourse(c, app, acc); return; }

  if(miss.length) app.append(h('div',{cls:'banner warn'},
    h('span',{text:t('Den här kursen bygger på %1. Du kan läsa ändå, men gör den först om du är ny.', miss.map(m=>m.title).join(', '))})));

  if(!st.total) app.append(h('div',{cls:'banner warn'},h('span',{
    text:'Kursen är under produktion. Innehållet spelas in och skrivs — strukturen nedan visar vad som planeras.'})));
  else app.append(h('div',{cls:'card',style:'margin-bottom:16px'}, h('div',{cls:'card-b'},
    h('div',{cls:'row'},
      h('div',{style:'flex:1;min-width:200px'},
        h('div',{cls:'small muted',style:'margin-bottom:6px',
          text: st.completed ? 'Kursen är klar'
      : t('%1 av %2 lektioner · %3 min kvar', st.done, st.total, st.minutesLeft)}),
        progBar(st.pct, st.completed)),
      st.next
        ? h('button',{cls:'btn primary',type:'button',text: st.started?'Fortsätt':'Starta kursen',
            onclick:()=>go('#/lektion/'+c.id+'/'+st.next)})
        : (c.quizId ? h('button',{cls:'btn primary',type:'button',
            text: st.passed?'Gör om provet':'Till provet', onclick:()=>go('#/prov/'+c.id)}) : null)))));

  const mods = h('div',{cls:'mods'});
  for(const m of (c.modules||[])){
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:m.title})));
    for(const lid of (m.lessons||[])){
      const l = lesson(lid);
      if(!l){ continue; }
      const planned = l.status === 'planned';
      const done    = hasEvent('lesson', lid, 'completed');
      const isNext  = st.next === lid;
      const b = h('button',{cls:'les',type:'button',disabled:planned||null,
        onclick: planned ? null : ()=>go('#/lektion/'+c.id+'/'+lid)});
      add(b,
        statusEl(planned?'plan':done?'done':isNext?'now':'open'),
        h('span',{cls:'lnum',text:l.label||''}),
        h('span',{cls:'lt'}, h('b',{text:l.title}),
          h('s',{text: planned ? 'Kommande' : (l.estimatedMinutes||5)+' min'})),
        planned ? h('span',{cls:'tag n',text:'Kommande'}) : null);
      box.append(b);
    }
    mods.append(box);
  }
  if(c.quizId){
    const q = quizDef(c.quizId) || {};
    const box = h('div',{cls:'mod'});
    box.append(h('div',{cls:'mod-h'}, h('h3',{text:'Kunskapstest'})));
    const b = h('button',{cls:'les',type:'button',onclick:()=>go('#/prov/'+c.id)});
    add(b, statusEl(st.passed?'done':st.next?'lock':'now'), h('span',{cls:'lnum',text:''}),
      h('span',{cls:'lt'}, h('b',{text: q.title || 'Prov'}),
        h('s',{text: t('%1 frågor', q.draw ? q.draw.count : (q.items||[]).length) +
          t(' · godkänt vid %1%', Math.round((q.passScore||0.8)*100)) +
          (st.attempts ? t(' · %1 försök gjorda', st.attempts) : '')})),
      st.passed ? h('span',{cls:'tag fakt',text:t('Godkänd %1%', st.best)}) : null);
    box.append(b); mods.append(box);
  }
  app.append(mods);
}
</script>
<script>
/* ============================== LEKTION ============================== */
/* Vad som krävs för att lektionen ska räknas som klar. Deklareras av
   innehållet, inte av koden: video ska ha setts (eller transkriptet öppnats)
   och varje övning ska vara kvitterad. */
function hasVideoView(assetId){ return hasEvent('video', assetId || 'video', 'viewed'); }
function lessonRequirements(l){
  const out = [];
  for(const b of (l.blocks||[])){
    if(b.type === 'video'){
      // Går den inte att se och saknar transkript kan den heller inte krävas.
      const watchable = !!b.src || (b.transcript||[]).length > 0;
      if(watchable && !hasVideoView(b.assetId))
        out.push({key:'video', label: (b.transcript||[]).length ? 'se filmen eller öppna transkriptet' : 'se filmen'});
    }
    if(b.type === 'task'){
      const id = b.id || (l.id + ':task');
      if(!hasEvent('task', id, 'completed')) out.push({key:'task', label:'kvittera övningen'});
    }
  }
  return out;
}

function viewLesson(){
  const c = course(route.courseId), l = lesson(route.lessonId);
  const app = APP(); app.replaceChildren();
  if(!c || !l){ app.append(h('div',{cls:'nores',text:'Lektionen finns inte.'})); return; }
  /* Låst kurs: ingen lektion, inget prov, ingen händelse i loggen. Den som
     skriver in adressen för hand landar på kursens skyltfönster. */
  if(isLocked(c)){ go('#/kurs/' + c.id); return; }
  if(l.status === 'planned'){
    app.append(h('div',{cls:'banner warn'},h('span',{text:'Den här lektionen är inte inspelad ännu.'})));
  }
  if(l.draft){
    app.append(h('div',{cls:'banner info noprint'},h('span',{
      text:'Utkast — lektionen ska granskas och kompletteras med era lokala rutiner innan den räknas som färdig.'})));
  }
  if(!hasEvent('lesson', l.id, 'viewed'))
    logEvent('viewed','lesson',l.id,{courseId:c.id, courseVersion:c.version});

  const st  = courseState(c);
  const ids = st.lessonIds;
  const i   = ids.indexOf(l.id);
  const nextId = i >= 0 && i < ids.length-1 ? ids[i+1] : null;

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Kurser',onclick:()=>go('#/katalog')}),
    h('span',{text:'/'}),
    h('button',{cls:'link',type:'button',text:c.title,onclick:()=>go('#/kurs/'+c.id)}),
    h('span',{text:'/'}), h('span',{text:l.title})));

  const wrap = h('div',{cls:'lwrap'});
  const body = h('div',{cls:'lbody'});
  const head = h('div',{cls:'lhead'},
    h('h1',{text:l.title}),
    h('div',{cls:'small muted',text:[l.label ? t('Avsnitt %1', l.label) : null,
      t('%1 min', l.estimatedMinutes||5)].filter(Boolean).join(' · ')}));
  body.append(head);

  const ctx = {courseId:c.id, lessonId:l.id, onProgress:()=>drawFoot()};
  body.append(renderBlocks(l.blocks, ctx));

  const foot = h('div',{cls:'lfoot'});
  body.append(foot);

  function drawFoot(){
    foot.replaceChildren();
    const done = hasEvent('lesson', l.id, 'completed');
    const missing = lessonRequirements(l);

    if(done){
      foot.append(h('span',{cls:'tag fakt',text:'✓ Klar'}));
      if(nextId) foot.append(h('button',{cls:'btn primary',type:'button',text:'Nästa lektion',
        onclick:()=>go('#/lektion/'+c.id+'/'+nextId)}));
      else if(c.quizId) foot.append(h('button',{cls:'btn primary',type:'button',text:'Till provet',
        onclick:()=>go('#/prov/'+c.id)}));
      else foot.append(h('button',{cls:'btn',type:'button',text:'Tillbaka till kursen',
        onclick:()=>go('#/kurs/'+c.id)}));
      return;
    }
    const btn = h('button',{cls:'btn primary',type:'button',
      text: nextId ? 'Markera klar och fortsätt' : 'Markera klar',
      onclick:()=>{
        logEvent('completed','lesson',l.id,{courseId:c.id, courseVersion:c.version});
        if(maybeCompleteCourse(c)) toast('Kursen är klar');
        if(nextId) go('#/lektion/'+c.id+'/'+nextId);
        else render();
      }});
    if(missing.length){
      btn.disabled = true;
      foot.append(btn, h('span',{cls:'small muted',
        text:t('Kvar innan lektionen kan markeras klar: %1',
               missing.map(m=>t(m.label)).join(', '))}));
    } else foot.append(btn);
    if(nextId) foot.append(h('button',{cls:'btn ghost',type:'button',text:'Hoppa över',
      onclick:()=>go('#/lektion/'+c.id+'/'+nextId)}));
  }
  drawFoot();

  /* höger räls: alltid synlig progression */
  const rail = h('div',{cls:'rail noprint'});
  rail.append(h('div',{cls:'card'},h('div',{cls:'card-b'},
    h('div',{cls:'small muted',style:'margin-bottom:6px',
      text: t('%1 av %2 klara · %3 min kvar', st.done, st.total, st.minutesLeft)}),
    progBar(st.pct, st.completed))));
  const list = h('div',{cls:'railles'});
  for(const id2 of ids){
    const l2 = lesson(id2);
    list.append(h('button',{cls: id2===l.id?'on':'', type:'button',
      onclick:()=>go('#/lektion/'+c.id+'/'+id2)},
      statusEl(hasEvent('lesson',id2,'completed')?'done':id2===l.id?'now':'open'),
      h('span',{text:(l2.label?l2.label+' ':'')+l2.title})));
  }
  rail.append(h('div',{cls:'card'},h('div',{cls:'card-h'},h('h2',{text:c.title})),
    h('div',{cls:'card-b',style:'padding:8px'},list)));
  wrap.append(body, rail);
  app.append(wrap);
}

/* ============================== PROV ==============================
   Rättningen ligger i scoreAttempt(). I skarp drift ersätts den av
   POST /api/attempts/:id/submit — facit lämnar då aldrig servern.       */
function drawItems(q){
  let items = (q.items||[]).slice();
  if(q.draw && q.draw.count && q.draw.count < items.length){
    for(let i=items.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
    items = items.slice(0, q.draw.count);
  }
  return items.map(it => {
    const c2 = Object.assign({}, it);
    if(q.shuffleOptions && c2.options){
      c2.options = c2.options.slice();
      for(let i=c2.options.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [c2.options[i],c2.options[j]]=[c2.options[j],c2.options[i]]; }
    }
    if(c2.type === 'ordering' && c2.options){
      c2.options = c2.options.slice();
      for(let i=c2.options.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [c2.options[i],c2.options[j]]=[c2.options[j],c2.options[i]]; }
    }
    return c2;
  });
}
function scoreAttempt(q, items, answers){
  let got = 0, max = 0;
  const per = items.map(it => {
    const k = (KEY && KEY.keys) ? KEY.keys[it.id] : null;
    const pts = it.points || 1;
    max += pts;
    const a = answers[it.id];
    let ok = false;
    if(k){
      if(it.type === 'ordering') ok = Array.isArray(a) && a.join('|') === (k.order||[]).join('|');
      else {
        const want = (k.correct||[]).slice().sort().join('|');
        const give = (Array.isArray(a)?a:(a==null?[]:[a])).slice().sort().join('|');
        ok = want !== '' && want === give;
      }
    }
    if(ok) got += pts;
    return {id:it.id, ok, item:it, key:k};
  });
  const score = max ? Math.round(got/max*100) : 0;
  return {score, passed: score >= Math.round((q.passScore||0.8)*100), per};
}

function viewQuiz(){
  const c = course(route.courseId);
  const app = APP(); app.replaceChildren();
  if(!c || !c.quizId){ app.append(h('div',{cls:'nores',text:'Kursen har inget prov.'})); return; }
  /* Låst kurs: ingen lektion, inget prov, ingen händelse i loggen. Den som
     skriver in adressen för hand landar på kursens skyltfönster. */
  if(isLocked(c)){ go('#/kurs/' + c.id); return; }
  const q = quizDef(c.quizId);
  if(!q){ app.append(h('div',{cls:'nores',text:'Provet saknas i innehållsfilen.'})); return; }
  const st = courseState(c);
  const maxA = (q.attempts && q.attempts.max) || 3;
  const left = Math.max(0, maxA - st.attempts);

  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:c.title,onclick:()=>go('#/kurs/'+c.id)}),
    h('span',{text:'/'}), h('span',{text:'Prov'})));

  if(!quizRun || quizRun.quizId !== q.id || quizRun.courseId !== c.id){
    // intro
    const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
    const b = card.firstChild;
    b.append(h('h1',{text: q.title || 'Kunskapstest'}));
    if(st.passed) b.append(h('div',{cls:'banner ok'},
      h('span',{text:t('Du är redan godkänd med %1%. Du kan göra om provet om du vill.', st.best)})));
    b.append(h('ul',null,
      h('li',{text: t('%1 frågor, slumpvis dragna', q.draw?q.draw.count:(q.items||[]).length)}),
      h('li',{text:t('Godkänt vid %1%', Math.round((q.passScore||0.8)*100))}),
      h('li',{text:'Ingen tidsgräns'}),
      h('li',{text: t('%1 av %2 försök kvar', left, maxA)}),
      h('li',{text:'Fel svar länkar tillbaka till rätt lektion'})));
    if(st.next) b.append(h('div',{cls:'banner warn'},
      h('span',{text:'Du har lektioner kvar i kursen. Du får göra provet ändå.'})));
    const start = h('button',{cls:'btn primary lg',type:'button',text:'Starta provet',
      onclick:()=>{
        quizRun = {quizId:q.id, courseId:c.id, items:drawItems(q), answers:{}, i:0, result:null};
        logEvent('started','quiz',q.id,{courseId:c.id});
        render();
      }});
    if(left <= 0 && !st.passed){ start.disabled = true;
      b.append(h('div',{cls:'banner err'},h('span',{text:'Inga försök kvar. Kontakta din platsansvarige.'}))); }
    b.append(h('div',{cls:'row',style:'margin-top:16px'}, start,
      h('button',{cls:'btn ghost',type:'button',text:'Tillbaka',onclick:()=>go('#/kurs/'+c.id)})));
    app.append(card);
    return;
  }

  if(quizRun.result){ renderResult(app, c, q); return; }

  const items = quizRun.items;
  const it = items[quizRun.i];
  const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  b.append(h('div',{cls:'qhead'},
    h('div',{style:'flex:1'}, progBar(Math.round(quizRun.i/items.length*100))),
    h('div',{cls:'qn',text:t('Fråga %1 av %2', quizRun.i+1, items.length)})));
  if(it.intro) b.append(h('p',{cls:'muted'},inline(it.intro)));
  b.append(h('p',{cls:'qstem'},inline(it.stem)));

  if(it.type === 'ordering'){
    const order = quizRun.answers[it.id] || it.options.map(o=>o.id);
    quizRun.answers[it.id] = order;
    const ul = h('ol',{cls:'ordl'});
    const paint = () => {
      ul.replaceChildren(...order.map((oid,idx) => {
        const o = it.options.find(x=>x.id===oid);
        return h('li',null,
          h('span',{cls:'oi',text:(idx+1)+'. '+o.text}),
          h('span',{cls:'ordbtns'},
            h('button',{cls:'btn sm',type:'button','aria-label':'Flytta upp',text:'↑',disabled:idx===0||null,
              onclick:()=>{ [order[idx-1],order[idx]]=[order[idx],order[idx-1]]; paint(); }}),
            h('button',{cls:'btn sm',type:'button','aria-label':'Flytta ner',text:'↓',disabled:idx===order.length-1||null,
              onclick:()=>{ [order[idx+1],order[idx]]=[order[idx],order[idx+1]]; paint(); }})));
      }));
    };
    paint();
    b.append(ul);
  } else {
    const multi = it.type === 'multi';
    const opts = h('div',{cls:'opts',role: multi?'group':'radiogroup'});
    for(const o of (it.options||[])){
      const cur = quizRun.answers[it.id];
      const on = multi ? (cur||[]).includes(o.id) : cur === o.id;
      const inp = h('input',{type: multi?'checkbox':'radio', name:'q_'+it.id, checked:on||null});
      const lab = h('label',{cls:'opt'+(on?' on':'')}, inp, h('span',{text:o.text}));
      inp.addEventListener('change', () => {
        if(multi){
          const s = new Set(quizRun.answers[it.id]||[]);
          inp.checked ? s.add(o.id) : s.delete(o.id);
          quizRun.answers[it.id] = [...s];
        } else quizRun.answers[it.id] = o.id;
        render();
      });
      opts.append(lab);
    }
    b.append(opts);
  }

  const answered = quizRun.answers[it.id] != null &&
    (!Array.isArray(quizRun.answers[it.id]) || quizRun.answers[it.id].length > 0);
  const last = quizRun.i === items.length - 1;
  b.append(h('div',{cls:'row'},
    h('button',{cls:'btn',type:'button',text:'Föregående',disabled: quizRun.i===0||null,
      onclick:()=>{ quizRun.i--; render(); }}),
    h('div',{cls:'spacer'}),
    h('button',{cls:'btn primary',type:'button',text: last?'Lämna in':'Nästa',disabled:!answered||null,
      onclick:()=>{
        if(!last){ quizRun.i++; render(); return; }
        const r = scoreAttempt(q, items, quizRun.answers);
        quizRun.result = r;
        logEvent(r.passed?'passed':'failed','quiz',q.id,{courseId:c.id, courseVersion:c.version},
          {score:r.score, of:items.length});
        if(r.passed && maybeCompleteCourse(c)) toast('Kursen är klar');
        render();
      }})));
  app.append(card);
}

function renderResult(app, c, q){
  const r = quizRun.result;
  const card = h('div',{cls:'card qwrap'},h('div',{cls:'card-b'}));
  const b = card.firstChild;
  b.append(h('h1',{text: r.passed ? 'Godkänd' : 'Inte godkänd den här gången'}));
  b.append(h('div',{cls:'banner '+(r.passed?'ok':'warn')},
    h('span',{text:t('Resultat %1% · gränsen går vid %2%', r.score,
                      Math.round((q.passScore||0.8)*100))})));
  if(!r.passed) b.append(h('p',{text:'Nedan står vad som blev fel och var du läser om det.'}));

  for(const p of r.per){
    if(p.ok && r.passed) continue;                 // vid godkänt visas bara det som blev fel
    const box = h('div',{cls:'res '+(p.ok?'good':'bad')});
    box.append(h('div',{cls:'rq'},inline(p.item.stem)));
    box.append(h('div',{cls:'small',style:'color:'+(p.ok?'var(--ok)':'var(--err)'),
      text: p.ok ? 'Rätt' : 'Fel svar'}));
    /* Klätterverket: frågans förklaring, om redaktören skrivit en. Att få
       veta VARFÖR är det som gör att ett fel svar lär något. */
    if(p.item.why) box.append(h('div',{cls:'why'}, h('b',{text:t('Varför') + ': '}), inline(p.item.why)));
    if(!p.ok && p.key && p.key.remediation){
      const [lid, frag] = String(p.key.remediation).split('#');
      const l = lesson(lid);
      if(l) box.append(h('div',{style:'margin-top:8px'},
        h('button',{cls:'btn sm',type:'button',
          text: t('Läs om: %1', l.title) + (frag ? ' (' + t('vid %1s', frag.replace('at','').replace('=','')) + ')' : ''),
          onclick:()=>{ quizRun = null; go('#/lektion/'+c.id+'/'+lid); }})));
    }
    b.append(box);
  }
  const st = courseState(c);
  const maxA = (q.attempts && q.attempts.max) || 3;
  b.append(h('div',{cls:'row',style:'margin-top:16px'},
    h('button',{cls:'btn',type:'button',text:'Till kursen',onclick:()=>{ quizRun=null; go('#/kurs/'+c.id); }}),
    r.passed && c.certificate && c.certificate.issue
      ? h('button',{cls:'btn primary',type:'button',text:'Hämta ditt intyg',
          onclick:()=>{ quizRun=null; go('#/intyg'); }})
      : (st.attempts < maxA
          ? h('button',{cls:'btn primary',type:'button',text:'Gör om provet',
              onclick:()=>{ quizRun=null; render(); }})
          : h('span',{cls:'small muted',text:'Inga försök kvar.'}))));
  app.append(card);
}

/* ============================== RAPPORT ==============================
   Tre nivåer: översikt per kurs, drilldown till namnlista, och intygsvy.
   Aggregeringen sker över alla personer i organisationen — i skarp drift
   från servern, här ur den lokala loggen.                              */
const RSTATUS = {
  ej:    ['n',    'Ej påbörjad'],
  pagar: ['plan', 'Pågår'],
  klar:  ['fakt', 'Klar']
};
function statusTag(st){
  const [cls, label] = RSTATUS[st] || ['n','–'];
  return h('span',{cls:'tag '+cls, text:label});
}
function reportHeader(active){
  const sc  = reportScope();
  const box = h('div');
  const alla = sc === '*';
  const namn = alla ? t('Alla anläggningar') : (tenantName(sc) || (P.user && P.user.tenantName) || null);
  const n = orgPeople().length;

  box.append(h('div',{cls:'row',style:'margin-bottom:6px'},
    h('h1',{style:'margin:0',text: namn ? t('Rapport · %1', namn) : 'Rapport'}),
    h('div',{cls:'spacer'}),
    h('span',{cls:'small muted',
      text: alla ? t('%1 användare på %2 anläggningar', n, knownTenants().length)
                 : (n===1 ? t('%1 användare', n) : t('%1 användare på anläggningen', n))})));

  /* Organisationsväljaren finns bara för Clira-roller. Kundens egen
     administratör har inget att välja mellan — och ska inte ha det.   */
  const sbar = syncReportBar(); if(sbar) box.append(sbar);
  if(isClira()) box.append(cliraScopeBar());

  const tabs = h('div',{cls:'edtabs',style:'margin-bottom:14px'});
  const items = [['over','Översikt','#/rapport'], ['cert','Intyg','#/rapport/intyg']];
  if(demandRows(sc).length || isClira()) items.push(['efter','Efterfrågan','#/rapport/efterfragan']);
  if(isClira()) items.push(['org','Anläggningar','#/rapport/org'],
                           ['insyn','Insynslogg','#/rapport/insyn']);
  for(const [id, label, hash] of items)
    tabs.append(h('button',{cls: id===active?'on':'', type:'button', text:label, onclick:()=>go(hash)}));
  box.append(tabs);

  if(!isClira() && !sc) box.append(h('div',{cls:'banner warn'},h('span',{
    text:'Rapporten visar bara dig. Platsansvariga ser hela sin anläggning — vilka som är platsansvariga anges under Inställningar i redaktörsläget. Vill du se hur vyn fungerar kan du fylla på med exempeldata via Data-menyn.'})));
  return box;
}
/* Clira-radens två uppgifter: säga rakt ut att detta är kunddata, och
   låta den som har rollen välja en kund eller se alla på en gång. */
function cliraScopeBar(){
  const sc = reportScope();
  const ts = knownTenants();
  const sel = h('select',{cls:'f'});
  sel.append(h('option',{value:'*',text:t('Alla anläggningar (%1)', ts.length)}));
  for(const x of ts)
    sel.append(h('option',{value:x.id, text: x.name + ' · ' + t('%1 användare', x.n)}));
  const utan = unassignedPeople().length;
  if(utan) sel.append(h('option',{value:'-',
    text: t('Utan anläggning') + ' · ' + t('%1 användare', utan)}));
  sel.value = sc || '*';
  sel.addEventListener('change', () => { setReportScope(sel.value); render(); });

  return h('div',{cls:'banner info',style:'margin-bottom:12px'},
    h('span',{style:'font-weight:600',text:'Central insyn'}),
    h('span',{text: t(roleDef().label) + t(' — du ser anläggningarnas data i egenskap av central roll. Varje uppslag skrivs i insynsloggen.')}),
    h('div',{cls:'spacer'}),
    h('label',{cls:'small',style:'display:flex;gap:7px;align-items:center'},
      h('span',{text:'Anläggning'}), sel));
}

/* ---------------- Översikt ---------------- */
function viewReport(){
  const app = APP(); app.replaceChildren();
  auditAccess('översikt', reportScope());
  app.append(reportHeader('over'));

  const sc = reportScope();
  const alla = sc === '*';
  const people = orgPeople();
  /* Låsta kurser hör inte i kundens rapport: de skulle stå på 0 % för alla
     och se ut som ett misslyckande i stället för något de inte har köpt.
     De finns i stället under Efterfrågan. */
  const courses = visibleCourses()
    .filter(c => courseState(c, 'x').total > 0)
    .filter(c => alla || !isLocked(c, sc));
  const sums = courses.map(c => ({c, s: orgCourseSummary(c)}));

  /* Har börjat = minst en kurs påbörjad. Har slutfört = minst en klar. */
  const startedAny = people.filter(p =>
    courses.some(c => courseState(c, p.userId).started)).length;
  const doneAny = people.filter(p =>
    courses.some(c => courseState(c, p.userId).completed)).length;
  const certs = orgCertificates();
  const soon = certs.filter(c => c.valid && dagarTill(c.validUntil) < 90).length;
  const pct = n => people.length ? Math.round(n/people.length*100) + '%' : '0%';

  app.append(h('div',{cls:'kpis'},
    kpi('Användare', String(people.length),
        alla ? t('på %1 anläggningar', knownTenants().length) : 'på anläggningen'),
    kpi('Har börjat', pct(startedAny), t('%1 av %2 har loggat in och startat', startedAny, people.length), 'plan'),
    kpi('Har slutfört', pct(doneAny), t('%1 har minst en kurs klar', doneAny), 'ok'),
    kpi('Giltiga intyg', String(certs.filter(c=>c.valid).length),
        alla ? 'på alla anläggningar' : 'på anläggningen', 'plan'),
    kpi('Går ut snart', String(soon), 'inom 90 dagar', soon?'warn':'')));

  if(alla) app.append(h('div',{cls:'banner'},
    h('span',{cls:'small muted',
      text:'Siffrorna ovan är summerade över samtliga anläggningar. Vill du jämföra dem finns en rad per anläggning under fliken Anläggningar.'}),
    h('div',{cls:'spacer'}),
    h('button',{cls:'btn sm',type:'button',text:'Per anläggning',onclick:()=>go('#/rapport/org')})));

  if(people.length > 1){
    const ejBorjat = people.length - startedAny;

  if(!c){ app.append(h('div',{cls:'nores',text:'Utbildningen finns inte.'})); return; }

  const alla = reportScope() === '*';
  const s = orgCourseSummary(c);
  const f = route.filter || 'alla';
  app.append(h('div',{cls:'crumb'},
    h('button',{cls:'link',type:'button',text:'Rapport',onclick:()=>go('#/rapport')}),
    h('span',{text:'/'}), h('span',{text:c.title})));
  app.append(h('h2',{style:'margin:0 0 4px',text:c.title}));
  app.append(h('p',{cls:'muted small',
    text: t('%1 användare · %2 klara · %3 pågår · %4 har inte börjat', s.n, s.klar, s.pagar, s.ej)}));

  const chips = h('div',{cls:'row',style:'margin:12px 0'});
  for(const [id,label,n] of [['alla','Alla',s.n],['ej','Har inte börjat',s.ej],
                             ['pagar','Pågår',s.pagar],['klar','Klara',s.klar]])

      text: label + ' (' + n + ')', onclick:()=>go('#/rapport/kurs/'+c.id+'/'+id)}));
  app.append(chips);

  /* Ordningen sätter dem som behöver en insats först. */
  const rank = {ej:0, pagar:1, klar:2};
  const rows = s.rows

    .sort((a,b) => (alla ? (a.tenantName||'').localeCompare(b.tenantName||'','sv') : 0)

      .map(x=>h('th',{text:x})))));
  const tb = h('tbody');
  for(const r of rows){
    tb.append(add(h('tr'),
      h('td',null,h('b',{text:r.name})),
      alla ? h('td',null, r.tenantName
        ? h('button',{cls:'link small',type:'button',text:r.tenantName,
            onclick:()=>{ setReportScope(r.tenantId); go('#/rapport/kurs/'+c.id+'/'+f); }})
        : h('span',{cls:'muted small',text:'–'})) : null,
      h('td',{cls:'small muted',text:r.userId}),
      h('td',null,statusTag(r.status)),
      h('td',null,h('div',{style:'display:flex;gap:9px;align-items:center;min-width:140px'},
        h('span',{cls:'mono small',style:'width:36px',text:r.pct+'%'}),
        h('div',{style:'flex:1'},progBar(r.pct, r.status==='klar')),
        h('span',{cls:'small muted',style:'white-space:nowrap',text:r.done+'/'+r.total}))),
      h('td',{cls:'small muted',text: r.status==='klar' ? '–' : r.minutesLeft + ' min'}),
      h('td',null, !c.quizId ? h('span',{cls:'muted small',text:'–'})
        : r.passed ? h('span',{cls:'tag fakt',text:r.best+'%'})
        : r.attempts ? h('span',{cls:'tag warn',text:t('%1 försök', r.attempts)})
        : h('span',{cls:'muted small',text:'Ej gjort'})),
      h('td',{cls:'mono small',text: r.last ? new Date(r.last).toISOString().slice(0,10) : '–'})));
  }

  tbl.append(tb); tw.firstChild.append(tbl);
  app.append(tw);

  /* Riktade insatser: adresserna ut, eller hela listan till kalkylark. */
  app.append(h('div',{cls:'row',style:'margin-top:14px'},
    h('button',{cls:'btn',type:'button',
      text:'Kopiera e-postadresser (' + rows.length + ')',
      onclick:()=>copyText(rows.map(r=>r.userId).join('; '),
        rows.length + ' adresser kopierade')}),
    h('button',{cls:'btn',type:'button',text:'Exportera listan (CSV)',
      onclick:()=>exportCsv('academy-' + c.id + '-' + f + '.csv',
        ['Namn', ...(alla?['Anläggning']:[]), 'E-post','Status','Framsteg %','Klara lektioner','Av totalt','Minuter kvar','Prov','Senast aktiv'],
        rows.map(r=>[r.name, ...(alla?[r.tenantName||'']:[]), r.userId, (RSTATUS[r.status]||[])[1]||'', r.pct, r.done, r.total,
                     r.status==='klar'?0:r.minutesLeft,
                     r.passed ? r.best+'%' : (r.attempts ? t('%1 försök', r.attempts) : 'Ej gjort'),
                     r.last ? new Date(r.last).toISOString().slice(0,10) : '']))}),
    h('div',{cls:'spacer'}),
    h('span',{cls:'small muted',
      text:'I skarp drift kan samma urval få en påminnelse direkt härifrån.'})));
}

/* ---------------- Intyg i organisationen ---------------- */
function viewReportCerts(){
  const app = APP(); app.replaceChildren();
  auditAccess('intyg', reportScope());
  app.append(reportHeader('cert'));

  const alla = reportScope() === '*';
  const all = orgCertificates();
  const people = orgPeople();
  let f = 'giltiga';
  let q = '';

  const wrap = h('div');
  const draw = () => {
    wrap.replaceChildren();
    const needle = q.trim().toLowerCase();
    const list = all
      .filter(c =>
        f==='alla' ? true :
        f==='snart' ? (c.valid && dagarTill(c.validUntil) < 90) :
        f==='utgangna' ? !c.valid : c.valid)
      /* Supportfallet: någon ringer och undrar om en namngiven person har
         ett giltigt intyg. Sökningen ska hitta hen på namn, adress, kurs
         eller verifikationskod utan att man först måste veta vilken kund
         hen tillhör.                                                    */
      .filter(c => !needle || [c.name, c.userId, c.title, c.code, c.tenantName||'']
        .some(x => String(x).toLowerCase().includes(needle)));

    if(!list.length){
      wrap.append(h('div',{cls:'card'},h('div',{cls:'nores',
        text: needle ? t('Ingen träff på "%1" i den gruppen.', q.trim())
          : f==='alla' ? 'Inga intyg har utfärdats ännu.' : 'Inga intyg i den gruppen.'})));
    } else {
      const tw = h('div',{cls:'card'},h('div',{cls:'tw'}));
      const tbl = h('table');
      tbl.append(h('thead',null,h('tr',null,
        ['Namn', ...(alla?['Anläggning']:[]), 'E-post','Utbildning','Utfärdat','Giltigt till','Kvar','Resultat','Verifikationskod']
          .map(x=>h('th',{text:x})))));
      const tb = h('tbody');
      for(const cert of list){
        const d = dagarTill(cert.validUntil);
        tb.append(add(h('tr'),
          h('td',null,h('b',{text:cert.name})),
          alla ? h('td',{cls:'small',text: cert.tenantName || '–'}) : null,
          h('td',{cls:'small muted',text:cert.userId}),
          h('td',{text:cert.title}),
          h('td',{cls:'mono small',text:cert.issued}),
          h('td',{cls:'mono small',text:cert.validUntil}),
          h('td',null, !cert.valid ? h('span',{cls:'tag err',text:'Utgånget'})
            : d < 90 ? h('span',{cls:'tag warn',text:d + ' dagar'})
            : h('span',{cls:'small muted',text:t('%1 mån', Math.round(d/30))})),
          h('td',null,h('span',{cls:'tag fakt',text:cert.score+'%'})),
          h('td',{cls:'mono small',text:cert.code})));
      }
      tbl.append(tb); tw.firstChild.append(tbl);
      wrap.append(tw);
      wrap.append(h('div',{cls:'row',style:'margin-top:14px'},
        h('button',{cls:'btn',type:'button',text:'Kopiera e-postadresser (' + list.length + ')',
          onclick:()=>copyText([...new Set(list.map(c=>c.userId))].join('; '), 'Adresser kopierade')}),
        h('button',{cls:'btn',type:'button',text:'Exportera (CSV)',
          onclick:()=>exportCsv('academy-intyg-' + f + '.csv',
            ['Namn', ...(alla?['Anläggning']:[]), 'E-post','Utbildning','Utfärdat','Giltigt till','Resultat','Verifikationskod'],
            list.map(c=>[c.name, ...(alla?[c.tenantName||'']:[]), c.userId,c.title,c.issued,c.validUntil,c.score+'%',c.code]))}),
        h('div',{cls:'spacer'}),
        h('span',{cls:'small muted',text: t('%1 av %2 intyg', list.length, all.length)})));
    }
  };

  const giltiga = all.filter(c=>c.valid);
  const utan = people.filter(p => !giltiga.some(c => c.userId===p.userId)).length;
  app.append(h('div',{cls:'kpis'},
    kpi('Giltiga intyg', String(giltiga.length),
        alla ? 'på alla anläggningar' : 'på anläggningen', 'ok'),
    kpi('Personer med intyg', String(new Set(giltiga.map(c=>c.userId)).size),
        t('av %1 användare', people.length), 'plan'),
    kpi('Utan något intyg', String(utan), 'personer'),
    kpi('Går ut inom 90 dagar', String(giltiga.filter(c=>dagarTill(c.validUntil)<90).length),
        'behöver förnyas', giltiga.filter(c=>dagarTill(c.validUntil)<90).length ? 'warn' : '')));

  const chips = h('div',{cls:'row',style:'margin:0 0 14px'});
  for(const [id,label] of [['giltiga','Giltiga'],['snart','Går ut inom 90 dagar'],
                           ['utgangna','Utgångna'],['alla','Alla']]){
    const b = h('button',{cls:'btn sm'+(f===id?' primary':''),type:'button',text:label,
      onclick:()=>{ f=id; [...chips.children].forEach(x=>x.classList.remove('primary'));
                    b.classList.add('primary'); draw(); }});
    chips.append(b);
  }
  const sok = h('input',{type:'search',cls:'f',style:'min-width:230px',
    placeholder: alla ? 'Sök namn, e-post, kurs, anläggning eller kod' : 'Sök namn, e-post, kurs eller kod'});
  sok.addEventListener('input', () => { q = sok.value; draw(); });
  chips.append(h('div',{cls:'spacer'}), sok);

  app.append(chips, wrap);
  draw();
}

                                 : h('span',{cls:'small',text:r.scopeLabel})),
      h('td',{cls:'small muted',text:r.view})));
  }
  tbl.append(tb); tw.firstChild.append(tbl);
  app.append(tw);
  if(rows.length > 300) app.append(h('p',{cls:'small muted',
    text:t('Visar de 300 senaste av %1 uppslag.', rows.length)}));

  app.append(h('div',{cls:'row',style:'margin-top:14px'},
    h('button',{cls:'btn',type:'button',text:'Exportera hela loggen (CSV)',
      onclick:()=>exportCsv('academy-insynslogg.csv',
        ['Tidpunkt','Vem','Roll','Omfång','Vy'],
        rows.map(r=>[r.ts, r.who, r.role, r.scopeLabel, r.view]))})));
}

/* ---------------- små verktyg ---------------- */
function copyText(txt, msg){
  const done = () => toast(msg || 'Kopierat');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => fallback());
  } else fallback();
  function fallback(){
    const ta = h('textarea',{style:'position:fixed;left:-9999px'});
    ta.value = txt; document.body.append(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('Kunde inte kopiera — markera i tabellen i stället'); }
    ta.remove();
  }
}
function exportCsv(name, head, rows){
  const q = v => {
    const s = String(v==null?'':v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const b = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = h('a',{href:URL.createObjectURL(b), download:name});
  document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Exporterat');
}

/* ============================== ANVÄNDARE ==============================
   Speglar den åtkomstmodell förslaget beskriver: verifierad e-post plus
   domänmatchning mot kundens registrerade domäner. Verifieringslänken
   skickas av servern i skarp drift — här hoppas det steget över.        */
const FREEMAIL = ['gmail.com','hotmail.com','outlook.com','live.se','yahoo.com','icloud.com','msn.com'];
function emailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }
function domainOf(e){ return String(e).split('@')[1]?.toLowerCase() || ''; }
function domainVerdict(e){
  const d = domainOf(e);
  /* Klätterverket: instruktörer och extrapersonal har ofta bara en privat
     adress. Inställningen allowFreemail avgör om sådana släpps in. */
  if(FREEMAIL.includes(d) && !(C.settings && C.settings.allowFreemail))
    return {ok:false, msg:'Använd din tjänsteadress — fria e-postkonton släpps inte in.'};

  /* Cliras egna adresser blir en Clira-roll med insyn över kundgränsen.
     I skarp drift kommer rollen från eSource och kontrolleras där; här
     räcker domänen för att kunna visa vyn.                            */
  if(isCliraEmail(e)) return {ok:true, review:false, clira:true,
    msg:'Central adress: du får insyn i samtliga anläggningar. Uppslagen loggas.'};

  const cust = customerFor(e) || demoTenantFor(e);
  if(cust) return {ok:true, review:false, customer:cust, msg:t('Du kopplas till %1.', cust.name)};

  const allow = (C.settings && C.settings.emailDomains) || [];
  if(allow.some(x => d === x.toLowerCase() || d.endsWith('.' + x.toLowerCase())))
    return {ok:true, msg:'', review:false};

  if(!(C.customers||[]).length && !allow.length) return {ok:true, msg:'', review:false};
  /* Har ingen anläggning domäner väljer man anläggning i listan i stället —
     då finns inget att granska. */
  if(!(C.customers||[]).some(c => (c.domains||[]).length)) return {ok:true, msg:'', review:false};

  return {ok:true, review:true,
    msg:'Adressen hör inte till någon registrerad anläggning. I skarp drift hamnar ansökan i granskningskö hos utbildningsansvarig.'};
}
function askUser(force){
  return new Promise(res => {
    modal('narrow', force ? 'Byt användare' : 'Välkommen till Klätterverket Academy', (m, close) => {
      m.append(h('p',{cls:'muted',text:'Ditt namn står på intyget. Välj den anläggning du främst jobbar på — då hamnar dina framsteg i rätt rapport.'}));
      const g = h('div',{cls:'fgrid'});
      const nIn = h('input',{type:'text',value: P.user?P.user.name:'',placeholder:'För- och efternamn'});
      const eIn = h('input',{type:'email',value: P.user?P.user.email:'',placeholder:'namn@exempel.se'});
      const err = h('div',{cls:'hint',style:'color:var(--err)'});
      const note = h('div',{cls:'hint'});
      /* Klätterverket: alla anläggningar delar e-postdomän, så domänen kan
         inte avgöra var man jobbar. Man väljer själv — och matchar adressen
         ändå en anläggning med egen domän väljs den automatiskt. */
      const halls = (C.customers||[]);
      const hSel = halls.length ? h('select',{}) : null;
      if(hSel){
        hSel.append(h('option',{value:'',text:'Välj anläggning…'}));
        for(const cu of halls) hSel.append(h('option',{value:cu.id,text:cu.name}));
        if(P.user && P.user.tenantId && halls.some(x => x.id === P.user.tenantId)) hSel.value = P.user.tenantId;
      }
      g.append(h('div',{cls:'fld full'},h('label',{text:'Namn'}),nIn),
               h('div',{cls:'fld full'},h('label',{text:'E-postadress'}),eIn,note,err),
               hSel ? h('div',{cls:'fld full'},h('label',{text:'Anläggning'}),hSel) : null);
      m.append(g);
      const check = () => {
        note.textContent = ''; err.textContent = '';
        const v = eIn.value.trim();
        if(!v) return;
        if(!emailOk(v)){ err.textContent = 'Det ser inte ut som en e-postadress.'; return; }
        const d = domainVerdict(v);
        if(!d.ok){ err.textContent = d.msg; return; }
        if(d.msg){
          note.textContent = d.msg;
          note.style.color = d.customer ? 'var(--ok)' : d.clira ? 'var(--brand)' : '';
        }
        if(hSel){
          if(d.customer && !d.customer.demo){ hSel.value = d.customer.id; hSel.disabled = true; }
          else hSel.disabled = false;
        }
      };
      eIn.addEventListener('input', check);
      const save = h('button',{cls:'btn primary',type:'button',text:'Fortsätt',onclick:()=>{
        const n = nIn.value.trim(), e = eIn.value.trim().toLowerCase();
        if(n.length < 2){ err.textContent = 'Fyll i ditt namn.'; return; }
        if(!emailOk(e)){ err.textContent = 'Fyll i en giltig e-postadress.'; return; }
        const d = domainVerdict(e);
        if(!d.ok){ err.textContent = d.msg; return; }
        const vald = (!d.customer && hSel && hSel.value) ? customerById(hSel.value) : null;
        const tid = d.customer ? d.customer.id : (vald ? vald.id : null);
        if(!tid && hSel && !d.clira){ err.textContent = t('Välj vilken anläggning du jobbar på.'); hSel.focus(); return; }
        P.user = {name:n, email:e, domain:domainOf(e), review: !!d.review && !vald, since: today(),
                  tenantId: tid,
                  tenantName: d.customer ? d.customer.name : (vald ? vald.name : null),
                  role: deriveRole(e, tid)};
        P.view = {};                      // omfånget nollställs vid byte av användare
        registerPerson(P.user);
        saveProgress(); close(); res(true);
      }});
      if(syncUrl()) m.append(h('p',{cls:'hint',style:'margin:14px 0 0',
        text:'Dina framsteg sparas i Klätterverkets utbildningsregister, så att du kan fortsätta på en annan dator eller i mobilen och dina intyg finns kvar. Har du gått utbildningar tidigare hämtas de när du loggar in med samma e-post.'}));
      m.append(h('div',{cls:'row',style:'margin-top:16px'}, h('div',{cls:'spacer'}), save));
    }, null);
  });
}
